escription":"Купчиха пьёт чай за столом, заставленным фруктами, выпечкой и посудой. Её крупная, спокойная фигура объединяет весь щедрый натюрморт, а за спиной продолжается летняя городская жизнь. Кустодиев насыщает сцену цветом и подробностями, передавая удовольствие от медленного чаепития и устойчивого домашнего уклада. Борис Кустодиев написал картину в 1918 году. Место хранения: Государственный Русский музей, Санкт-Петербург.","sources":[{"label":"Кустодиев Б. М. Купчиха за чаем - Виртуальный Русск…","url":"https://rusmuseumvrm.ru/data/collections/painting/19_20/zh_1868/index.php?lang=ru"},{"label":"Кустодиев Б.М. Купчиха за чаем. 1918","url":"https://www.rmgallery.rusmuseumvrm.ru/ru/804"}],"tags":["Россия XX века","Русская классика"],"position":"center center","originalImage":"originals/148.jpg","displayFragment":"fragments/148.jpg"},{"author":"Любовь Попова","title":"Живописная архитектоника","year":"1918","museum":"Местонахождение не установлено","image":"originals/149.jpg","description":"Разноцветные плоскости пересекаются и накладываются друг на друга, словно части сложной конструкции. Некоторые формы выглядят устойчивыми, другие будто сдвигают их в сторону. Попова создаёт ощущение веса и равновесия одними цветами и направлениями, придавая абстрактной композиции почти архитектурную убедительность. Любовь Попова написала картину в 1918 году. Место хранения: Местонахождение не установлено.","sources":[{"label":"Liubov Popova","url":"https://www.moma.org/documents/moma_catalogue_328_300063008.pdf"},{"label":"Pioneers. Women Artists of the Russian Avant-Garde…","url":"https://www.museothyssen.org/en/visit/thematic-tours/pioneers-women-artists-russian-avant-garde"}],"tags":["Абстракция","Россия XX века"],"position":"center 28%","originalImage":"originals/149.jpg","displayFragment":"fragments/149.jpg"},{"author":"Марк Шагал","title":"Над городом","year":"1914–1918","museum":"Государственная Третьяковская галерея, Москва","image":"originals/150.jpg","description":"Шагал и Белла летят над крышами, улицами и дворами небольшого города. Привычная жизнь остаётся внизу, а их вытянутые фигуры свободно пересекают небо. Художник делает чувство близости видимой частью мира, превращая знакомый городской пейзаж в пространство тихого, невозможного полёта. Марк Шагал написал картину в 1914–1918 годах. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Над городом | Каталог иллюстраций журнала \"ТРЕТЬЯКО…","url":"https://tretyakovgallerymagazine.ru/catalog/picture/13601"},{"label":"Новая Третьяковка - Третьяковская галерея","url":"https://www.tretyakovgallery.ru/for-visitors/museums/novaya-tretyakovka/"}],"tags":["Европейский модернизм XX века","Россия XX века"],"position":"center center","originalImage":"originals/150.jpg","displayFragment":"fragments/150.jpg"},{"author":"Александра Экстер","title":"Город ночью","year":"1919","museum":"Государственный Русский музей, Санкт-Петербург","image":"originals/151.jpg","description":"Ночной город возникает из пересекающихся домов, огней и ломаных линий улиц. Отдельные фрагменты будто увидены на ходу и собраны в одно плотное впечатление. Экстер соединяет их контрастным цветом и меняющимися направлениями, передавая ощущение городской жизни, которая продолжается за пределами видимого пространства. Работу обычно относят к 1919 году, но датировка остаётся предварительной. Место хранения: Государственный Русский музей, Санкт-Петербург.","sources":[{"label":"File:Aleksandra-Exter. City at Night. 1919.jpg - Wi…","url":"https://commons.wikimedia.org/wiki/File%3AAleksandra-Exter._City_at_Night._1919.jpg"},{"label":"Alexandra Exter (1882-1949) - Association Alexandra…","url":"https://alexandra-exter.net/en/biography/"}],"tags":["Абстракция","Россия XX века"],"position":"center 28%","originalImage":"originals/151.jpg","displayFragment":"fragments/151.jpg"},{"author":"Эль Лисицкий","title":"Клином красным бей белых!","year":"1919–1920","museum":"Библиотека Конгресса, Вашингтон","image":"originals/152.jpg","description":"Красный клин резко врезается в белый круг, окружённый чёрными и светлыми плоскостями. Наклонные линии и смещённые надписи усиливают ощущение удара. Лисицкий переводит политический лозунг в предельно ясное столкновение форм, благодаря которому действие считывается ещё до чтения текста. Эль Лисицкий создал плакат в 1919–1920 годах. Место хранения: Библиотека Конгресса, Вашингтон.","sources":[{"label":"Klinom krasnym bei belykh | Library of Congress","url":"https://www.loc.gov/item/2016650089/"},{"label":"Beat the Whites with the Red Wedge — Wikipedia","url":"https://en.wikipedia.org/wiki/Beat_the_Whites_with_the_Red_Wedge"}],"tags":["Россия XX века"],"position":"center center","originalImage":"originals/152.jpg","displayFragment":"fragments/152.jpg"},{"author":"Клод Моне","title":"Японский мостик","year":"около 1920–1922","museum":"Музей современного искусства (MoMA), Нью-Йорк","image":"originals/153.jpg","description":"Японский мостик почти исчезает среди густых красных, зелёных и жёлтых мазков. Его дуга лишь ненадолго удерживает знакомый вид сада, прежде чем взгляд снова погружается в цвет. В этой поздней работе Моне делает краску особенно плотной и подвижной, передавая ощущение природы, увиденной сквозь яркое внутреннее впечатление. Клод Моне написал картину примерно в 1920–1922 годах. Место хранения: Музей современного искусства (MoMA), Нью-Йорк.","sources":[{"label":"Claude Monet. The Japanese Footbridge. c. 1920-22 |…","url":"https://www.moma.org/collection/works/79254"},{"label":"Claude Monet — Musée Marmottan Monet","url":"https://www.marmottan.fr/en/collections/claude-monet/"}],"tags":["Импрессионизм и постимпрессионизм"],"position":"center center","originalImage":"originals/153.jpg","displayFragment":"fragments/153.jpg"},{"author":"Кузьма Петров-Водкин","title":"1918 год в Петрограде («Петроградская мадонна»)","year":"1920","museum":"Государственная Третьяковская галерея, Москва","image":"originals/154.jpg","description":"Женщина с ребёнком появляется перед городскими домами и улицей послереволюционного Петрограда. Её крупная, спокойная фигура резко отличается от небольших людей внизу. Петров-Водкин сближает материнский образ с иконой, сохраняя вокруг него повседневный город и чувство настороженного ожидания. Кузьма Петров-Водкин написал картину в 1920 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Петров-Водкин К. С. 1918 год в Петрограде - Виртуал…","url":"https://rusmuseumvrm.ru/data/collections/museums/gtg/petrov-vodkin_k.s._1918_god_v_petrograde._1920._gtg/index.php"},{"label":"Лекция «Кузьма Петров-Водкин» - Третьяковская галерея","url":"https://www.tretyakovgallery.ru/events/o/lektsiya-kuzma-petrov-vodkin-2026/"}],"tags":["Россия XX века"],"position":"center 28%","originalImage":"originals/154.jpg","displayFragment":"fragments/154.jpg"},{"author":"Фернан Леже","title":"Механические элементы","year":"1920","museum":"Местонахождение не установлено","image":"originals/155.jpg","description":"Круги, трубы и цветные детали плотно заполняют полотно, напоминая устройство незнакомой машины. Чёткие края и округлые объёмы заставляют взгляд постоянно переходить между плоскостью и глубиной. Леже передаёт энергию механического мира через повторение форм, не связывая их с работой конкретного устройства. Фернан Леже написал картину в 1920 году. Место хранения: Местонахождение не установлено.","sources":[{"label":"European master paintings from Swiss collections :…","url":"https://assets.moma.org/documents/moma_catalogue_2445_300297548.pdf"},{"label":"Fernand Léger. Le rythme de la vie moderne (1911-19…","url":"https://www.kunstmuseum.de/en/exhibition/fernand-leger-le-rythme-de-la-vie-moderne-1911-1924/"}],"tags":["Абстракция","Европейский модернизм XX века"],"position":"center 28%","originalImage":"originals/155.jpg","displayFragment":"fragments/155.jpg"},{"author":"Любовь Попова","title":"Пространственно-силовое построение","year":"1921","museum":"Государственная Третьяковская галерея, Москва","image":"originals/156.jpg","description":"Красные, жёлтые, зелёные и чёрные плоскости пересекаются под острыми углами. Каждая словно толкает соседнюю, меняя равновесие всей композиции. Попова усиливает ощущение давления и движения контрастными красками, превращая пространство картины в видимое взаимодействие направленных сил. Любовь Попова написала картину в 1921 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Живопись Поповой — Третьяковская галерея","url":"https://www.tretyakovgallery.ru/edu/o/zhivopisnaya-arkhitektonika-l-popovoy-avangard-1920-kh-godov/"},{"label":"Пространственно-силовое построение — Третьяковская галерея","url":"https://my.tretyakov.ru/app/masterpiece/9090"}],"tags":["Абстракция","Россия XX века"],"position":"center 28%","originalImage":"originals/156.jpg","displayFragment":"fragments/156.jpg"},{"author":"Пабло Пикассо","title":"Три музыканта","year":"1921","museum":"Музей современного искусства (MoMA), Нью-Йорк","image":"originals/157.jpg","description":"Три костюмированных музыканта сидят рядом, почти сливаясь в общую мозаику. Их лица, руки и инструменты собраны из плоских цветных частей с резкими границами. Пикассо сохраняет характеры персонажей внутри этого узора, и неподвижная группа кажется объединённой ритмом совместной игры. Пабло Пикассо написал картину в 1921 году. Место хранения: Музей современного искусства (MoMA), Нью-Йорк.","sources":[{"label":"Pablo Picasso. Three Musicians. Fontainebleau, summ…","url":"https://www.moma.org/collection/works/78630/"},{"label":"Three Musicians — Wikipedia","url":"https://en.wikipedia.org/wiki/Three_Musicians"}],"tags":["Европейский модернизм XX века"],"position":"center center","originalImage":"originals/157.jpg","displayFragment":"fragments/157.jpg"},{"author":"Пауль Клее","title":"Сенекио","year":"1922","museum":"Художественный музей Базеля, Базель","image":"originals/158.jpg","description":"Округлое лицо разделено на цветные участки, напоминающие простую театральную маску. Несмотря на условность рисунка, в нём легко узнать взгляд и осторожное выражение. Клее соединяет детскую ясность геометрических форм с тонким различием оттенков, создавая портрет, который кажется одновременно знакомым и загадочным. Пауль Клее написал картину в 1922 году. Место хранения: Художественный музей Базеля, Базель.","sources":[{"label":"Kunstmuseum Basel – Schwerpunkte der Sammlung – Kun…","url":"https://kunstmuseumbasel.ch/de/sammlung/schwerpunkte"},{"label":"Senecio (Paul Klee)","url":"https://de.wikipedia.org/wiki/Senecio_%28Paul_Klee%29"}],"tags":["Абстракция","Европейский модернизм XX века"],"position":"center center","originalImage":"originals/158.jpg","displayFragment":"fragments/158.jpg"},{"author":"Робер Делоне","title":"Эйфелева башня и сады Марсова поля","year":"1922","museum":"Музей Хиршхорна, Вашингтон","image":"originals/159.jpg","description":"Эйфелева башня и сады Марсова поля показаны с высоты, меняющей привычные пропорции города. Дороги, клумбы и металлическая конструкция складываются в чередование дуг и углов. Делоне усиливает этот ритм ярким цветом, заставляя неподвижный городской вид напоминать медленное вращение. Робер Делоне написал картину в 1922 году. Место хранения: Музей Хиршхорна, Вашингтон.","sources":[{"label":"Artwork - Hirshhorn Museum and Sculpture Garden | S…","url":"https://hirshhorn.si.edu/collection/artwork/?edanUrl=edanmdm%3Ahmsg_86.1421"},{"label":"Eiffel Tower and Gardens, Champ de Mars (La Tour Ei…","url":"https://www.si.edu/object/eiffel-tower-and-gardens-champ-de-mars-la-tour-eiffel-et-jardin-du-champ-de-mars%3Ahmsg_86.1421"}],"tags":["Европейский модернизм XX века"],"position":"center 28%","originalImage":"originals/159.jpg","displayFragment":"fragments/159.jpg"},{"author":"Василий Кандинский","title":"Композиция VIII","year":"1923","museum":"Музей Соломона Гуггенхайма, Нью-Йорк","image":"originals/160.jpg","description":"На светлом фоне пересекаются круги, треугольники, прямые и изогнутые линии. У каждой формы свой масштаб и направление, поэтому взгляд движется между ними, как между разными звуками. Кандинский соединяет точную геометрию со свободным равновесием, оставляя достаточно воздуха для каждой части композиции. Василий Кандинский написал картину в 1923 году. Место хранения: Музей Соломона Гуггенхайма, Нью-Йорк.","sources":[{"label":"Composition 8 | Guggenheim Museum Bilbao","url":"https://www.guggenheim-bilbao.eus/en/learn/schools/teachers-guides/composition-8"},{"label":"VASILY KANDINSKY","url":"https://www.guggenheim.org/wp-content/uploads/2021/10/guggenheim-press-kit-vasily-kandinsky-around-the-circle-20211005.pdf"}],"tags":["Абстракция","Европейский модернизм XX века"],"position":"center center","originalImage":"originals/160.jpg","displayFragment":"fragments/160.jpg"},{"author":"Жоан Миро","title":"Карнавал Арлекина","year":"1924–1925","museum":"Художественный музей Буффало (AKG), Буффало","image":"originals/161.jpg","description":"Комната наполнена фантастическими существами, музыкальными знаками и предметами, которые словно обрели собственную жизнь. Тонкие линии соединяют их в запутанную, но лёгкую игру. Миро сохраняет намёки на привычный интерьер, позволяя воображению свободно менять размер, характер и назначение каждой вещи. Жоан Миро написал картину в 1924–1925 годах. Место хранения: Художественный музей Буффало (AKG), Буффало.","sources":[{"label":"Director’s Lecture Series 2016–2017, Lecture 2: Joá…","url":"https://buffaloakg.org/node/17380"},{"label":"Carnaval d'Arlequin (Carnaval d'Harlequin) - Joan M…","url":"https://artsandculture.google.com/asset/carnaval-d-arlequin-carnaval-d-harlequin-joan-mir%C3%B3/RgH8MMLuWyoUCA?hl=fr"}],"tags":["Европейский модернизм XX века","Сюрреализм"],"position":"center 28%","originalImage":"originals/161.jpg","displayFragment":"fragments/161.jpg"},{"author":"Василий Кандинский","title":"Жёлтое-красное-синее","year":"1925","museum":"Центр Помпиду, Париж","image":"originals/162.jpg","description":"Жёлтые, красные и синие формы распределены по полотну так, что одни кажутся лёгкими и открытыми, а другие — плотными и собранными. Между ними проходят линии, дуги и небольшие цветные знаки. Кандинский строит движение на различии этих впечатлений, позволяя цвету самому задавать настроение и направление взгляда. Василий Кандинский написал картину в 1925 году. Место хранения: Центр Помпиду, Париж.","sources":[{"label":"Gelb-Rot-Blau (Jaune-rouge-bleu) - Centre Pompidou","url":"https://www.centrepompidou.fr/fr/ressources/oeuvre/cEpEKE"},{"label":"Kandinsky - La musique des couleurs - Centre Pompidou","url":"https://www.centrepompidou.fr/fr/programme/agenda/evenement/iqFaNfK"}],"tags":["Абстракция","Европейский модернизм XX века"],"position":"center center","originalImage":"originals/162.jpg","displayFragment":"fragments/162.jpg"},{"author":"Тамара де Лемпицка","title":"Портрет герцогини де Ла Саль","year":"1925","museum":"Частное собрание","image":"originals/163.jpg","description":"Герцогиня де Ла Саль держится свободно и уверенно, положив одну руку в карман строгого тёмного костюма. Гладкие формы лица и рук сочетаются с резкими складками ткани. Лемпицка подчёркивает твёрдость позы и холодный блеск поверхностей, создавая светский портрет с почти скульптурной собранностью. Тамара де Лемпицка написала картину в 1925 году. Место хранения: Частное собрание.","sources":[{"label":"Portrait of the Duchess de La Salle, 1925 - DACS","url":"https://www.dacs.org.uk/artwork/portrait-of-the-duchess-de-la-salle-1925-62464"},{"label":"1925b – Tamara de Lempicka Estate","url":"https://tamaradelempicka.org/pages/1925b-1926a"}],"tags":["Европейский модернизм XX века"],"position":"center 28%","originalImage":"originals/163.jpg","displayFragment":"fragments/163.jpg"},{"author":"Тамара де Лемпицка","title":"Портрет маркиза Сомми","year":"1925","museum":"Частное собрание","image":"originals/164.jpg","description":"Маркиз Сомми появляется на фоне светлых геометрических плоскостей, подчёркивающих его тёмный костюм. Резкий свет придаёт лицу и ткани чёткий объём. Лемпицка соединяет элегантность светского образа с напряжённой точностью линий, благодаря чему портрет кажется строгим и немного отстранённым. Тамара де Лемпицка написала картину в 1925 году. Место хранения: Частное собрание.","sources":[{"label":"Tamara De Lempicka (1898-1980) , Portrait du Marqui…","url":"https://www.christies.com/lot/lot-5258567"},{"label":"1924b-1925a – Tamara de Lempicka Estate","url":"https://tamaradelempicka.org/pages/1924b-1925a"}],"tags":["Европейский модернизм XX века"],"position":"center 28%","originalImage":"originals/164.jpg","displayFragment":"fragments/164.jpg"},{"author":"Тамара де Лемпицка","title":"Русская танцовщица","year":"1925","museum":"Частное собрание","image":"originals/165.jpg","description":"Женщина в русском сценическом костюме спокойно сидит, сложив руки перед собой. Синие, красные и белые части одежды образуют крупный, отчётливый рисунок. Лемпицка подчёркивает плотность ткани и округлость фигуры, превращая неподвижную позу в выразительный образ сдержанной сценической силы. Тамара де Лемпицка написала картину в 1925 году. Место хранения: Частное собрание.","sources":[{"label":"1925b – Tamara de Lempicka Estate","url":"https://tamaradelempicka.org/pages/1925b-1926a"},{"label":"Список картин Тамары Лемпицкой (1921—1939)","url":"https://ru.wikipedia.org/wiki/%D0%A1%D0%BF%D0%B8%D1%81%D0%BE%D0%BA_%D0%BA%D0%B0%D1%80%D1%82%D0%B8%D0%BD_%D0%A2%D0%B0%D0%BC%D0%B0%D1%80%D1%8B_%D0%9B%D0%B5%D0%BC%D0%BF%D0%B8%D1%86%D0%BA%D0%BE%D0%B9_%281921%E2%80%941939%29"}],"tags":["Россия XX века"],"position":"center 28%","originalImage":"originals/165.jpg","displayFragment":"fragments/165.jpg"},{"author":"Василий Кандинский","title":"Несколько кругов","year":"1926","museum":"Музей Соломона Гуггенхайма, Нью-Йорк","image":"originals/166.jpg","description":"Разноцветные круги словно плавают в глубоком тёмном пространстве. Одни светятся изнутри, другие перекрывают соседние формы и кажутся почти прозрачными. Кандинский меняет их размеры и расположение, создавая ощущение медленного движения, в котором простая геометрия приобретает неожиданную глубину. Василий Кандинский написал картину в 1926 году. Место хранения: Музей Соломона Гуггенхайма, Нью-Йорк.","sources":[{"label":"Vasily Kandinsky | Several Circles | The Guggenheim…","url":"https://www.guggenheim.org/artwork/1992"},{"label":"VASILY KANDINSKY","url":"https://www.guggenheim.org/wp-content/uploads/2021/10/guggenheim-press-kit-vasily-kandinsky-around-the-circle-20211005.pdf"}],"tags":["Абстракция","Европейский модернизм XX века"],"position":"center 28%","originalImage":"originals/166.jpg","displayFragment":"fragments/166.jpg"},{"author":"Джорджия О’Киф","title":"Чёрный ирис (ранее «Чёрный ирис III»)","year":"1926","museum":"Метрополитен-музей, Нью-Йорк","image":"originals/167.jpg","description":"Ирис показан настолько близко, что его лепестки заполняют почти всё полотно. Светлые края постепенно переходят в тёмную глубину сердцевины, направляя взгляд внутрь цветка. О’Киф усиливает масштаб привычной природной формы, позволяя увидеть в ней сложный мир изгибов, складок и мягких цветовых переходов. Джорджия О’Киф написала картину в 1926 году. Место хранения: Метрополитен-музей, Нью-Йорк.","sources":[{"label":"Georgia O'Keeffe - Black Iris - The Metropolitan Mu…","url":"https://www.metmuseum.org/art/collection/search/489813"},{"label":"Black Iris, 1926 | Georgia O'Keeffe Museum: Access…","url":"https://access-ok.gokm.org/object/8629/"}],"tags":["Америка XX века"],"position":"center 28%","originalImage":"originals/167.jpg","displayFragment":"fragments/167.jpg"},{"author":"Александра Экстер","title":"Город","year":"1927","museum":"Местонахождение не установлено","image":"originals/168.jpg","description":"Дома, арки и лестницы образуют условный город, среди которого едва заметны маленькие люди. Крупные плоскости и ясные линии придают пространству сходство со сценой. Экстер выстраивает архитектуру так, что каждый проход и поворот обещает продолжение за пределами видимого изображения. Александра Экстер написала картину в 1927 году. Место хранения: Местонахождение не установлено.","sources":[{"label":"City, 1927 - Aleksandra Ekster - WikiArt.org","url":"https://www.wikiart.org/en/aleksandra-ekster/city-1927"},{"label":"Alexandra Exter (1882-1949) - Association Alexandra…","url":"https://alexandra-exter.net/biographie/"}],"tags":["Россия XX века"],"position":"center 28%","originalImage":"originals/168.jpg","displayFragment":"fragments/168.jpg"},{"author":"Александра Экстер","title":"Женщина с птицами","year":"1927–1928","museum":"Частное собрание","image":"originals/169.jpg","description":"Женщина в ярком платье сидит рядом с птицами и клеткой, погружённая в спокойную домашнюю сцену. Её лицо, одежда и окружающие вещи упрощены до широких цветовых плоскостей. Экстер связывает их мягким ритмом, сохраняя чувство уюта даже при условности рисунка. Александра Экстер написала картину в 1927–1928 годах. Место хранения: Частное собрание.","sources":[{"label":"Woman with birds, 1927 - 1928 - Aleksandra Ekster -…","url":"https://www.wikiart.org/en/aleksandra-ekster/woman-with-birds-1928"},{"label":"Alexandra Alexandrovna Exter | Artnet | Page 11","url":"https://www.artnet.de/k%C3%BCnstler/alexandra-exter/11"}],"tags":["Россия XX века"],"position":"center 28%","originalImage":"originals/169.jpg","displayFragment":"fragments/169.jpg"},{"author":"Александр Дейнека","title":"Зима. Девочка у окна","year":"1931","museum":"Государственная Третьяковская галерея, Москва","image":"originals/170.jpg","description":"Девочка стоит у окна и смотрит в заснеженный двор, а у её ног лежит собака. Тёмный силуэт ребёнка отделяет тёплое внутреннее пространство от холодного света снаружи. Дейнека оставляет немного подробностей, позволяя почувствовать сосредоточенность взгляда и тихую неподвижность зимнего дня. Александр Дейнека создал эту работу в 1931 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Зима. Девочка у окна | Каталог иллюстраций журнала…","url":"https://www.tg-m.ru/catalog/picture/5647"},{"label":"АЛЕКСАНДР ДЕЙНЕКА: ХУДОЖНИК ВО ВРЕМЕНИ | Журнал «ТР…","url":"https://tretyakovgallerymagazine.ru/articles/1-2011-30/aleksandr-deineka-khudozhnik-vo-vremeni"}],"tags":["Россия XX века"],"position":"center 28%","originalImage":"originals/170.jpg","displayFragment":"fragments/170.jpg"},{"author":"Жоан Миро","title":"Голландский интерьер I","year":"1928","museum":"Музей современного искусства (MoMA), Нью-Йорк","image":"originals/171.jpg","description":"Вокруг музыканта разворачивается странная жизнь цветных существ и преображённых домашних предметов. Привычная комната растягивается, изгибается и теряет устойчивые пропорции. Миро переосмысливает голландский интерьер XVII века, превращая его спокойный бытовой сюжет в лёгкую, фантастическую игру форм. Жоан Миро написал картину в 1928 году. Место хранения: Музей современного искусства (MoMA), Нью-Йорк.","sources":[{"label":"Joan Miró. Dutch Interior (I). Montroig, July-Decem…","url":"https://www.moma.org/collection/works/79023"},{"label":"IRO IN THE COLLECTION OF THE MUSEUM OF MODERN ART","url":"https://www.moma.org/documents/moma_master-checklist_326862.pdf"}],"tags":["Европейский модернизм XX века","Сюрреализм"],"position":"center 28%","originalImage":"originals/171.jpg","displayFragment":"fragments/171.jpg"},{"author":"Рене Магритт","title":"Влюблённые","year":"1928","museum":"Музей современного искусства (MoMA), Нью-Йорк","image":"originals/172.jpg","description":"Мужчина и женщина целуются, но их головы плотно закрыты белой тканью. Знакомый жест близости становится тревожным, потому что лица остаются недоступными и друг другу, и зрителю. Магритт пишет складки почти буднично, усиливая странность ситуации именно её внешней убедительностью. Рене Магритт написал картину в 1928 году. Место хранения: Музей современного искусства (MoMA), Нью-Йорк.","sources":[{"label":"René Magritte. The Lovers. Paris 1928 | MoMA","url":"https://www.moma.org/collection/works/79933"},{"label":"The Lovers (Magritte) — Wikipedia","url":"https://en.wikipedia.org/wiki/The_Lovers_(Magritte)"}],"tags":["Европейский модернизм XX века","Сюрреализм"],"position":"center center","originalImage":"originals/172.jpg","displayFragment":"fragments/172.jpg"},{"author":"Рене Магритт","title":"Вероломство образов (Это не трубка)","year":"1929","museum":"Музей искусств округа Лос-Анджелес (LACMA), Лос-Анджелес","image":"originals/173.jpg","description":"На светлом фоне аккуратно изображена трубка, под которой написано: «Это не трубка». Простая фраза заставляет остановиться и проверить привычную связь между вещью и её изображением. Магритт использует ясный рисунок и спокойную композицию, превращая небольшое несоответствие в точный вопрос о том, как мы смотрим и называем увиденное. Рене Магритт написал картину в 1929 году. Место хранения: Музей искусств округа Лос-Анджелес (LACMA), Лос-Анджелес.","sources":[{"label":"René Magritte, The Treachery of Images (This is Not…","url":"https://collections.lacma.org/object/31931"},{"label":"The Treachery of Images — Wikipedia","url":"https://en.wikipedia.org/wiki/The_Treachery_of_Images"}],"tags":["Европейский модернизм XX века","Сюрреализм"],"position":"center center","originalImage":"originals/173.jpg","displayFragment":"fragments/173.jpg"},{"author":"Тамара де Лемпицка","title":"Автопортрет (Тамара в зелёном «Бугатти»)","year":"1929","museum":"Частное собрание","image":"originals/174.jpg","description":"Лемпицка изображает себя за рулём зелёного автомобиля, в шлеме и перчатках. Крупный план, блеск металла и плотные складки одежды придают портрету ощутимую собранность. Уверенный взгляд соединяется с замкнутым пространством машины, создавая образ женщины, которая сама определяет направление своего движения. Тамара де Лемпицка написала картину в 1929 году. Место хранения: Частное собрание.","sources":[{"label":"Self-portrait (Tamara in a Green Bugatti) – Tamara…","url":"https://culture.pl/en/work/self-portrait-tamara-in-a-green-bugatti-tamara-lempicka"},{"label":"Image of Self Portrait (Tamara in a Green Bugatti),…","url":"https://www.bridgemanimages.com/en-US/de-lempicka/self-portrait-tamara-in-a-green-bugatti-1929-oil-on-wood/oil-on-wood/asset/7108279"}],"tags":["Европейский модернизм XX века"],"position":"center 28%","originalImage":"originals/174.jpg","displayFragment":"fragments/174.jpg"},{"author":"Тамара де Лемпицка","title":"Женщина с мандолиной","year":"1929","museum":"Частное собрание","image":"originals/175.jpg","description":"Женщина в синем платье держит мандолину, чья округлая форма перекликается с линиями её лица и рук. Резкие складки ткани и геометрический фон делают эти плавные очертания особенно заметными. Лемпицка соединяет холодную ясность поверхности с мягкостью фигуры, придавая сцене спокойное, немного отстранённое звучание. Тамара де Лемпицка написала картину в 1929 году. Место хранения: Частное собрание.","sources":[{"label":"Tamara de Lempicka, La Musicienne (Femme à la Mando…","url":"https://collctn.art/artwork/tamara-de-lempicka-la-musicienne-femme-a-la-mandoline"},{"label":"Home – Tamara de Lempicka Estate","url":"https://tamaradelempicka.org/pages/home"}],"tags":["Европейский модернизм XX века"],"position":"center 28%","originalImage":"originals/175.jpg","displayFragment":"fragments/175.jpg"},{"author":"Грант Вуд","title":"Американская готика","year":"1930","museum":"Чикагский институт искусств, Чикаго","image":"originals/176.jpg","description":"Мужчина с вилами и женщина стоят перед деревянным домом с высоким стрельчатым окном. Их неподвижные позы и серьёзные лица перекликаются со строгими вертикалями одежды, инструмента и фасада. Грант Вуд тщательно удерживает это сходство линий, создавая образ повседневной жизни, в котором чувствуются стойкость и замкнутость. Грант Вуд написал картину в 1930 году. Место хранения: Чикагский институт искусств, Чикаго.","sources":[{"label":"American Gothic - Grant Wood (American, 1891-1942)…","url":"https://artsandculture.google.com/asset/american-gothic/5QEPm0jCc183Aw?hl=en-GB"},{"label":"Grant Wood's Studio: Birthplace of \"American Gothic…","url":"https://americanart.si.edu/exhibitions/grant-wood"}],"tags":["Америка XX века"],"position":"center 28%","originalImage":"originals/176.jpg","displayFragment":"fragments/176.jpg"},{"author":"Робер Делоне","title":"Ритм, радость жизни","year":"1930","museum":"Центр Помпиду, Париж","image":"originals/177.jpg","description":"Цветные круги и дуги заполняют полотно, постепенно меняя размер и направление. Соседние оттенки то усиливают друг друга, то создают ощущение паузы. Робер Делоне строит композицию как непрерывное движение цвета, благодаря которому неподвижная поверхность кажется наполненной светом и живым ритмом. Робер Делоне написал картину в 1930 году. Место хранения: Центр Помпиду, Париж.","sources":[{"label":"Rythme, Joie de vivre - Centre Pompidou","url":"https://www.centrepompidou.fr/fr/ressources/oeuvre/vEgP2sS"},{"label":"Robert Delaunay, Rythmes sans fin - Dossier pédagog…","url":"https://mediation.centrepompidou.fr/education/ressources/ENS-Delaunay/index.html"}],"tags":["Абстракция","Европейский модернизм XX века"],"position":"center center","originalImage":"originals/177.jpg","displayFragment":"fragments/177.jpg"},{"author":"Казимир Малевич","title":"Спортсмены","year":"1930–1931","museum":"Государственный Русский музей, Санкт-Петербург","image":"originals/178.jpg","description":"Спортсмены стоят рядом на фоне пустого пейзажа, а их лица лишены индивидуальных черт. Тела собраны из крупных цветовых частей, чьи границы подчёркивают общую неподвижность. Малевич сохраняет узнаваемость человеческой фигуры, одновременно превращая группу в строгий ритм вертикалей и контрастных красок. Казимир Малевич написал картину в 1930–1931 годах. Место хранения: Государственный Русский музей, Санкт-Петербург.","sources":[{"label":"Малевич К. С. Спортсмены - Виртуальный Русский музей","url":"https://rusmuseumvrm.ru/data/collections/painting/19_20/zh_9439/index.php"},{"label":"Малевич К. С. Спортсмены. 1928 – 1932 гг. Холст, ма…","url":"https://www.rusmuseum.ru/upload/medialibrary/5b4/Malevich%20Sportsmens.pdf"}],"tags":["Европейский модернизм XX века","Россия XX века"],"position":"center 28%","originalImage":"originals/178.jpg","displayFragment":"fragments/178.jpg"},{"author":"Сальвадор Дали","title":"Постоянство памяти","year":"1931","museum":"Музей современного искусства (MoMA), Нью-Йорк","image":"originals/179.jpg","description":"На пустынном берегу мягкие часы свисают с ветки и лежат на неподвижных поверхностях. Далёкие скалы кажутся твёрдыми и реальными, тогда как близкие предметы подчиняются странным законам сна. Дали пишет невозможное с холодной точностью, заставляя привычное ощущение времени терять устойчивость. Сальвадор Дали написал картину в 1931 году. Место хранения: Музей современного искусства (MoMA), Нью-Йорк.","sources":[{"label":"Salvador Dalí. The Persistence of Memory. 1931 | MoMA","url":"https://www.moma.org/collection/works/79018"},{"label":"The Persistence of Memory — Wikipedia","url":"https://en.wikipedia.org/wiki/The_Persistence_of_Memory"}],"tags":["Европейский модернизм XX века","Мировые шедевры"],"position":"center center","originalImage":"originals/179.jpg","displayFragment":"fragments/179.jpg"},{"author":"Пабло Пикассо","title":"Женщина с часами","year":"1932","museum":"Частное собрание","image":"originals/180.jpg","description":"Мария-Тереза Вальтер сидит в кресле, а часы у её руки становятся небольшой, но заметной подробностью. Лицо соединяет разные ракурсы, не теряя спокойного выражения. Пикассо противопоставляет округлые линии фигуры широким цветовым плоскостям, создавая портрет, в котором близость к модели чувствуется через свободное преобразование формы. Пабло Пикассо написал картину в 1932 году. Место хранения: Частное собрание.","sources":[{"label":"Pablo Picasso | Femme à la montre | The Emily Fishe…","url":"https://www.sothebys.com/en/buy/auction/2023/the-emily-fisher-landau-collection-an-era-defined-evening-auction/femme-a-la-montre-2"},{"label":"Emily Fisher Landau Collection Sales Results | Soth…","url":"https://www.sothebys.com/en/articles/historic-auctions-see-emily-fisher-landau-collection-reach-425-million"}],"tags":["Европейский модернизм XX века"],"position":"center 28%","originalImage":"originals/180.jpg","displayFragment":"fragments/180.jpg"},{"author":"Пабло Пикассо","title":"Сон","year":"1932","museum":"Частное собрание","image":"originals/181.jpg","description":"Спящая женщина склонила голову и положила руки на колени, словно замыкаясь в собственном покое. Округлые линии лица, тела и кресла мягко продолжают друг друга. Пикассо сводит фигуру к крупным цветным частям, сохраняя в этом условном рисунке ощущение расслабленности и недоступности чужого сна. Пабло Пикассо написал картину в 1932 году. Место хранения: Частное собрание.","sources":[{"label":"PICASSO 1932","url":"https://museepicassoparis.fr/sites/default/files/2021-10/1932_DP_UK_web.pdf"},{"label":"Le Rêve (Picasso)","url":"https://en.wikipedia.org/wiki/Le_R%C3%AAve_%28Picasso%29"}],"tags":["Европейский модернизм XX века"],"position":"center 28%","originalImage":"originals/181.jpg","displayFragment":"fragments/181.jpg"},{"author":"Пабло Пикассо","title":"Две читающие девушки","year":"1934","museum":"Музей искусств Мичиганского университета (UMMA), Анн-Арбор","image":"originals/182.jpg","description":"Две девушки склонились над одной книгой, объединённые тихим вниманием к странице. Их лица и руки показаны свободно, с изменёнными очертаниями и ракурсами. Пикассо связывает фигуры общим наклоном, позволяя узнаваемому жесту совместного чтения удерживать всю сложную композицию. Пабло Пикассо написал картину в 1934 году. Место хранения: Музей искусств Мичиганского университета (UMMA), Анн-Арбор.","sources":[{"label":"Art Object: Two Girls Reading (Deux Enfants Lisant)…","url":"https://umma.umich.edu/objects/two-girls-reading-deux-enfants-lisant-1994-1-67/"},{"label":"Picasso in the collection of the Museum of Modern A…","url":"https://www.moma.org/documents/moma_catalogue_1855_300298976.pdf"}],"tags":["Европейский модернизм XX века"],"position":"center 28%","originalImage":"originals/182.jpg","displayFragment":"fragments/182.jpg"},{"author":"Василий Кандинский","title":"Композиция IX","year":"1936","museum":"Центр Помпиду, Париж","image":"originals/183.jpg","description":"Свободные округлые формы и небольшие знаки движутся среди светлых цветовых плоскостей. Некоторые напоминают крошечные живые организмы, хотя ни один образ не становится вполне определённым. Кандинский соединяет их лёгкими линиями и контрастными оттенками, создавая впечатление самостоятельного мира, который живёт по собственным законам. Василий Кандинский написал картину в 1936 году. Место хранения: Центр Помпиду, Париж.","sources":[{"label":"Composition IX - Centre Pompidou","url":"https://www.centrepompidou.fr/fr/ressources/oeuvre/cxAzoBX"},{"label":"Etude pour Composition IX - Centre Pompidou","url":"https://www.centrepompidou.fr/fr/ressources/oeuvre/cE7ygb"}],"tags":["Абстракция","Европейский модернизм XX века"],"position":"center center","originalImage":"originals/183.jpg","displayFragment":"fragments/183.jpg"},{"author":"Марк Ротко","title":"Интерьер","year":"1936","museum":"Национальная галерея искусства, Вашингтон","image":"originals/184.jpg","description":"Красные стены и тёмные проёмы складываются в глубокое внутреннее пространство с небольшими человеческими фигурами. Архитектурные рамки направляют взгляд, но не дают почувствовать привычный домашний уют. В ранней работе Ротко плотные цветовые поля уже приобретают особый вес, наполняя интерьер сдержанным напряжением. Марк Ротко написал картину в 1936 году. Место хранения: Национальная галерея искусства, Вашингтон.","sources":[{"label":"Ранние работы Ротко — Национальная галерея искусства","url":"https://www.nga.gov/exhibitions/mark-rothko-1"},{"label":"Interior — National Gallery of Art","url":"https://www.nga.gov/artworks/67383-interior"}],"tags":["Америка XX века"],"position":"center 28%","originalImage":"originals/184.jpg","displayFragment":"fragments/184.jpg"},{"author":"Пабло Пикассо","title":"Герника","year":"1937","museum":"Музей королевы Софии, Мадрид","image":"originals/185.jpg","description":"Люди и животные кричат, падают и тянутся к свету среди разорванных форм. Отказ от ярких красок делает резкие жесты и раскрытые рты особенно заметными. Пикассо собирает трагедию из чёрных, белых и серых фрагментов, передавая разрушение привычного мира через сам излом изображения. Пабло Пикассо написал картину в 1937 году. Место хранения: Музей королевы Софии, Мадрид.","sources":[{"label":"Guernica","url":"https://www.museoreinasofia.es/colecciones/obra/guernica/"},{"label":"Repensar Guernica. La obra-icono del siglo XX de Pi…","url":"https://guernica.museoreinasofia.es/"}],"tags":["Европейский модернизм XX века","Мировые шедевры"],"position":"center center","originalImage":"originals/185.jpg","displayFragment":"fragments/185.jpg"},{"author":"Пабло Пикассо","title":"Плачущая женщина","year":"1937","museum":"Тейт Модерн, Лондон","image":"originals/186.jpg","description":"Женщина прижимает платок к лицу, которое словно расколото на несколько несовпадающих ракурсов. Острые линии пересекают глаза, руки и ткань, не оставляя спокойного участка. Пикассо использует яркие краски так напряжённо, что плач воспринимается почти физически, как боль, изменяющая всё вокруг. Пабло Пикассо написал картину в 1937 году. Место хранения: Тейт Модерн, Лондон.","sources":[{"label":"Weeping Woman (Femme en pleurs) | Art UK","url":"https://artuk.org/discover/artworks/weeping-woman-femme-en-pleurs-201236"},{"label":"The Weeping Woman","url":"https://en.wikipedia.org/wiki/The_Weeping_Woman"}],"tags":["Европейский модернизм XX века"],"position":"center 28%","originalImage":"originals/186.jpg","displayFragment":"fragments/186.jpg"},{"author":"Сальвадор Дали","title":"Лебеди, отражающиеся в слонах","year":"1937","museum":"Частное собрание","image":"originals/187.jpg","description":"Лебеди спокойно держатся на воде, но их отражения вместе с деревьями складываются в фигуры слонов. Один образ возникает внутри другого, стоит немного изменить направление взгляда. Дали сохраняет ясность пейзажа и точность деталей, благодаря чему зрительная загадка кажется частью самой природы. Сальвадор Дали написал картину в 1937 году. Место хранения: Частное собрание.","sources":[{"label":"Swans Reflecting Elephants | Fundació Gala - Salvad…","url":"https://catalogues.salvador-dali.org/catalogues/en/heritageobject/389/"},{"label":"Swans Reflecting Elephants — Wikipedia","url":"https://en.wikipedia.org/wiki/Swans_Reflecting_Elephants"}],"tags":["Европейский модернизм XX века","Сюрреализм"],"position":"center center","originalImage":"originals/187.jpg","displayFragment":"fragments/187.jpg"},{"author":"Сальвадор Дали","title":"Сон","year":"около 1937","museum":"Частное собрание","image":"originals/188.jpg","description":"Огромная спящая голова нависает над пустынным пространством, удерживаемая множеством тонких подпорок. Их хрупкость кажется несоразмерной тяжёлой форме. Дали превращает сон в неустойчивое равновесие, которое будто может нарушиться от малейшего движения. Сальвадор Дали написал картину около 1937 года. Место хранения: Частное собрание.","sources":[{"label":"«Сон» в каталоге выставки Дали — MoMA","url":"https://assets.moma.org/documents/moma_catalogue_2085_300061969.pdf"},{"label":"Sleep — Fundació Gala — Salvador Dalí","url":"https://catalogues.salvador-dali.org/catalogues/en/heritageobject/280-51f9/"}],"tags":["Европейский модернизм XX века","Сюрреализм"],"position":"center center","originalImage":"originals/188.jpg","displayFragment":"fragments/188.jpg"},{"author":"Юрий Пименов","title":"Новая Москва","year":"1937","museum":"Государственная Третьяковская галерея, Москва","image":"originals/189.jpg","description":"Женщина ведёт открытый автомобиль по широкой московской улице. Зритель смотрит из машины и словно разделяет её движение, замечая впереди простор города и новые здания. Пименов использует светлые, мягкие мазки, благодаря которым большой городской вид воспринимается как личное, свежее впечатление от дороги. Юрий Пименов написал картину в 1937 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Новая Москва (картина)","url":"https://ru.wikipedia.org/wiki/%D0%9D%D0%BE%D0%B2%D0%B0%D1%8F_%D0%9C%D0%BE%D1%81%D0%BA%D0%B2%D0%B0_%28%D0%BA%D0%B0%D1%80%D1%82%D0%B8%D0%BD%D0%B0%29"},{"label":"Новая Третьяковка - Третьяковская галерея","url":"https://www.tretyakovgallery.ru/for-visitors/museums/novaya-tretyakovka/"}],"tags":["Россия XX века"],"position":"center center","originalImage":"originals/189.jpg","displayFragment":"fragments/189.jpg"},{"author":"Александр Дейнека","title":"Будущие лётчики","year":"1938","museum":"Государственная Третьяковская галерея, Москва","image":"originals/190.jpg","description":"Трое юношей сидят у моря и следят за самолётом в открытом небе. Между их неподвижными фигурами и далёкой машиной остаётся большое светлое пространство. Дейнека превращает это расстояние в ощущение ожидания и мечты, связывая спокойный отдых с устремлённостью в будущее. Александр Дейнека написал картину в 1938 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"АЛЕКСАНДР ДЕЙНЕКА: ХУДОЖНИК ВО ВРЕМЕНИ | Журнал «ТР…","url":"https://tretyakovgallerymagazine.ru/articles/1-2011-30/aleksandr-deineka-khudozhnik-vo-vremeni"},{"label":"Александр Дейнека — Журнал КОЛЛЕКЦИЯ","url":"https://sammlung.ru/?attachment_id=90316"}],"tags":["Россия XX века"],"position":"center center","originalImage":"originals/190.jpg","displayFragment":"fragments/190.jpg"},{"author":"Робер Делоне","title":"Ритм № 3. Декорация для Салона Тюильри","year":"1938","museum":"Музей современного искусства, Париж","image":"originals/191.jpg","description":"Концентрические круги расходятся по полотну, встречаясь с прямыми плоскостями и соседними цветовыми волнами. Повторение форм задаёт ритм, а различия оттенков постоянно его меняют. Делоне позволяет взгляду двигаться по этим переходам, создавая ощущение энергии без изображения людей, предметов или пейзажа. Робер Делоне написал картину в 1938 году. Место хранения: Музей современного искусства, Париж.","sources":[{"label":"Ритм № 3 — Muséosphère","url":"https://www.museosphere.paris.fr/oeuvres/rythme-ndeg3"},{"label":"Rythme n° 3 — Paris Musées","url":"https://www.parismuseescollections.paris.fr/fr/musee-d-art-moderne/oeuvres/rythme-ndeg3-decoration-pour-le-salon-des-tuileries"}],"tags":["Абстракция"],"position":"center 28%","originalImage":"originals/191.jpg","displayFragment":"fragments/191.jpg"},{"author":"Василий Кандинский","title":"Композиция X","year":"1939","museum":"Музей современного искусства (K20), Дюссельдорф","image":"originals/192.jpg","description":"На глубоком чёрном фоне яркие формы кажутся отдельными, почти парящими существами. Одни напоминают геометрические фигуры, другие сохраняют свободные, органические очертания. Кандинский подчёркивает их самостоятельность тёмным пространством, в котором цвет приобретает необычную ясность и силу свечения. Василий Кандинский написал картину в 1939 году. Место хранения: Музей современного искусства (K20), Дюссельдорф.","sources":[{"label":"Komposition X - Kunstsammlung NRW / Online-Sammlung","url":"https://sammlung.kunstsammlung.de/de/werke/67"},{"label":"Composition X","url":"https://en.wikipedia.org/wiki/Composition_X"}],"tags":["Абстракция","Россия XX века"],"position":"center center","originalImage":"originals/192.jpg","displayFragment":"fragments/192.jpg"},{"author":"Фрида Кало","title":"Две Фриды","year":"1939","museum":"Музей современного искусства, Мехико","image":"originals/193.jpg","description":"Две Фриды сидят рядом и держатся за руки, хотя их одежда и открытые сердца заметно различаются. Тонкий кровеносный сосуд связывает фигуры и делает внутреннее переживание видимым. Кало соединяет спокойную позу с почти анатомической откровенностью, превращая двойной автопортрет в напряжённый разговор с собой. Фрида Кало написала картину в 1939 году. Место хранения: Музей современного искусства, Мехико.","sources":[{"label":"EL MUSEO DE ARTE MODERNO PRESENTA LAS DOS FRIDAS: U…","url":"https://inba.gob.mx/prensa/23566/el-museo-de-arte-moderno-presenta-las-dos-fridas-una-identidad-global"},{"label":"Internautas pueden conocer a Las dos Fridas | Prens…","url":"https://inba.gob.mx/prensa/14230/internautas-pueden-conocer-a-las-dos-fridas"}],"tags":["Америка XX века","Мировые шедевры"],"position":"center 28%","originalImage":"originals/193.jpg","displayFragment":"fragments/193.jpg"},{"author":"Фрида Кало","title":"Автопортрет с терновым ожерельем и колибри","year":"1940","museum":"Центр Гарри Рэнсома, Остин","image":"originals/194.jpg","description":"Фрида Кало смотрит прямо на зрителя, окружённая густой листвой, обезьяной и чёрной кошкой. Терновое ожерелье и висящая на нём колибри резко выделяются на светлой коже. Неподвижное лицо сохраняет сдержанность, и именно это спокойствие усиливает ощущение боли, выраженной через предметы вокруг неё. Фрида Кало написала картину в 1940 году. Место хранения: Центр Гарри Рэнсома, Остин.","sources":[{"label":"Self-Portrait with Thorn Necklace and Hummingbird b…","url":"https://www.hrc.utexas.edu/frida-kahlo-self-portrait/"},{"label":"Frida Kahlo's \"Self-Portrait with Thorn Necklace an…","url":"https://www.hrc.utexas.edu/press/releases/2015/frida-kahlo.html"}],"tags":["Америка XX века"],"position":"center 28%","originalImage":"originals/194.jpg","displayFragment":"fragments/194.jpg"},{"author":"Эдвард Хоппер","title":"Бензоколонка","year":"1940","museum":"Музей современного искусства (MoMA), Нью-Йорк","image":"originals/195.jpg","description":"Работник стоит у бензоколонки на дороге, которая теряется рядом с тёмным лесом. Тёплый искусственный свет ещё удерживает небольшой участок пространства, пока вокруг сгущаются сумерки. Хоппер соединяет ясность придорожных предметов с неопределённостью наступающей ночи, создавая чувство короткой остановки между двумя мирами. Эдвард Хоппер написал картину в 1940 году. Место хранения: Музей современного искусства (MoMA), Нью-Йорк.","sources":[{"label":"Edward Hopper. Gas. 1940 | MoMA","url":"https://www.moma.org/collection/works/80000"},{"label":"Gas (Hopper) — Wikipedia","url":"https://en.wikipedia.org/wiki/Gas_(Hopper)"}],"tags":["Америка XX века"],"position":"center center","originalImage":"originals/195.jpg","displayFragment":"fragments/195.jpg"},{"author":"Эдвард Хоппер","title":"Полуночники","year":"1942","museum":"Чикагский институт искусств, Чикаго","image":"originals/196.jpg","description":"Посетители сидят в ярко освещённой закусочной, окружённой пустой ночной улицей. Большое стекло позволяет рассмотреть их совсем близко, но сохраняет ощущение недоступности. Хоппер строит сцену на контрасте света и темноты, превращая обычное городское заведение в замкнутый остров человеческого присутствия. Эдвард Хоппер написал картину в 1942 году. Место хранения: Чикагский институт искусств, Чикаго.","sources":[{"label":"Nighthawks | The Art Institute of Chicago","url":"https://archive.artic.edu/hopper/artwork/111628"},{"label":"Nighthawks | The Art Institute of Chicago","url":"https://archive.artic.edu/hopper/nighthawks/"}],"tags":["Америка XX века"],"position":"center center","originalImage":"originals/196.jpg","displayFragment":"fragments/196.jpg"},{"author":"Пьер Боннар","title":"Корзина с фруктами на столе в саду в Ле-Канне","year":"около 1944","museum":"Частное собрание","image":"originals/197.jpg","description":"Корзина с фруктами стоит на столе перед пёстрым садом, и близкие вещи почти смешиваются с зеленью за ними. Цветовые пятна постоянно переводят взгляд между передним планом и глубиной. Боннар смягчает границы предметов, передавая ощущение тёплого света, который наполняет и сад, и пространство вокруг стола. Пьер Боннар написал картину около 1944 года. Место хранения: Частное собрание.","sources":[{"label":"Pierre Bonnard (1867-1947), Corbeille de fruits sur…","url":"https://www.christies.com/en/lot/lot-6134226"},{"label":"BONNARD  63. *Vase of Flowers on a Red Cloth*   *V","url":"https://resources.metmuseum.org/resources/metpublications/pdf/Pierre_Bonnard_The_Late_Still_Lifes_and_Interiors.pdf"}],"tags":["Импрессионизм и постимпрессионизм"],"position":"center center","originalImage":"originals/197.jpg","displayFragment":"fragments/197.jpg"},{"author":"Эндрю Уайет","title":"Мир Кристины","year":"1948","museum":"Музей современного искусства (MoMA), Нью-Йорк","image":"originals/198.jpg","description":"Кристина лежит в поле и смотрит на фермерский дом, который кажется далёким и труднодоступным. Между её небольшой фигурой и постройками остаётся широкая полоса сухой травы. Уайет делает расстояние главным выразительным средством, позволяя почувствовать напряжённость движения, которое ещё предстоит совершить. Эндрю Уайет написал картину в 1948 году. Место хранения: Музей современного искусства (MoMA), Нью-Йорк.","sources":[{"label":"Andrew Wyeth. Christina's World. 1948 | MoMA","url":"https://www.moma.org/collection/works/78455?art_term_slug=modern-art&sov_referrer=art_term"},{"label":"Christina's World — Wikipedia","url":"https://en.wikipedia.org/wiki/Christina%27s_World"}],"tags":["Америка XX века"],"position":"center center","originalImage":"originals/198.jpg","displayFragment":"fragments/198.jpg"},{"author":"Марк Ротко","title":"Без названия","year":"1949","museum":"Метрополитен-музей, Нью-Йорк","image":"originals/199.jpg","description":"Красное, зелёное и тёмно-коричневое поля расположены одно над другим, сохраняя мягкие, неровные края. Цвет местами кажется плотным, а местами словно просвечивает из глубины. Ротко ослабляет геометрическую определённость прямоугольников, позволяя их соседству вызывать медленно меняющееся эмоциональное впечатление. Марк Ротко написал картину в 1949 году. Место хранения: Метрополитен-музей, Нью-Йорк.","sources":[{"label":"Ранние абстракции Ротко — Метрополитен-музей","url":"https://resources.metmuseum.org/resources/metpublications/pdf/The_Abstract_Expressionists_The_Metropolitan_Museum_of_Art_Bulletin_v_44_no_3_Winter_1986_1987.pdf"},{"label":"Untitled, 1949 — The Metropolitan Museum of Art","url":"https://www.metmuseum.org/art/collection/search/484360"}],"tags":["Абстракция","Америка XX века"],"position":"center 28%","originalImage":"originals/199.jpg","displayFragment":"fragments/199.jpg"},{"author":"Марк Ротко","title":"№ 3 / № 13 (Пурпурное, чёрное, зелёное на оранжевом)","year":"1949","museum":"Музей современного искусства (MoMA), Нью-Йорк","image":"originals/200.jpg","description":"Большой тёмный прямоугольник заключён между яркими горизонтальными полосами. Их мягкие края не дают цветам окончательно отделиться друг от друга. Ротко строит впечатление на разнице плотности и насыщенности, благодаря которой неподвижные поля кажутся то приближающимися, то уходящими в глубину. Марк Ротко написал картину в 1949 году. Место хранения: Музей современного искусства (MoMA), Нью-Йорк.","sources":[{"label":"Разбор картины Ротко — Smarthistory","url":"https://smarthistory.org/mark-rothko-no-3no-13/"},{"label":"No. 3/No. 13 — Museum of Modern Art","url":"https://www.moma.org/collection/works/79687"}],"tags":["Абстракция","Америка XX века"],"position":"center 28%","originalImage":"originals/200.jpg","displayFragment":"fragments/200.jpg"},{"author":"Джексон Поллок","title":"Осенний ритм № 30","year":"1950","museum":"Метрополитен-музей, Нью-Йорк","image":"originals/201.jpg","description":"Чёрные, белые и коричневые линии покрывают холст густой, непрерывной сетью. В одних местах краска собирается плотнее, в других оставляет просветы и паузы. Поллок наносил её на лежащий на полу холст, поэтому в переплетении следов сохраняются размах руки, смена направления и ритм самого движения художника. Джексон Поллок написал картину в 1950 году. Место хранения: Метрополитен-музей, Нью-Йорк.","sources":[{"label":"Jackson Pollock - Autumn Rhythm: Number 30, 1950 -…","url":"https://www.metmuseum.org/de/art/collection/search/488978"},{"label":"Autumn Rhythm (Number 30) — Wikipedia","url":"https://en.wikipedia.org/wiki/Autumn_Rhythm_(Number_30)"}],"tags":["Абстракция","Америка XX века"],"position":"center center","originalImage":"originals/201.jpg","displayFragment":"fragments/201.jpg"},{"author":"Марк Ротко","title":"Белый центр (Жёлтое, розовое и лавандовое на розовом)","year":"1950","museum":"Частное собрание","image":"originals/202.jpg","description":"Широкие жёлтые и розовые поля разделены светлой горизонтальной полосой. Размытые края заставляют цвет мягко переходить в соседнее пространство, словно поверхность продолжает дышать. Ротко делает главным событием картины само соприкосновение оттенков, которое меняет впечатление при долгом, спокойном взгляде. Марк Ротко написал картину в 1950 году. Место хранения: Частное собрание.","sources":[{"label":"(#31) Mark Rothko","url":"https://www.sothebys.com/en/auctions/ecatalogue/2007/contemporary-art-evening-sale-n08317/lot.31.html"},{"label":"White Center (Yellow, Pink and Lavender on Rose) —…","url":"https://en.wikipedia.org/wiki/White_Center_(Yellow,_Pink_and_Lavender_on_Rose)"}],"tags":["Абстракция","Америка XX века"],"position":"center 28%","originalImage":"originals/202.jpg","displayFragment":"fragments/202.jpg"},{"author":"Анри Матисс","title":"Голубая обнажённая II","year":"1952","museum":"Центр Помпиду, Париж","image":"originals/203.jpg","description":"Синяя фигура сидящей женщины собрана из крупных вырезанных частей бумаги. Светлые промежутки между ними одновременно разделяют тело и помогают почувствовать его объём. Матисс находит точность в простом силуэте, передавая несколькими изгибами тяжесть позы, движение рук и гибкость человеческой фигуры. Анри Матисс создал эту аппликацию в 1952 году. Место хранения: Центр Помпиду, Париж.","sources":[{"label":"Nu bleu II - Centre Pompidou","url":"https://www.centrepompidou.fr/fr/ressources/oeuvre/cnyjxX"},{"label":"Nu bleu II - Centre Pompidou","url":"https://www.centrepompidou.fr/en/offre-aux-professionnels/enseignants/dossiers-ressources-sur-lart/henri-matisse/nu-bleu-ii"}],"tags":["Европейский модернизм XX века"],"position":"center 28%","originalImage":"originals/203.jpg","displayFragment":"fragments/203.jpg"},{"author":"Сальвадор Дали","title":"Галатея сфер","year":"1952","museum":"Фонд Гала — Сальвадор Дали, Фигерас","image":"originals/204.jpg","description":"Лицо Галы возникает из множества отдельных шаров, словно свободно висящих в голубом пространстве. Их расположение сохраняет узнаваемый портрет, хотя привычная поверхность лица исчезает. Дали соединяет мягкое выражение с дробной, почти невесомой формой, позволяя образу одновременно собираться и распадаться перед взглядом. Сальвадор Дали написал картину в 1952 году. Место хранения: Фонд Гала — Сальвадор Дали, Фигерас.","sources":[{"label":"Gala Placidia | Fundació Gala - Salvador Dalí","url":"https://catalogues.salvador-dali.org/catalogues/en/heritageobject/54/"},{"label":"Galatea of the Spheres — Wikipedia","url":"https://en.wikipedia.org/wiki/Galatea_of_the_Spheres"}],"tags":["Сюрреализм"],"position":"center 28%","originalImage":"originals/204.jpg","displayFragment":"fragments/204.jpg"},{"author":"Георгий Нисский","title":"Февраль. Подмосковье","year":"1957","museum":"Государственная Третьяковская галерея, Москва","image":"originals/205.jpg","description":"Заснеженная железная дорога проходит через подмосковный пейзаж под холодным розоватым небом. Чёткие линии путей и опор связывают близкий план с далёким горизонтом. Нисский соединяет зимнюю тишину с ощущением скорости и современного движения, сохраняя простор и ясность природного вида. Георгий Нисский написал картину в 1957 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Московские живописцы. Альбом, 1979 — список иллюстр…","url":"https://pv-gallery.com/downloadFile?objectId=1876454208"},{"label":"Февраль. Подмосковье (картина) — Георгий Григорьеви…","url":"https://gallerix.ru/storeroom/1872790260/N/3970841459/"}],"tags":["Россия XX века"],"position":"center center","originalImage":"originals/205.jpg","displayFragment":"fragments/205.jpg"},{"author":"Энди Уорхол","title":"Диптих Мэрилин","year":"1962","museum":"Тейт Модерн, Лондон","image":"originals/206.jpg","description":"Лицо Мэрилин Монро повторяется рядами, переходя от яркого цвета к бледному чёрно-белому изображению. Отпечатки постепенно теряют чёткость, и знакомая улыбка то выступает, то почти исчезает. Уорхол делает повторение частью смысла, позволяя увидеть, как массовый образ одновременно закрепляется в памяти и стирается. Энди Уорхол создал диптих в 1962 году. Место хранения: Тейт Модерн, Лондон.","sources":[{"label":"Marilyn Diptych | Art UK","url":"https://artuk.org/discover/artworks/marilyn-diptych-117797"},{"label":"Marilyn Diptych — Wikipedia","url":"https://en.wikipedia.org/wiki/Marilyn_Diptych"}],"tags":["Америка XX века"],"position":"center center","originalImage":"originals/206.jpg","displayFragment":"fragments/206.jpg"},{"author":"Рене Магритт","title":"Сын человеческий","year":"1964","museum":"Частное собрание","image":"originals/207.jpg","description":"Мужчина в пальто и котелке стоит перед морем, но зелёное яблоко закрывает его лицо. Всё остальное выглядит спокойно и привычно, отчего эта единственная помеха особенно притягивает взгляд. Магритт превращает портрет в зрительную загадку, заставляя почувствовать, как сильно нам хочется увидеть то, что скрыто. Рене Магритт написал картину в 1964 году. Место хранения: Частное собрание.","sources":[{"label":"René Magritte (1898-1967) , Le fils de l'homme | Ch…","url":"https://www.christies.com/lot/lot-rene-magritte-1898-1967-le-fils-de-1404203/"},{"label":"The Son of Man — Wikipedia","url":"https://en.wikipedia.org/wiki/The_Son_of_Man"}],"tags":["Мировые шедевры","Сюрреализм"],"position":"center 28%","originalImage":"originals/207.jpg","displayFragment":"fragments/207.jpg"}];
    const $=id=>document.getElementById(id),gallery=$('gallery'),viewer=$('viewer');
    const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    let currentWork=0,lastFocus=null,visibleCount=24,filteredWorks=works;
    $('catalog-count').textContent=`${works.length} работ`;
    function renderGallery(){const shown=filteredWorks.slice(0,visibleCount);gallery.innerHTML=shown.length?shown.map(w=>{const i=works.indexOf(w);return `<button class="art-card" type="button" data-work="${i}" aria-label="Открыть: ${esc(w.title)}"><img src="${w.image}" alt="" loading="lazy" style="object-position:${esc(w.position)}"><span class="card-index">${String(i+1).padStart(3,'0')}</span><span class="card-copy"><small>${esc(w.author)} · ${esc(w.year)}</small><strong>${esc(w.title)}</strong></span></button>`}).join(''):'<div class="empty">Ничего не найдено. Попробуйте изменить запрос.</div>';$('catalog-status').textContent=`${Math.min(visibleCount,filteredWorks.length)} из ${filteredWorks.length}`;$('load-more').hidden=visibleCount>=filteredWorks.length}
    function applySearch(){const q=$('search').value.trim().toLocaleLowerCase('ru');filteredWorks=q?works.filter(w=>[w.title,w.author,w.year,w.museum,w.description,...w.tags].join(' ').toLocaleLowerCase('ru').includes(q)):works;visibleCount=24;renderGallery()}
    function openWork(i){lastFocus=document.activeElement;currentWork=i;const w=works[i];$('work-count').textContent=`${String(i+1).padStart(3,'0')} / ${works.length}`;$('work-image').src=w.image;$('work-image').alt=`${w.author} — ${w.title}`;$('work-image').style.objectPosition=w.position;$('work-title').textContent=w.title;$('work-artist').textContent=w.author;$('work-year').textContent=w.year;$('work-museum').textContent=w.museum;$('tags').innerHTML=w.tags.map(tag=>`<span class="tag">${esc(tag)}</span>`).join('');$('description').textContent=w.description;$('sources').innerHTML=`<strong>Источники</strong>${w.sources.map(source=>`<a href="${esc(source.url)}" target="_blank" rel="noopener noreferrer">${esc(source.label)} ↗</a>`).join('')}`;$('bookmark').classList.remove('saved');$('bookmark').setAttribute('aria-pressed','false');viewer.classList.add('open');viewer.setAttribute('aria-hidden','false');document.body.classList.add('locked');viewer.scrollTop=0;requestAnimationFrame(()=>$('close').focus({preventScroll:true}))}
    function closeWork(){viewer.classList.remove('open');viewer.setAttribute('aria-hidden','true');document.body.classList.remove('locked');$('work-image').src='';if(lastFocus)lastFocus.focus({preventScroll:true})}
    gallery.addEventListener('click',e=>{const card=e.target.closest('[data-work]');if(card)openWork(Number(card.dataset.work))});$('search').addEventListener('input',applySearch);$('load-more').addEventListener('click',()=>{visibleCount+=24;renderGallery()});$('close').onclick=closeWork;$('bookmark').onclick=e=>{const active=e.currentTarget.classList.toggle('saved');e.currentTarget.setAttribute('aria-pressed',String(active))};$('share').onclick=async()=>{const w=works[currentWork],data={title:w.title,text:`${w.title} — ${w.author}, ${w.year}. ${w.description}`};try{if(navigator.share)await navigator.share(data);else if(navigator.clipboard)await navigator.clipboard.writeText(data.text)}catch(error){if(error&&error.name!=='AbortError')console.warn(error)}};document.addEventListener('keydown',e=>{if(viewer.classList.contains('open')&&e.key==='Escape')closeWork()});renderGallery();
  </script>
