<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <title>Картины — простые описания</title>
  <style>
    :root{--bg:#0c0c0c;--panel:#1a1a1a;--soft:#212121;--text:#f2f0ec;--muted:#aaa7a1;--line:rgba(255,255,255,.22);--soft-line:rgba(255,255,255,.11);--accent:#d8b278}
    *{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;min-width:320px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}button,a,input{font:inherit}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    .shell{width:min(960px,100%);margin:auto;padding:max(22px,env(safe-area-inset-top)) clamp(16px,4vw,38px) 70px}.topbar{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:650;letter-spacing:.12em;text-transform:uppercase}.brand{color:var(--text)}.hero{padding:58px 0 34px}.hero h1{margin:0;max-width:820px;font-size:clamp(48px,9vw,88px);line-height:.94;letter-spacing:-.06em}.hero p{max-width:590px;margin:22px 0 0;color:var(--muted);font-size:17px;line-height:1.5}.catalog-tools{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;margin-bottom:20px;padding:12px 0;background:linear-gradient(var(--bg) 75%,transparent)}.search{width:100%;min-height:50px;padding:0 18px;border:1px solid var(--soft-line);border-radius:16px;background:#161616;color:var(--text);font-size:16px}.search::placeholder{color:#696762}.search:focus{border-color:rgba(216,178,120,.6);outline:none}.catalog-status{color:var(--muted);font-size:12px;white-space:nowrap}.load-more{display:block;min-width:190px;min-height:50px;margin:24px auto 0;padding:0 20px;border:1px solid var(--line);border-radius:999px;background:var(--soft);color:var(--text);cursor:pointer}.load-more:hover{border-color:var(--accent)}.load-more[hidden]{display:none}.empty{grid-column:1/-1;padding:70px 20px;border:1px solid var(--soft-line);border-radius:22px;color:var(--muted);text-align:center}
    .gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.art-card{position:relative;min-height:520px;padding:0;overflow:hidden;border:1px solid var(--soft-line);border-radius:28px;background:var(--soft);color:var(--text);text-align:left;cursor:pointer;isolation:isolate}.art-card img{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;transition:transform .55s ease}.art-card:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.02) 35%,rgba(0,0,0,.86))}.art-card:hover img{transform:scale(1.025)}.card-index{position:absolute;top:18px;left:18px;display:grid;width:42px;height:42px;place-items:center;border:1px solid rgba(255,255,255,.28);border-radius:50%;background:rgba(25,25,25,.48);backdrop-filter:blur(14px);font-size:11px;font-weight:700}.card-copy{position:absolute;left:22px;right:22px;bottom:24px}.card-copy small{display:block;margin-bottom:8px;color:rgba(255,255,255,.72);font-size:12px}.card-copy strong{display:block;font-size:clamp(29px,5vw,46px);line-height:1;letter-spacing:-.045em}
    .viewer{position:fixed;inset:0;z-index:20;visibility:hidden;overflow-y:auto;opacity:0;background:#050505;transition:opacity .25s ease,visibility .25s ease;overscroll-behavior:contain}.viewer.open{visibility:visible;opacity:1}.app-page{width:min(640px,100%);min-height:100%;margin:auto;background:var(--panel);box-shadow:0 0 70px rgba(0,0,0,.58)}.media{position:relative;height:clamp(380px,56svh,560px);overflow:hidden;background:#252525}.media:after{content:"";position:absolute;right:0;bottom:0;left:0;height:70px;background:linear-gradient(transparent,rgba(0,0,0,.18));pointer-events:none}.media img{display:block;width:100%;height:100%;object-fit:cover}.back{position:absolute;z-index:3;top:max(18px,env(safe-area-inset-top));left:18px;display:grid;width:54px;height:54px;place-items:center;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:rgba(65,68,65,.68);color:#fff;cursor:pointer;backdrop-filter:blur(14px)}.back svg{width:25px;height:25px}.work-count{position:absolute;z-index:3;top:max(26px,calc(env(safe-area-inset-top) + 8px));right:20px;padding:8px 12px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(20,20,20,.48);color:rgba(255,255,255,.86);font-size:11px;font-weight:650;letter-spacing:.08em;backdrop-filter:blur(12px)}
    .info{padding:18px 24px max(62px,calc(env(safe-area-inset-bottom) + 30px))}.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.title-copy{min-width:0}.title-copy h2{margin:0;font-size:clamp(31px,8vw,42px);line-height:1.04;letter-spacing:-.045em}.byline{margin:9px 0 0;color:#d2d0cb;font-size:17px;line-height:1.35}.actions{display:flex;gap:4px;flex:0 0 auto}.icon-button{display:grid;width:44px;height:44px;padding:0;place-items:center;border:0;border-radius:50%;background:transparent;color:#e8e7e3;cursor:pointer}.icon-button:hover{background:rgba(255,255,255,.07)}.icon-button svg{width:27px;height:27px}.icon-button.saved svg{fill:var(--accent);stroke:var(--accent)}.museum{display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--muted);font-size:13px;line-height:1.4}.museum:before{content:"";flex:0 0 auto;width:5px;height:5px;border-radius:50%;background:var(--accent)}.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}.tag{padding:7px 14px 8px;border:1px solid rgba(255,255,255,.42);border-radius:999px;color:#aaa8a4;font-size:14px;line-height:1}
    .description{margin-top:30px}.section-kicker{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.version-pill{padding:6px 10px;border:1px solid rgba(216,178,120,.34);border-radius:999px;color:var(--accent);font-size:10px;letter-spacing:.04em;text-transform:none}.description-text{margin:0;color:#e0dfdc;font-size:clamp(18px,4.8vw,21px);line-height:1.58;letter-spacing:-.012em}.description-signature{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:24px;padding-top:15px;border-top:1px solid var(--soft-line)}.description-signature span{color:#77746f;font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}.description-signature strong{color:var(--accent);font-size:13px;font-weight:650}.sources{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-top:28px;padding-top:18px;border-top:1px solid var(--soft-line);color:#706e69;font-size:11px}.sources strong{font-size:9px;letter-spacing:.12em;text-transform:uppercase}.sources a{color:#aaa7a1;text-underline-offset:4px}body.locked{overflow:hidden}
    @media(max-width:620px){.shell{padding-inline:14px}.hero{padding-top:48px}.gallery{grid-template-columns:1fr;gap:14px}.art-card{min-height:min(122vw,600px);border-radius:22px}.media{height:clamp(370px,55svh,540px)}.info{padding-inline:20px}}
    @media(max-width:390px){.info{padding-inline:17px}.title-copy h2{font-size:30px}.byline{font-size:16px}.icon-button{width:38px;height:42px}.icon-button svg{width:24px;height:24px}.description-text{font-size:18px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><span class="brand">Личная коллекция</span><span id="catalog-count"></span></header>
    <section class="hero"><h1>Простые описания</h1><p>207 произведений с описаниями света, настроения и художественных особенностей. Откройте любую работу, чтобы увидеть автора, год, музей и описание.</p></section>
    <div class="catalog-tools"><input class="search" id="search" type="search" placeholder="Найти картину или художника" autocomplete="off"><span class="catalog-status" id="catalog-status"></span></div>
    <section class="gallery" id="gallery" aria-label="Каталог картин"></section>
    <button class="load-more" id="load-more" type="button">Показать ещё</button>
  </main>
  <section class="viewer" id="viewer" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Карточка картины">
    <article class="app-page">
      <div class="media"><img id="work-image" alt=""><button class="back" id="close" type="button" aria-label="Вернуться к каталогу"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><div class="work-count" id="work-count"></div></div>
      <div class="info">
        <div class="title-row"><div class="title-copy"><h2 id="work-title"></h2><p class="byline"><span id="work-artist"></span> <span aria-hidden="true">•</span> <span id="work-year"></span></p></div><div class="actions"><button class="icon-button" id="bookmark" type="button" aria-label="Сохранить картину" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4V3Z"/></svg></button><button class="icon-button" id="share" type="button" aria-label="Поделиться картиной"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.5M8.2 13.2l7.6 4.5"/></svg></button></div></div>
        <div class="museum" id="work-museum"></div><div class="tags" id="tags"></div>
        <section class="description" aria-label="Описание картины"><header class="section-kicker"><span>Описание</span><span class="version-pill">Простое описание</span></header><p class="description-text" id="description"></p><footer class="description-signature"><span>Единственная версия</span><strong>Простое описание</strong></footer></section>
        <div class="sources" id="sources"></div>
      </div>
    </article>
  </section>
  <script>
    const works=[{"author":"Неизвестный японский мастер","title":"Нападение на дворец Сандзё (свиток из «Повести о смуте годов Хэйдзи»)","year":"вторая половина XIII века","museum":"Музей изящных искусств, Бостон","image":"originals/001.jpg","description":"Всадники врываются во дворец Сандзё, охваченный огромным пожаром. Люди мечутся среди огня, лошади несутся сквозь толпу, а клубы дыма превращают происходящее в стремительный поток движения. Длинный горизонтальный свиток раскрывает события постепенно, поэтому зритель словно следует за участниками сражения и становится свидетелем нарастающей катастрофы. Неизвестный японский мастер создал свиток во второй половине XIII века. Место хранения: Музей изящных искусств, Бостон.","sources":[{"label":"Датировка свитка — Музей изящных искусств Бостона","url":"https://www.mfa.org/exhibitions/takashi-murakami/mfa-mobile/credits-main"},{"label":"An Epic Battle in Motion | Museum of Fine Arts Boston","url":"https://mfa.org/media/video/9378"},{"label":"Siege of Sanjō Palace","url":"https://en.wikipedia.org/wiki/Siege_of_Sanj%C5%8D_Palace"}],"tags":["Япония"],"position":"center center","originalImage":"originals/001.jpg","displayFragment":"fragments/001.jpg"},{"author":"Андрей Рублёв","title":"Троица","year":"1422–1427","museum":"Государственная Третьяковская галерея, Москва","image":"originals/002.jpg","description":"Три ангела сидят вокруг стола в спокойной, почти безмолвной беседе. Их склонённые головы, плавные очертания одежд и едва заметные жесты образуют замкнутый круг, в котором нет ни напряжения, ни случайного движения. Светлые краски и тонкие золотые линии наполняют образ ощущением тишины, согласия и духовного единства. Андрей Рублёв написал икону в 1422–1427 годах. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Святая Троица","url":"https://my.tretyakov.ru/app/masterpiece/8812"},{"label":"Впервые в храмах Русской Православной Церкви отпраз…","url":"https://www.lavra.ru/lavra-news/vpervye-v-khramakh-russkoy-pravoslavnoy-tserkvi-otprazdnuyut-den-prineseniya-v-troitse-sergievu-lavr/"}],"tags":["Русская классика"],"position":"center 28%","originalImage":"originals/002.jpg","displayFragment":"fragments/002.jpg"},{"author":"Ян ван Эйк","title":"Портрет четы Арнольфини","year":"1434","museum":"Национальная галерея, Лондон","image":"originals/003.jpg","description":"Мужчина и женщина стоят в тихой комнате, соединив руки, словно участвуют в торжественной церемонии. Каждый предмет выписан с поразительной точностью: от блеска латунной люстры до меха на одежде и маленькой собаки у их ног. Особенно важно выпуклое зеркало на дальней стене: в нём отражается комната и ещё две фигуры, находящиеся за пределами основного изображения. Ян ван Эйк написал картину в 1434 году. Место хранения: Национальная галерея, Лондон.","sources":[{"label":"The Arnolfini Portrait | National Gallery Catalogue…","url":"https://www.nationalgallery.org.uk/paintings/catalogues/campbell-1998/the-arnolfini-portrait"},{"label":"Reflections: Behind the inspiration | Reflections:…","url":"https://www.nationalgallery.org.uk/exhibitions/past/reflections-van-eyck-and-the-pre-raphaelites/reflections-behind-the-inspiration?viewPage=6"}],"tags":["Мировые шедевры","Ренессанс"],"position":"center 28%","originalImage":"originals/003.jpg","displayFragment":"fragments/003.jpg"},{"author":"Сандро Боттичелли","title":"Весна","year":"около 1480","museum":"Галерея Уффици, Флоренция","image":"originals/004.jpg","description":"В цветущем апельсиновом саду появляются Венера, Меркурий, три Грации и другие персонажи античной мифологии. Их движения напоминают медленный танец: прозрачные ткани колышутся, руки соединяются, а фигуры будто возникают среди сотен тщательно написанных растений. Любовь, красота и пробуждение природы переплетаются здесь в сложной аллегории, смысл которой допускает разные прочтения. Сандро Боттичелли написал картину около 1480 года. Место хранения: Галерея Уффици, Флоренция.","sources":[{"label":"Spring by Botticelli | Uffizi Galleries","url":"https://www.uffizi.it/en/artworks/botticelli-spring"},{"label":"Primavera (Botticelli) — Wikipedia","url":"https://en.wikipedia.org/wiki/Primavera_(Botticelli)"}],"tags":["Ренессанс"],"position":"center center","originalImage":"originals/004.jpg","displayFragment":"fragments/004.jpg"},{"author":"Сандро Боттичелли","title":"Рождение Венеры","year":"около 1485–1486","museum":"Галерея Уффици, Флоренция","image":"originals/005.jpg","description":"Венера приближается к берегу на огромной морской раковине, а ветер подхватывает цветы и развевает её длинные золотистые волосы. Почти неподвижная фигура окружена движением воздуха, волн и летящих тканей, поэтому сцена кажется похожей на видение. Удлинённые пропорции и плавные линии создают образ красоты, в котором хрупкость сочетается со спокойным величием. Сандро Боттичелли написал картину примерно в 1485–1486 годах. Место хранения: Галерея Уффици, Флоренция.","sources":[{"label":"Разбор «Рождения Венеры» — Smarthistory","url":"https://smarthistory.org/sandro-botticelli-the-birth-of-venus/"},{"label":"Галерея Уффици","url":"https://www.uffizi.it/en/artworks/birth-of-venus"}],"tags":["Мировые шедевры","Ренессанс"],"position":"center 38%","originalImage":"originals/005.jpg","displayFragment":"fragments/005.jpg"},{"author":"Леонардо да Винчи","title":"Дама с горностаем","year":"около 1489–1491","museum":"Музей князей Чарторыйских, Краков","image":"originals/006.jpg","description":"Чечилия Галлерани поворачивается к кому-то за пределами картины, бережно удерживая белого горностая. Мягкий свет выделяет её лицо и тонкие пальцы, оставляя фон в глубокой тени. Голова девушки, плечи и тело зверька направлены немного по-разному, и благодаря этому сдержанный портрет кажется мгновением живого разговора. Леонардо да Винчи написал картину примерно в 1489–1491 годах. Место хранения: Музей князей Чарторыйских, Краков.","sources":[{"label":"Lady with an Ermine – Portrait of Cecilia Gallerani…","url":"https://zbiory.mnk.pl/en/catalog/157417"},{"label":"Lady with an Ermine - Muzeum Narodowe w Krakowie","url":"https://mnk.pl/en/collections/lady-with-an-ermine/"}],"tags":["Мировые шедевры","Ренессанс"],"position":"center 28%","originalImage":"originals/006.jpg","displayFragment":"fragments/006.jpg"},{"author":"Леонардо да Винчи","title":"Тайная вечеря","year":"1495–1498","museum":"Трапезная монастыря Санта-Мария-делле-Грацие, Милан","image":"originals/007.jpg","description":"За длинным столом вспыхивает волнение: апостолы откликаются на слова Христа о предательстве. Их жесты и взгляды расходятся по комнате, тогда как центральная фигура сохраняет спокойствие. Леонардо собирает этот поток эмоций строгими линиями перспективы, направляя взгляд к Христу и подчёркивая его одиночество среди учеников. Леонардо да Винчи создал настенную роспись в 1495–1498 годах. Место хранения: Трапезная монастыря Санта-Мария-делле-Грацие, Милан.","sources":[{"label":"The Last Supper, Leonardo da Vinci - Museo del Cena…","url":"https://cenacolovinciano.org/en/museum/the-works/the-last-supper-leonardo-da-vinci-1452-1519/"},{"label":"A powerful theatrical machine - Museo del Cenacolo…","url":"https://cenacolovinciano.org/en/story/a-powerful-theatrical-machine/"}],"tags":["Мировые шедевры","Ренессанс"],"position":"center center","originalImage":"originals/007.jpg","displayFragment":"fragments/007.jpg"},{"author":"Леонардо да Винчи","title":"Мона Лиза (Джоконда)","year":"около 1503–1519","museum":"Лувр, Париж","image":"originals/008.jpg","description":"Женщина спокойно смотрит на зрителя, а за её плечами теряется в дымке далёкий горный пейзаж. Уголки губ и очертания глаз словно меняются, стоит задержать взгляд или немного отвести его. Леонардо смягчает границы света и тени, поэтому лицо кажется живым, а едва заметная улыбка остаётся неуловимой. Леонардо да Винчи написал картину примерно в 1503–1519 годах. Место хранения: Лувр, Париж.","sources":[{"label":"From the 'Mona Lisa' to 'The Wedding Feast at Cana'…","url":"https://www.louvre.fr/en/explore/the-palace/from-the-mona-lisa-to-the-wedding-feast-at-cana"},{"label":"Mona Lisa — Wikipedia","url":"https://en.wikipedia.org/wiki/Mona_Lisa"}],"tags":["Мировые шедевры","Ренессанс"],"position":"center 28%","originalImage":"originals/008.jpg","displayFragment":"fragments/008.jpg"},{"author":"Джорджоне","title":"Буря","year":"около 1506–1508","museum":"Галереи Академии, Венеция","image":"originals/009.jpg","description":"Над небольшим городом сгущается гроза, и яркая молния на мгновение прорезает тяжёлое небо. На переднем плане мужчина и женщина с ребёнком остаются погружёнными каждый в свой мир. Их связь неясна, зато ожидание дождя ощущается почти физически благодаря влажной зелени, тёмной воде и напряжённой тишине пейзажа. Джорджоне написал картину примерно в 1506–1508 годах. Место хранения: Галереи Академии, Венеция.","sources":[{"label":"La tempesta | Gallerie dell'Accademia di Venezia","url":"https://www.gallerieaccademia.it/opera/la-tempesta/"},{"label":"The Tempest (Giorgione) — Wikipedia","url":"https://en.wikipedia.org/wiki/The_Tempest_(Giorgione)"}],"tags":["Ренессанс"],"position":"center center","originalImage":"originals/009.jpg","displayFragment":"fragments/009.jpg"},{"author":"Рафаэль Санти","title":"Афинская школа","year":"1509–1511","museum":"Музеи Ватикана, Ватикан","image":"originals/010.jpg","description":"Под высокими сводами античные мыслители спорят, читают и объясняют друг другу устройство мира. В центре Платон указывает вверх, а Аристотель протягивает руку перед собой, словно предлагая два разных направления мысли. Рафаэль объединяет множество отдельных разговоров стройной архитектурой, превращая пространство фрески в образ свободного поиска знания. Рафаэль Санти создал фреску в 1509–1511 годах. Место хранения: Музеи Ватикана, Ватикан.","sources":[{"label":"School of Athens","url":"https://www.museivaticani.va/content/museivaticani/en/collezioni/musei/stanze-di-raffaello/stanza-della-segnatura/scuola-di-atene.html"},{"label":"Room of the Segnatura","url":"https://www.museivaticani.va/content/museivaticani/en/collezioni/musei/stanze-di-raffaello/stanza-della-segnatura/stanza-della-segnatura.html"}],"tags":["Мировые шедевры","Ренессанс"],"position":"center center","originalImage":"originals/010.jpg","displayFragment":"fragments/010.jpg"},{"author":"Микеланджело Буонарроти","title":"Сотворение Адама","year":"около 1511","museum":"Сикстинская капелла, Ватикан","image":"originals/011.jpg","description":"Адам лежит на земле и тянет руку навстречу Богу, но их пальцы ещё не соприкоснулись. Между ними остаётся крошечный просвет, который удерживает всё напряжение сцены. Микеланджело противопоставляет тяжесть покоящегося тела стремительному движению небесной группы, делая ожидание прикосновения почти осязаемым. Микеланджело Буонарроти создал фреску около 1511 года. Место хранения: Сикстинская капелла, Ватикан.","sources":[{"label":"Creation of Adam","url":"https://www.museivaticani.va/content/museivaticani/en/collezioni/musei/cappella-sistina/volta/storie-centrali/creazione-di-adamo.html"},{"label":"Sistine Chapel","url":"https://www.museivaticani.va/content/museivaticani/en/collezioni/musei/cappella-sistina/storia-cappella-sistina.html"}],"tags":["Мировые шедевры","Ренессанс"],"position":"center center","originalImage":"originals/011.jpg","displayFragment":"fragments/011.jpg"},{"author":"Рафаэль Санти","title":"Сикстинская мадонна","year":"1512–1513","museum":"Галерея старых мастеров, Дрезден","image":"originals/012.jpg","description":"Мадонна с младенцем появляется между раздвинутыми занавесями, словно выходит из глубины облаков прямо к зрителю. Её спокойное движение сочетается с серьёзным, тревожным взглядом. Внизу два задумчивых ангела возвращают этой торжественной сцене человеческую непосредственность, связывая небесное явление с миром зрителя. Рафаэль Санти написал картину в 1512–1513 годах. Место хранения: Галерея старых мастеров, Дрезден.","sources":[{"label":"Old Masters Picture Gallery","url":"https://www.visit-dresden-elbland.de/en/poi/old-masters-picture-gallery/"},{"label":"Heavenly Splendour","url":"https://www.museivaticani.va/content/museivaticani/en/eventi-e-novita/iniziative/SpazioIncontro/2011/splendore-celeste--raffaello--duerer-e-gruenewald-dipingono-la-m.html"}],"tags":["Мировые шедевры","Ренессанс"],"position":"center 28%","originalImage":"originals/012.jpg","displayFragment":"fragments/012.jpg"},{"author":"Тициан","title":"Вознесение Девы Марии","year":"1516–1518","museum":"Базилика Санта-Мария-Глориоза-деи-Фрари, Венеция","image":"originals/013.jpg","description":"Дева Мария поднимается к небу, окружённая светом и движением ангелов, а апостолы внизу протягивают к ней руки. Взгляд следует от тяжёлых земных фигур к сияющей верхней части картины. Тициан связывает эти два мира вспышками красного цвета и широкими жестами, придавая вознесению силу общего порыва. Тициан написал алтарный образ в 1516–1518 годах. Место хранения: Базилика Санта-Мария-Глориоза-деи-Фрари, Венеция.","sources":[{"label":"Smarthistory – Titian, Assumption of the Virgin","url":"https://smarthistory.org/titian-assumption-of-the-virgin/"},{"label":"Visite guidate davanti all'Assunta - Basilica dei F…","url":"https://www.basilicadeifrari.it/visite-guidate-davanti-allassunta/"}],"tags":["Ренессанс"],"position":"center 28%","originalImage":"originals/013.jpg","displayFragment":"fragments/013.jpg"},{"author":"Тициан","title":"Вакх и Ариадна","year":"1520–1523","museum":"Национальная галерея, Лондон","image":"originals/014.jpg","description":"Вакх замечает Ариадну и стремительно выпрыгивает из колесницы ей навстречу. Его тело на мгновение замирает в воздухе, а яркая ткань за плечами продолжает движение. Тициан сталкивает этот внезапный порыв с настороженным поворотом девушки, превращая мифологический сюжет в сцену неожиданной и решающей встречи. Тициан написал картину в 1520–1523 годах. Место хранения: Национальная галерея, Лондон.","sources":[{"label":"Titian | Bacchus and Ariadne | NG35 | National Gall…","url":"https://www.nationalgallery.org.uk/paintings/titian-bacchus-and-ariadne"},{"label":"Titian (active about 1506, died 1576) | National Ga…","url":"https://www.nationalgallery.org.uk/artists/titian"}],"tags":["Ренессанс"],"position":"center center","originalImage":"originals/014.jpg","displayFragment":"fragments/014.jpg"},{"author":"Ганс Гольбейн Младший","title":"Послы","year":"1533","museum":"Национальная галерея, Лондон","image":"originals/015.jpg","description":"Два богато одетых человека стоят среди книг, музыкальных инструментов и приборов для изучения мира. Всё кажется устойчивым и тщательно упорядоченным, пока взгляд не замечает странную вытянутую форму у их ног. Под определённым углом она превращается в череп, и торжественный портрет приобретает тревожное напоминание о хрупкости человеческих достижений. Ганс Гольбейн Младший написал картину в 1533 году. Место хранения: Национальная галерея, Лондон.","sources":[{"label":"The Ambassadors | National Gallery Catalogues: The…","url":"https://www.nationalgallery.org.uk/paintings/catalogues/foister-2024/the-ambassadors"},{"label":"The Ambassadors (Holbein) — Wikipedia","url":"https://en.wikipedia.org/wiki/The_Ambassadors_(Holbein)"}],"tags":["Ренессанс"],"position":"center center","originalImage":"originals/015.jpg","displayFragment":"fragments/015.jpg"},{"author":"Микеланджело Буонарроти","title":"Страшный суд","year":"1536–1541","museum":"Сикстинская капелла, Ватикан","image":"originals/016.jpg","description":"Огромное множество фигур приходит в движение вокруг Христа: одни поднимаются, другие падают, третьи цепляются друг за друга. Здесь почти не остаётся спокойного пространства, в котором взгляд мог бы отдохнуть. Микеланджело передаёт страх, надежду и напряжение через мощные тела и резкие повороты, превращая стену капеллы в единый человеческий водоворот. Микеланджело Буонарроти создал фреску в 1536–1541 годах. Место хранения: Сикстинская капелла, Ватикан.","sources":[{"label":"The Last Judgement","url":"https://www.museivaticani.va/content/museivaticani/en/collezioni/musei/cappella-sistina/giudizio-universale.html"},{"label":"Sistine Chapel","url":"https://www.museivaticani.va/content/museivaticani/en/collezioni/musei/cappella-sistina/storia-cappella-sistina.html"}],"tags":["Ренессанс"],"position":"center 28%","originalImage":"originals/016.jpg","displayFragment":"fragments/016.jpg"},{"author":"Ганс Гольбейн Младший","title":"Портрет Генриха VIII","year":"около 1537","museum":"Национальный музей Тиссена-Борнемисы, Мадрид","image":"originals/017.jpg","description":"Генрих VIII смотрит прямо на зрителя с тяжёлым, неподвижным спокойствием. Драгоценности, мех и богатая ткань подчёркивают его положение, но главным выразительным средством остаётся сама уверенная посадка фигуры. Чёткие контуры и внимательная проработка лица делают присутствие монарха почти ощутимым. Ганс Гольбейн Младший написал картину около 1537 года. Место хранения: Национальный музей Тиссена-Борнемисы, Мадрид.","sources":[{"label":"Portrait of Henry VIII of England - Holbein, Hans e…","url":"https://www.museothyssen.org/en/collection/artists/holbein-hans-joven/portrait-henry-viii-england"},{"label":"Holbein, Hans el Joven. Museo Nacional Thyssen-Born…","url":"https://www.museothyssen.org/en/collection/artists/holbein-hans-joven"}],"tags":["Ренессанс"],"position":"center 28%","originalImage":"originals/017.jpg","displayFragment":"fragments/017.jpg"},{"author":"Тициан","title":"Венера Урбинская","year":"1538","museum":"Галерея Уффици, Флоренция","image":"originals/018.jpg","description":"Венера лежит на светлой постели и спокойно встречает взгляд зрителя. Тёплый оттенок кожи, мягкие ткани и глубокий красный цвет создают ощущение близости и уюта. В глубине комнаты служанки заняты повседневными делами, и благодаря этой бытовой подробности античная богиня оказывается частью жилого венецианского дома. Тициан написал картину в 1538 году. Место хранения: Галерея Уффици, Флоренция.","sources":[{"label":"Venus of Urbino by Titian | Uffizi Galleries","url":"https://www.uffizi.it/en/artworks/venus-urbino-titian"},{"label":"Smarthistory – Titian, Venus of Urbino","url":"https://smarthistory.org/titian-venus-of-urbino/"}],"tags":["Ренессанс"],"position":"center center","originalImage":"originals/018.jpg","displayFragment":"fragments/018.jpg"},{"author":"Питер Брейгель Старший","title":"Вавилонская башня (малая)","year":"около 1568","museum":"Музей Бойманса — ван Бёнингена, Роттердам","image":"originals/019.jpg","description":"Над берегом вырастает огромная башня, вокруг которой человеческие фигуры и суда кажутся почти незаметными. Её ярусы поднимаются по спирали, открывая всё новые проходы, арки и строительные леса. Брейгель соединяет размах человеческого замысла с ощущением его непрочности: здание выглядит грандиозным и одновременно бесконечно незавершённым. Питер Брейгель Старший написал картину около 1568 года. Место хранения: Музей Бойманса — ван Бёнингена, Роттердам.","sources":[{"label":"De toren van Babel - Museum Boijmans Van Beuningen","url":"https://www.boijmans.nl/collectie/kunstwerken/3723/de-toren-van-babel"},{"label":"The Tower of Babel (Bruegel) — Wikipedia","url":"https://en.wikipedia.org/wiki/The_Tower_of_Babel_(Bruegel)"}],"tags":["Ренессанс"],"position":"center center","originalImage":"originals/019.jpg","displayFragment":"fragments/019.jpg"},{"author":"Питер Брейгель Старший","title":"Крестьянская свадьба","year":"около 1567","museum":"Музей истории искусств, Вена","image":"originals/020.jpg","description":"За длинным столом тесно собрались гости, а перед ними проносят миски с едой на широкой доске. Праздник складывается из небольших действий, поворотов голов и разговоров, которые хочется рассматривать по отдельности. Брейгель передаёт тепло многолюдного застолья через простые жесты и плотный ритм фигур. Питер Брейгель Старший написал картину около 1567 года. Место хранения: Музей истории искусств, Вена.","sources":[{"label":"Peasant Wedding - Pieter Bruegel the Elder — Google…","url":"https://artsandculture.google.com/asset/peasant-wedding/hgGvote2WI8P3w?hl=en-GB"},{"label":"BRUEGEL OCTOBER 2, 2018 - JANUARY 13, 2019 At the","url":"https://press.khm.at/fileadmin/content/KHM/Presse/2018/Bruegel/PT_Bruegel_E.pdf"}],"tags":["Ренессанс"],"position":"center center","originalImage":"originals/020.jpg","displayFragment":"fragments/020.jpg"},{"author":"Кано Эйтоку","title":"Кипарисы","year":"около 1590","museum":"Токийский национальный музей, Токио","image":"originals/021.jpg","description":"Могучий кипарис раскидывает ветви по золотой поверхности ширмы, словно ему тесно в пределах изображения. Изгибы ствола перекликаются с очертаниями скал, а тёмная хвоя особенно ярко выделяется на сияющем фоне. Кано Эйтоку придаёт дереву почти архитектурную силу, превращая природную форму в торжественный образ. Кано Эйтоку создал роспись ширмы около 1590 года. Место хранения: Токийский национальный музей, Токио.","sources":[{"label":"TOKYO NATIONAL MUSEUM - Collections The TNM Collect…","url":"https://www.tnm.jp/modules/r_collection/index.php?colid=A1069&controller=dtl&lang=en"},{"label":"TOKYO NATIONAL MUSEUM - Exhibitions and Events Exhi…","url":"https://www.tnm.jp/modules/r_exhibition/index.php?controller=item&id=7550&lang=en"}],"tags":["Япония"],"position":"center center","originalImage":"originals/021.jpg","displayFragment":"fragments/021.jpg"},{"author":"Неизвестный английский художник","title":"Армадный портрет Елизаветы I","year":"около 1588","museum":"Королевские музеи Гринвича, Лондон","image":"originals/022.jpg","description":"Елизавета I сидит среди пышных тканей и жемчуга, положив руку на земной шар. Морские сцены за её спиной расширяют пространство портрета далеко за пределы дворцовой комнаты. Неподвижная фигура королевы становится центром тщательно построенного образа власти, в котором платье, жест и фон говорят на одном языке. Неизвестный английский художник написал картину около 1588 года. Место хранения: Королевские музеи Гринвича, Лондон.","sources":[{"label":"Armada Portrait — Royal Museums Greenwich","url":"https://www.rmg.co.uk/collections/objects/rmgc-object-1096108"},{"label":"Armada Portrait at the Queen’s House","url":"https://www.rmg.co.uk/queens-house/attractions/armada-portrait-elizabeth-i"}],"tags":["Ренессанс"],"position":"center center","originalImage":"originals/022.jpg","displayFragment":"fragments/022.jpg"},{"author":"Хасэгава Тохаку","title":"Сосны","year":"около 1595","museum":"Токийский национальный музей, Токио","image":"originals/023.jpg","description":"Сосны то проступают из тумана, то почти исчезают в незакрашенной бумаге. Нескольких уверенных мазков достаточно, чтобы почувствовать шероховатость стволов и лёгкость хвои. Хасэгава Тохаку оставляет между деревьями много свободного пространства, и именно оно наполняет ширму воздухом, глубиной и тихим ожиданием. Хасэгава Тохаку создал роспись ширм около 1595 года. Место хранения: Токийский национальный музей, Токио.","sources":[{"label":"e-Museum - Pine Trees screen","url":"https://emuseum.nich.go.jp/detail?content_base_id=100151&content_part_id=001&content_pict_id=004&langId=en&webView=0"},{"label":"TOKYO NATIONAL MUSEUM - Exhibitions and Events Exhi…","url":"https://www.tnm.jp/modules/r_exhibition/index.php?controller=item&id=6470&lang=en"}],"tags":["Япония"],"position":"center center","originalImage":"originals/023.jpg","displayFragment":"fragments/023.jpg"},{"author":"Рембрандт","title":"Ночной дозор","year":"1642","museum":"Рейксмюсеум, Амстердам","image":"originals/024.jpg","description":"Стрелковая рота приходит в движение, выходя из полумрака навстречу свету. Жест капитана, поднятое оружие и повороты фигур создают ощущение команды, только что прозвучавшей в толпе. Рембрандт освещает одни лица и погружает другие в тень, превращая официальный групповой портрет в живую, шумную сцену. Рембрандт написал картину в 1642 году. Место хранения: Рейксмюсеум, Амстердам.","sources":[{"label":"The Night Watch Militia Company of District II unde…","url":"https://www.rijksmuseum.nl/en/collection/object/The-Night-Watch-Militia-Company-of-District-II-under-the-Command-of-Captain-Frans-Banninck-Cocq--3137deb45cd7765f9a76084a16c99544?tab=data"},{"label":"10 things about Rembrandt’s Night Watch","url":"https://www.rijksmuseum.nl/en/stories/10-things/story/10-things-about-rembrandt-s-night-watch"}],"tags":["Европа XVII–XIX веков — великие мастера","Мировые шедевры"],"position":"center center","originalImage":"originals/024.jpg","displayFragment":"fragments/024.jpg"},{"author":"Диего Веласкес","title":"Менины","year":"1656","museum":"Музей Прадо, Мадрид","image":"originals/025.jpg","description":"В дворцовой комнате на мгновение пересекаются взгляды инфанты, фрейлин, придворных и самого Веласкеса у мольберта. Кажется, что зритель вошёл как раз в тот момент, когда все заметили чьё-то появление. Зеркало в глубине отражает короля и королеву и заставляет задуматься, где проходит граница между изображённой сценой и пространством перед картиной. Диего Веласкес написал картину в 1656 году. Место хранения: Музей Прадо, Мадрид.","sources":[{"label":"Las Meninas - The Collection - Museo Nacional del P…","url":"https://www.museodelprado.es/en/the-collection/art-work/las-meninas/9fdc7800-9ade-48b0-ab8b-edee94ea877f"},{"label":"Meninas, Las [Velázquez] - Museo Nacional del Prado","url":"https://www.museodelprado.es/aprende/enciclopedia/voz/meninas-las-velazquez/296ac38f-8bf6-439d-b13c-ed22de8c39de"}],"tags":["Европа XVII–XIX веков — великие мастера","Мировые шедевры"],"position":"center 28%","originalImage":"originals/025.jpg","displayFragment":"fragments/025.jpg"},{"author":"Ян Вермеер","title":"Молочница","year":"около 1658–1661","museum":"Рейксмюсеум, Амстердам","image":"originals/026.jpg","description":"Служанка сосредоточенно переливает молоко, и тонкая струя становится самым заметным движением в тихой комнате. Дневной свет ложится на её руки, грубую ткань одежды и корку хлеба. Вермеер придаёт простому домашнему занятию такую ясность и весомость, что обычное мгновение хочется рассматривать долго. Ян Вермеер написал картину примерно в 1658–1661 годах. Место хранения: Рейксмюсеум, Амстердам.","sources":[{"label":"The Milkmaid - Rijksmuseum","url":"https://www.rijksmuseum.nl/en/collection/object/The-Milkmaid--42dd0e658c2979aec8e144d2357c55c0"},{"label":"Vermeer exhibition texts - Rijksmuseum","url":"https://www.rijksmuseum.nl/en/whats-on/exhibitions/past/vermeer/vermeer-exhibition-text"}],"tags":["Европа XVII–XIX веков — великие мастера"],"position":"center 28%","originalImage":"originals/026.jpg","displayFragment":"fragments/026.jpg"},{"author":"Ян Вермеер","title":"Девушка с жемчужной серёжкой","year":"около 1665","museum":"Маурицхёйс, Гаага","image":"originals/027.jpg","description":"Девушка оборачивается к зрителю, словно только что услышала своё имя. Из тёмного фона выступают освещённое лицо, приоткрытые губы и мягкий блеск серьги. Вермеер почти не оставляет подробностей обстановки, поэтому всё внимание сосредоточено на этом коротком, удивительно живом обмене взглядами. Ян Вермеер написал картину около 1665 года. Место хранения: Маурицхёйс, Гаага.","sources":[{"label":"Johannes Vermeer Girl with a Pearl Earring | Maurit…","url":"https://www.mauritshuis.nl/en/our-collection/artworks/670-girl-with-a-pearl-earring"},{"label":"Het Meisje met de parel: beroemdste meisje ter were…","url":"https://www.mauritshuis.nl/ontdek-collectie/verhalen/meisje-met-de-parel"}],"tags":["Европа XVII–XIX веков — великие мастера","Мировые шедевры"],"position":"center 28%","originalImage":"originals/027.jpg","displayFragment":"fragments/027.jpg"},{"author":"Хисикава Моронобу","title":"Красавица, оглядывающаяся назад","year":"около 1690","museum":"Токийский национальный музей, Токио","image":"originals/028.jpg","description":"Женщина в красном кимоно оглядывается через плечо, сохраняя плавность шага. Узорная ткань собирается в широкие изгибы, которые делают движение заметным даже без подробного окружения. Моронобу оставляет фон свободным, позволяя силуэту, цвету и одному повороту головы рассказать всю сцену. Хисикава Моронобу написал картину около 1690 года. Место хранения: Токийский национальный музей, Токио.","sources":[{"label":"TOKYO NATIONAL MUSEUM - Collections The TNM Collect…","url":"https://www.tnm.jp/modules/r_collection/index.php?colid=A60&controller=dtl&id=11&lang=en&t=type"},{"label":"Beauty Looking Back","url":"https://cpcp.nich.go.jp/modules/r_db/index.php?controller=dtl&id=5&lang=en&t=db_hukusei"}],"tags":["Япония"],"position":"center 28%","originalImage":"originals/028.jpg","displayFragment":"fragments/028.jpg"},{"author":"Огата Корин","title":"Ирисы","year":"около 1701–1705","museum":"Музей Нэдзу, Токио","image":"originals/029.jpg","description":"Синие ирисы поднимаются над золотым фоном густыми, неровными группами. Их похожие очертания повторяются с небольшими изменениями, создавая ритм, по которому легко скользит взгляд. Огата Корин соединяет свежесть живых растений с ясностью узора, а золото лишает цветы привычного земного окружения. Огата Корин создал роспись ширм примерно в 1701–1705 годах. Место хранения: Музей Нэдзу, Токио.","sources":[{"label":"Irises — Nezu Museum","url":"https://www.nezu-muse.or.jp/en/collection/detail.php?id=10301"},{"label":"Irises Screens: The Age of Kōrin — Nezu Museum","url":"https://www.nezu-muse.or.jp/en/exhibitions/view-97.html"}],"tags":["Япония"],"position":"center center","originalImage":"originals/029.jpg","displayFragment":"fragments/029.jpg"},{"author":"Огата Корин","title":"Красные и белые цветы сливы","year":"около 1712–1716","museum":"Художественный музей Атами (MOA), Атами","image":"originals/030.jpg","description":"Между двумя цветущими сливами извивается тёмный поток с серебристым рисунком волн. Старые стволы и нежные цветы особенно выразительны рядом с ровным золотым фоном. Корин строит композицию на различии тяжёлого дерева, лёгкого цветения и непрерывного движения воды, соединяя их в один спокойный ритм. Огата Корин создал роспись ширм примерно в 1712–1716 годах. Место хранения: Художественный музей Атами (MOA), Атами.","sources":[{"label":"Red and White Plum Blossoms – MOA美術館 | MOA MUSEUM O…","url":"https://www.moaart.or.jp/en/event/redandwhite/"},{"label":"Ogata Kōrin’s Opus Magnum: Red and White Plum Bloss…","url":"https://www.moaart.or.jp/en/event/korinfujinraijin/"}],"tags":["Япония"],"position":"center center","originalImage":"originals/030.jpg","displayFragment":"fragments/030.jpg"},{"author":"Франсуа Буше","title":"Портрет мадам де Помпадур","year":"1756","museum":"Старая пинакотека, Мюнхен","image":"originals/031.jpg","description":"Мадам де Помпадур отдыхает в кресле среди книг, цветов и изящных предметов. Роскошное платье занимает большую часть картины, но её свободная поза смягчает придворную торжественность. Буше окружает героиню вещами, которые помогают увидеть за внешним блеском интерес к чтению и искусству. Франсуа Буше написал картину в 1756 году. Место хранения: Старая пинакотека, Мюнхен.","sources":[{"label":"Sammlung | Madame de Pompadour","url":"https://www.sammlung.pinakothek.de/de/artwork/Dj4mX97G5A/francois-boucher/madame-de-pompadour"},{"label":"Madame de Pompadour — Google Arts & Culture","url":"https://artsandculture.google.com/story/madame-de-pompadour-alte-pinakothek/-wURR1pyWsF9Ig?hl=de"}],"tags":["Европа XVII–XIX веков — великие мастера"],"position":"center 28%","originalImage":"originals/031.jpg","displayFragment":"fragments/031.jpg"},{"author":"Ито Дзякутю","title":"Петух и курица","year":"1759","museum":"Музей императорских коллекций, Токио","image":"originals/032.jpg","description":"Петух и курица показаны с такой внимательностью, что хочется разглядывать каждое перо и поворот головы. Пустой фон подчёркивает различие их силуэтов и делает обычных домашних птиц главными героями изображения. Ито Дзякутю соединяет точность наблюдения с изяществом линии, находя красоту в самых привычных формах жизни. Ито Дзякутю написал картину в 1759 году. Место хранения: Музей императорских коллекций, Токио.","sources":[{"label":"Серия «Красочный мир живых существ» — музей Пти-Пале","url":"https://www.petitpalais.paris.fr/sites/default/files/content/press-kits/dp_jakuchu_en.pdf"},{"label":"Rooster and Hen — Sannomaru Shōzōkan","url":"https://collection.shozokan.nich.go.jp/en/object/SZK002949-007"}],"tags":["Япония"],"position":"center 28%","originalImage":"originals/032.jpg","displayFragment":"fragments/032.jpg"},{"author":"Жан-Оноре Фрагонар","title":"Качели","year":"1767","museum":"Музей Уоллеса, Лондон","image":"originals/033.jpg","description":"Молодая женщина взлетает на качелях среди густой зелени, и с её ноги срывается лёгкая туфелька. Розовое платье раскрывается пышным цветком, а фигуры в тени придают сцене оттенок тайной игры. Фрагонар передаёт головокружительную лёгкость момента через воздушные мазки, солнечные блики и летящее движение ткани. Жан-Оноре Фрагонар написал картину в 1767 году. Место хранения: Музей Уоллеса, Лондон.","sources":[{"label":"Fragonard's The Swing - The Wallace Collection","url":"https://www.wallacecollection.org/explore/explore-in-depth/fragonards-the-swing/"},{"label":"Conserving The Swing - The Wallace Collection","url":"https://www.wallacecollection.org/explore/explore-in-depth/fragonards-the-swing/conserving-the-swing/"}],"tags":["Европа XVII–XIX веков — великие мастера"],"position":"center 28%","originalImage":"originals/033.jpg","displayFragment":"fragments/033.jpg"},{"author":"Томас Гейнсборо","title":"Голубой мальчик","year":"1770","museum":"Художественный музей Хантингтона, Сан-Марино","image":"originals/034.jpg","description":"Юноша в голубом атласном костюме уверенно стоит перед тёмным пейзажем. Свет скользит по складкам, заставляя ткань переливаться холодными и серебристыми оттенками. Свободная поза придаёт парадному образу непринуждённость, а голубой цвет связывает лицо, одежду и окружающий воздух в единое целое. Томас Гейнсборо написал картину в 1770 году. Место хранения: Художественный музей Хантингтона, Сан-Марино.","sources":[{"label":"The Blue Boy | The Huntington","url":"https://www.huntington.org/art-museum/british-and-european-art/blue-boy"},{"label":"Project Blue Boy | The Huntington","url":"https://www.huntington.org/exhibitions/project-blue-boy"}],"tags":["Европа XVII–XIX веков — великие мастера"],"position":"center 28%","originalImage":"originals/034.jpg","displayFragment":"fragments/034.jpg"},{"author":"Элизабет Виже-Лебрен","title":"Мария Антуанетта","year":"1783","museum":"Версальский дворец, Версаль","image":"originals/035.jpg","description":"Мария-Антуанетта держит розу, окружённая мягким сиянием шёлка и кружева. Тонкая проработка тканей подчёркивает роскошь наряда, а небольшой цветок делает позу менее официальной. Виже-Лебрен соединяет придворную представительность с мягкостью выражения, создавая сдержанный и изящный образ королевы. Элизабет Виже-Лебрен написала картину в 1783 году. Место хранения: Версальский дворец, Версаль.","sources":[{"label":"Élisabeth Louise Vigée Le Brun | Château de Versailles","url":"https://en.chateauversailles.fr/discover/history/great-characters/elisabeth-louise-vigee-brun"},{"label":"Marie-Antoinette with the Rose - Louise Elisabeth V…","url":"https://artsandculture.google.com/asset/marie-antoinette-with-the-rose-0001/qwHgKqLoAQb9FQ"}],"tags":["Европа XVII–XIX веков — великие мастера"],"position":"center 28%","originalImage":"originals/035.jpg","displayFragment":"fragments/035.jpg"},{"author":"Жак-Луи Давид","title":"Смерть Марата","year":"1793","museum":"Королевские музеи изящных искусств Бельгии, Брюссель","image":"originals/036.jpg","description":"Марат неподвижно лежит в ванне, всё ещё удерживая следы своей последней работы. Письмо, перо и простая деревянная тумба резко выделяются на фоне пустого тёмного пространства. Давид убирает лишние подробности и направляет внимание на опустившуюся руку и освещённое лицо, превращая сцену смерти в строгий, скорбный образ. Жак-Луи Давид написал картину в 1793 году. Место хранения: Королевские музеи изящных искусств Бельгии, Брюссель.","sources":[{"label":"Œuvre « Marat assassiné » – Musées royaux des Beaux…","url":"https://fine-arts-museum.be/fr/la-collection/jacques-louis-david-marat-assassine"},{"label":"Le château de Versailles prête « Marat assassiné »…","url":"https://www.chateauversailles.fr/presse/collections/chateau-versailles-prete-marat-assassine-aux-musees-royaux-beaux-arts-belgique"}],"tags":["Европа XVII–XIX веков — великие мастера","Мировые шедевры"],"position":"center 28%","originalImage":"originals/036.jpg","displayFragment":"fragments/036.jpg"},{"author":"Франсиско Гойя","title":"Маха одетая","year":"1800–1807","museum":"Музей Прадо, Мадрид","image":"originals/037.jpg","description":"Женщина полулежит на подушках и смотрит на зрителя прямо и уверенно. Светлая одежда подчёркивает изгиб фигуры, а тёмный фон делает её присутствие особенно близким. Гойя сохраняет расслабленность позы, но во взгляде героини чувствуется самостоятельность, которая не позволяет воспринимать её только как красивую модель. Франсиско Гойя написал картину в 1800–1807 годах. Место хранения: Музей Прадо, Мадрид.","sources":[{"label":"The Clothed Maja - The Collection - Museo Nacional…","url":"https://www.museodelprado.es/en/the-collection/art-work/the-clothed-maja/a3121efc-6924-454c-8a9f-e4320f26d3d0"},{"label":"The Clothed Maja (La maja vestida) - Fundación Goya…","url":"https://www.fundaciongoyaenaragon.com/eng/obra/la-maja-vestida/581"}],"tags":["Европа XVII–XIX веков — великие мастера","Мировые шедевры"],"position":"center center","originalImage":"originals/037.jpg","displayFragment":"fragments/037.jpg"},{"author":"Жак-Луи Давид","title":"Бонапарт на перевале Сен-Бернар","year":"1801","museum":"Музей Мальмезон, Рюэй-Мальмезон","image":"originals/038.jpg","description":"Бонапарт на вздыбленном коне указывает путь через горы, пока ветер подхватывает его плащ. Склон, грива и складки ткани направлены в разные стороны, усиливая напряжение движения. Спокойное лицо всадника становится центром этой бурной сцены, превращая трудный переход в торжественный образ решимости. Жак-Луи Давид написал картину в 1801 году. Место хранения: Музей Мальмезон, Рюэй-Мальмезон.","sources":[{"label":"Bonaparte crossing the Great St Bernard Pass - napo…","url":"https://www.napoleon.org/en/history-of-the-two-empires/paintings/bonaparte-crossing-the-great-st-bernard-pass"},{"label":"Napoleon Crossing the Alps","url":"https://en.wikipedia.org/wiki/Napoleon_Crossing_the_Alps"}],"tags":["Европа XVII–XIX веков — великие мастера","Мировые шедевры"],"position":"center 28%","originalImage":"originals/038.jpg","displayFragment":"fragments/038.jpg"},{"author":"Франсиско Гойя","title":"Третье мая 1808 года в Мадриде","year":"1814","museum":"Музей Прадо, Мадрид","image":"originals/039.jpg","description":"Мужчина в белой рубашке раскрывает руки перед шеренгой солдат, чьи лица скрыты от зрителя. Свет фонаря выхватывает обречённых людей из ночной темноты и делает их страх предельно близким. Гойя противопоставляет каждому отдельному человеческому лицу безличный строй оружия, лишая сцену всякой военной торжественности. Франсиско Гойя написал картину в 1814 году. Место хранения: Музей Прадо, Мадрид.","sources":[{"label":"The 3rd of May 1808 in Madrid, or “The Executions”…","url":"https://www.museodelprado.es/en/the-collection/art-work/the-3rd-of-may-1808-in-madrid-or-the-executions/5e177409-2993-4240-97fb-847a02c6496c?searchid=9f0b363b-8278-60d0-fb62-378200588328"},{"label":"El tres de mayo de 1808 - Fundación Goya en Aragón","url":"https://www.nueva.fundaciongoyaenaragon.es/obra/el-tres-de-mayo-de-1808/181"}],"tags":["Европа XVII–XIX веков — великие мастера"],"position":"center center","originalImage":"originals/039.jpg","displayFragment":"fragments/039.jpg"},{"author":"Каспар Давид Фридрих","title":"Странник над морем тумана","year":"около 1817","museum":"Гамбургский кунстхалле, Гамбург","image":"originals/040.jpg","description":"Одинокий путник стоит над морем тумана, из которого выступают лишь вершины скал. Его спина обращена к зрителю, и мы смотрим вдаль словно вместе с ним. Фридрих оставляет пейзаж частично скрытым, поэтому ощущение высоты соединяется с неизвестностью, а неподвижная фигура подчёркивает огромный масштаб природы. Каспар Давид Фридрих написал картину около 1817 года. Место хранения: Гамбургский кунстхалле, Гамбург.","sources":[{"label":"»Wanderer Above the Sea of Fog« by Caspar David Fri…","url":"https://www.hamburger-kunsthalle.com/en/wanderer-above-sea-fog-caspar-david-friedrich"},{"label":"Friedrich - Wanderer über dem Nebelmeer","url":"https://geheimnis-der-bilder.zdf.de/hamburger-kunsthalle/caspar-david-friedrich-der-wanderer-%C3%BCber-dem-nebelmeer.html"}],"tags":["Европа XVII–XIX веков — великие мастера"],"position":"center 28%","originalImage":"originals/040.jpg","displayFragment":"fragments/040.jpg"},{"author":"Джон Констебл","title":"Телега для сена","year":"1821","museum":"Национальная галерея, Лондон","image":"originals/041.jpg","description":"Телега медленно пересекает мелкую реку рядом с деревенским домом. Свет пробивается сквозь облака, отражается в воде и оживляет густую зелень берегов. Констебл связывает повседневный сельский труд с изменчивым дыханием пейзажа, создавая ощущение места, которое живёт своим неспешным ходом. Джон Констебл написал картину в 1821 году. Место хранения: Национальная галерея, Лондон.","sources":[{"label":"John Constable | The Hay Wain | NG1207 | National G…","url":"https://www.nationalgallery.org.uk/paintings/john-constable-the-hay-wain/"},{"label":"The Hay Wain | National Gallery Catalogues: The Bri…","url":"https://www.nationalgallery.org.uk/paintings/catalogues/egerton-2000/the-hay-wain"}],"tags":["Европа XVII–XIX веков — великие мастера"],"position":"center center","originalImage":"originals/041.jpg","displayFragment":"fragments/041.jpg"},{"author":"Карл Брюллов","title":"Последний день Помпеи","year":"1830–1833","museum":"Государственный Русский музей, Санкт-Петербург","image":"originals/042.jpg","description":"В свете извержения жители Помпей пытаются спасти детей, близких и вещи, ещё недавно составлявшие их обычную жизнь. Толпа распадается на отдельные группы, и у каждой есть собственная история страха или самоотверженности. Брюллов связывает эти сцены вспышками света и широкими движениями, позволяя увидеть в общей катастрофе судьбы конкретных людей. Карл Брюллов написал картину в 1830–1833 годах. Место хранения: Государственный Русский музей, Санкт-Петербург.","sources":[{"label":"Последний день Помпеи - Русский музей","url":"https://rusmuseum.ru/collections/painting-of-xviii-first-half-xix-centuries/posledniy-den-pompei/"},{"label":"Брюллов К. П. Последний день Помпеи - Виртуальный Р…","url":"https://rusmuseumvrm.ru/data/collections/painting/18_19/zh-5084/index.php"}],"tags":["Мировые шедевры","Русская классика"],"position":"center center","originalImage":"originals/042.jpg","displayFragment":"fragments/042.jpg"},{"author":"Кацусика Хокусай","title":"Большая волна в Канагаве","year":"около 1830–1832","museum":"Метрополитен-музей, Нью-Йорк","image":"originals/043.jpg","description":"Огромная волна нависает над лодками, и её белая пена похожа на множество напряжённых пальцев. Вдали маленькая Фудзи остаётся неподвижной, почти теряясь между изгибами воды. Хокусай сталкивает близкую, стремительную стихию с далёким спокойствием горы, отчего опасность ощущается ещё острее. Кацусика Хокусай создал гравюру примерно в 1830–1832 годах. Место хранения: Метрополитен-музей, Нью-Йорк.","sources":[{"label":"Katsushika Hokusai - Under the Wave off Kanagawa (K…","url":"https://www.metmuseum.org/art/collection/search/45434"},{"label":"Hokusai’s Thirty-Six Views of Mt.Fuji – MOA美術館 | MO…","url":"https://www.moaart.or.jp/en/event/hokusai-3/"}],"tags":["Мировые шедевры","Япония"],"position":"center center","originalImage":"originals/043.jpg","displayFragment":"fragments/043.jpg"},{"author":"Кацусика Хокусай","title":"Гроза под вершиной (из серии «Тридцать шесть видов Фудзи»)","year":"около 1830–1832","museum":"Метрополитен-музей, Нью-Йорк","image":"originals/044.jpg","description":"Над нижним склоном Фудзи сгущается тьма, прорезанная резкой вспышкой молнии. Высокая вершина остаётся в ясном свете, словно принадлежит совсем другой погоде. Хокусай сводит бурю к нескольким большим цветовым областям, и на их границе особенно сильно чувствуется внезапность природного движения. Кацусика Хокусай создал гравюру примерно в 1830–1832 годах. Место хранения: Метрополитен-музей, Нью-Йорк.","sources":[{"label":"Katsushika Hokusai - Storm below Mount Fuji (Sanka…","url":"https://www.metmuseum.org/art/collection/search/36492"},{"label":"Hokusai’s Thirty-Six Views of Mt.Fuji – MOA美術館 | MO…","url":"https://www.moaart.or.jp/en/event/hokusai-3/"}],"tags":["Япония"],"position":"center center","originalImage":"originals/044.jpg","displayFragment":"fragments/044.jpg"},{"author":"Кацусика Хокусай","title":"Южный ветер. Ясный день («Красная Фудзи»)","year":"около 1830–1832","museum":"Метрополитен-музей, Нью-Йорк","image":"originals/045.jpg","description":"Красный склон Фудзи поднимается над тёмной полосой леса к чистому небу. Длинные белые облака подчёркивают широту пространства и неподвижность огромной горы. Хокусай сохраняет лишь самые выразительные формы и цвета, передавая короткое мгновение, когда утренний свет преображает знакомый пейзаж. Кацусика Хокусай создал гравюру примерно в 1830–1832 годах. Место хранения: Метрополитен-музей, Нью-Йорк.","sources":[{"label":"«Южный ветер. Ясный день» — Британский музей","url":"https://www.britishmuseum.org/collection/object/A_1906-1220-0-525"},{"label":"Katsushika Hokusai - South Wind, Clear Sky (Gaifū k…","url":"https://www.metmuseum.org/art/collection/search/36490?locale=en&pg=1"},{"label":"Hokusai’s Thirty-Six Views of Mt.Fuji – MOA美術館 | MO…","url":"https://www.moaart.or.jp/en/event/hokusai-3/"}],"tags":["Япония"],"position":"center center","originalImage":"originals/045.jpg","displayFragment":"fragments/045.jpg"},{"author":"Эжен Делакруа","title":"Свобода, ведущая народ","year":"1830","museum":"Лувр, Париж","image":"originals/046.jpg","description":"Женщина с трёхцветным флагом ведёт людей вперёд сквозь дым и обломки баррикады. Её широкий шаг собирает вокруг себя движение всей толпы, а яркое полотнище становится высшей точкой композиции. Делакруа соединяет узнаваемую уличную борьбу с аллегорией Свободы, придавая сцене силу общего порыва. Эжен Делакруа написал картину в 1830 году. Место хранения: Лувр, Париж.","sources":[{"label":"Le 28 juillet 1830. La Liberté guidant le peuple -…","url":"https://collections.louvre.fr/en/ark%3A/53355/cl010065872"},{"label":"La restauration de la Liberté \"rend justice au trav…","url":"https://www.louvre.fr/decouvrir/vie-du-musee/la-restauration-de-la-liberte-rend-justice-au-travail-d-un-coloriste-de-genie"}],"tags":["Европа XVII–XIX веков — великие мастера","Мировые шедевры"],"position":"center center","originalImage":"originals/046.jpg","displayFragment":"fragments/046.jpg"},{"author":"Иван Айвазовский","title":"Девятый вал","year":"1850","museum":"Государственный Русский музей, Санкт-Петербург","image":"originals/047.jpg","description":"После кораблекрушения люди тесно прижимаются к обломку мачты среди огромных волн. Рассветный свет проходит сквозь гребни, окрашивая воду в золотистые и зелёные оттенки. Айвазовский показывает море одновременно прекрасным и опасным, а маленькая группа уцелевших заставляет особенно остро почувствовать надежду на спасение. Иван Айвазовский написал картину в 1850 году. Место хранения: Государственный Русский музей, Санкт-Петербург.","sources":[{"label":"Айвазовский И. К. Девятый вал - Виртуальный Русский…","url":"https://rusmuseumvrm.ru/data/collections/painting/18_19/zh_2202/"},{"label":"The Ninth Wave — Wikipedia","url":"https://en.wikipedia.org/wiki/The_Ninth_Wave"}],"tags":["Мировые шедевры","Русская классика"],"position":"center center","originalImage":"originals/047.jpg","displayFragment":"fragments/047.jpg"},{"author":"Утагава Хиросигэ","title":"Водовороты в провинции Ава","year":"1857","museum":"Метрополитен-музей, Нью-Йорк","image":"originals/048.jpg","description":"Вода закручивается в огромный водоворот между скалами, увлекая взгляд в глубину изображения. Белые линии пены подчёркивают вращение, а дальний берег кажется спокойным рядом с движением переднего плана. Хиросигэ превращает наблюдение за морем в выразительный узор, в котором чувствуется тяжесть и напор воды. Утагава Хиросигэ создал гравюру в 1857 году. Место хранения: Метрополитен-музей, Нью-Йорк.","sources":[{"label":"Водовороты в провинции Ава — Кливлендский музей искусств","url":"https://www.clevelandart.org/print/art/1930.183.a"},{"label":"The Whirlpools of Awa — The Metropolitan Museum of Art","url":"https://www.metmuseum.org/art/collection/search/45025"}],"tags":["Япония"],"position":"center 28%","originalImage":"originals/048.jpg","displayFragment":"fragments/048.jpg"},{"author":"Жан-Франсуа Милле","title":"Анжелюс (Вечерняя молитва)","year":"1857–1859","museum":"Музей Орсе, Париж","image":"originals/049.jpg","description":"Мужчина и женщина останавливают работу в поле и склоняют головы для вечерней молитвы. На фоне затихающего неба их фигуры кажутся тёмными и неподвижными. Милле передаёт сосредоточенность через простые жесты и свободное пространство вокруг людей, позволяя почувствовать короткую тишину посреди трудового дня. Жан-Франсуа Милле написал картину в 1857–1859 годах. Место хранения: Музей Орсе, Париж.","sources":[{"label":"L'Angélus - Jean-François Millet | Musée d'Orsay","url":"https://www.musee-orsay.fr/fr/oeuvres/langelus-345"},{"label":"L'Angélus - napoleon.org","url":"https://www.napoleon.org/histoire-des-2-empires/iconographie/langelus"}],"tags":["Европа XVII–XIX веков — великие мастера"],"position":"center center","originalImage":"originals/049.jpg","displayFragment":"fragments/049.jpg"},{"author":"Утагава Хиросигэ","title":"Внезапный ливень над мостом Охаси и Атакэ","year":"1857","museum":"Метрополитен-музей, Нью-Йорк","image":"originals/050.jpg","description":"Сильный ливень застает прохожих на мосту, заставляя их торопиться и искать укрытие. Тонкие косые линии дождя пересекают спокойную геометрию настила и растворяют дальний берег. Хиросигэ передаёт перемену погоды несколькими точными средствами, так что зритель почти слышит шум воды и быстрые шаги по мосту. Утагава Хиросигэ создал гравюру в 1857 году. Место хранения: Метрополитен-музей, Нью-Йорк.","sources":[{"label":"Utagawa Hiroshige - Sudden Shower over Shin-Ōhashi…","url":"https://www.metmuseum.org/art/collection/search/55433"},{"label":"Hiroshige “One Hundred Famous Views of Edo” | 太田記念美…","url":"https://www.ukiyoe-ota-muse.jp/hiroshige-one-hundred-famous-views-of-edo/"}],"tags":["Япония"],"position":"center 28%","originalImage":"originals/050.jpg","displayFragment":"fragments/050.jpg"},{"author":"Утагава Хиросигэ","title":"Цветущий сливовый сад в Камэйдо","year":"1857","museum":"Бруклинский музей, Нью-Йорк","image":"originals/051.jpg","description":"Огромный ствол цветущей сливы оказывается так близко, что привычный сад виден словно сквозь его ветви. За тёмной корой раскрываются дорожки, деревья и маленькие фигуры гуляющих. Хиросигэ соединяет резкий передний план с лёгкой далью, делая цветение одновременно близким, осязаемым и частью большого весеннего пространства. Утагава Хиросигэ создал гравюру в 1857 году. Место хранения: Бруклинский музей, Нью-Йорк.","sources":[{"label":"Plum Park in Kameido","url":"https://en.wikipedia.org/wiki/Plum_Park_in_Kameido"},{"label":"Hiroshige “One Hundred Famous Views of Edo” | 太田記念美…","url":"https://www.ukiyoe-ota-muse.jp/hiroshige-one-hundred-famous-views-of-edo/"}],"tags":["Япония"],"position":"center 28%","originalImage":"originals/051.jpg","displayFragment":"fragments/051.jpg"},{"author":"Утагава Хиросигэ","title":"Сосновая роща Михо в провинции Суруга","year":"1858","museum":"Метрополитен-музей, Нью-Йорк","image":"originals/052.jpg","description":"За тёмной полосой сосновой рощи открывается море, а над ним поднимается светлая вершина Фудзи. Берег, вода и дальняя гора складываются в спокойную череду планов. Хиросигэ находит выразительность в широких цветовых поверхностях, благодаря которым небольшой лист передаёт простор целого побережья. Утагава Хиросигэ создал гравюру в 1858 году. Место хранения: Метрополитен-музей, Нью-Йорк.","sources":[{"label":"Utagawa Hiroshige - Pine Groves of Miho in Suruga P…","url":"https://www.metmuseum.org/art/collection/search/56929"},{"label":"Hiroshige large print guide | British Museum","url":"https://www.britishmuseum.org/exhibitions/hiroshige-artist-open-road/hiroshige-large-print-guide"}],"tags":["Япония"],"position":"center 28%","originalImage":"originals/052.jpg","displayFragment":"fragments/052.jpg"},{"author":"Эдуард Мане","title":"Завтрак на траве","year":"1863","museum":"Музей Орсе, Париж","image":"originals/053.jpg","description":"На лесной поляне двое одетых мужчин расположились рядом с обнажённой женщиной, которая спокойно смотрит прямо на зрителя. Их непринуждённость делает необычное соседство ещё заметнее. Мане соединяет композицию, напоминающую старых мастеров, с современными лицами и резким дневным светом, оставляя происходящее открытым для вопросов. Эдуард Мане написал картину в 1863 году. Место хранения: Музей Орсе, Париж.","sources":[{"label":"Le Déjeuner sur l'herbe - Edouard Manet | Musée d'O…","url":"https://www.musee-orsay.fr/fr/oeuvres/le-dejeuner-sur-lherbe-904"},{"label":"Le Déjeuner sur l'herbe — Wikipedia","url":"https://en.wikipedia.org/wiki/Le_D%C3%A9jeuner_sur_l%27herbe"}],"tags":["Импрессионизм и постимпрессионизм"],"position":"center center","originalImage":"originals/053.jpg","displayFragment":"fragments/053.jpg"},{"author":"Константин Флавицкий","title":"Княжна Тараканова","year":"1864","museum":"Государственная Третьяковская галерея, Москва","image":"originals/054.jpg","description":"Вода поднимается в тюремной камере, а молодая женщина прижимается к стене у окна. Свет выделяет её фигуру среди сырого камня и тёмной воды, делая одиночество почти осязаемым. Флавицкий строит сцену на тесноте пространства и невозможности отступить, придавая легенде о княжне Таракановой трагическую убедительность. Константин Флавицкий написал картину в 1864 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Княжна Тараканова","url":"https://my.tretyakov.ru/app/masterpiece/8412"},{"label":"Princess Tarakanova (painting)","url":"https://en.wikipedia.org/wiki/Princess_Tarakanova_%28painting%29"}],"tags":["Русская классика"],"position":"center 28%","originalImage":"originals/054.jpg","displayFragment":"fragments/054.jpg"},{"author":"Василий Перов","title":"Тройка","year":"1866","museum":"Государственная Третьяковская галерея, Москва","image":"originals/055.jpg","description":"Трое детей с трудом тянут тяжёлую бочку по зимней улице. Их напряжённые лица и скованные холодом движения особенно резко выделяются на фоне большого, неприветливого города. Перов направляет внимание на несоразмерность детских сил и взрослого труда, превращая повседневную сцену в рассказ о беззащитности. Василий Перов написал картину в 1866 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Тройка. Ученики-мастеровые везут воду","url":"https://my.tretyakov.ru/app/masterpiece/8400"},{"label":"Тройка, ученики мастеровые везут воду. Эскиз одноим…","url":"https://my.tretyakov.ru/app/masterpiece/8960"}],"tags":["Русская классика"],"position":"center center","originalImage":"originals/055.jpg","displayFragment":"fragments/055.jpg"},{"author":"Илья Репин","title":"Бурлаки на Волге","year":"1870–1873","museum":"Государственный Русский музей, Санкт-Петербург","image":"originals/056.jpg","description":"По песчаному берегу медленно движется группа бурлаков, связанных общей лямкой. У каждого своя походка, выражение лица и способ выдерживать тяжесть. Репин сохраняет различия между людьми, а широкий речной простор за их спинами усиливает ощущение длинного, изнурительного пути. Илья Репин написал картину в 1870–1873 годах. Место хранения: Государственный Русский музей, Санкт-Петербург.","sources":[{"label":"Бурлаки на Волге - Русский музей","url":"https://rusmuseum.ru/collections/painting-of-the-second-half-of-the-xix-century-beginning-of-xxi-century/burlaki-na-volge/"},{"label":"Передвижники. Русский реализм и Илья Репин: 1870–19…","url":"https://rusmuseum.ru/exhibitions/archive/wanderers-russian-realism-ilya-repin-1870-1900/"}],"tags":["Русская классика"],"position":"center center","originalImage":"originals/056.jpg","displayFragment":"fragments/056.jpg"},{"author":"Василий Перов","title":"Охотники на привале","year":"1871","museum":"Государственная Третьяковская галерея, Москва","image":"originals/057.jpg","description":"Трое охотников устроились на привале, но отдых быстро превратился в оживлённый разговор. Рассказчик увлечённо жестикулирует, молодой слушатель верит каждому слову, а третий участник будто сдерживает улыбку. Перов строит сцену на тонком различии реакций, позволяя зрителю почти услышать историю, которой тот не знает. Василий Перов написал картину в 1871 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Василий Перов. «Охотники на привале» - Третьяковска…","url":"https://www.tretyakovgallery.ru/issues/vasiliy-perov-okhotniki-na-privale/"},{"label":"Охотники на привале — Wikipedia","url":"https://ru.wikipedia.org/wiki/%D0%9E%D1%85%D0%BE%D1%82%D0%BD%D0%B8%D0%BA%D0%B8_%D0%BD%D0%B0_%D0%BF%D1%80%D0%B8%D0%B2%D0%B0%D0%BB%D0%B5"}],"tags":["Русская классика"],"position":"center center","originalImage":"originals/057.jpg","displayFragment":"fragments/057.jpg"},{"author":"Николай Ге","title":"Пётр I допрашивает царевича Алексея Петровича в Петергофе","year":"1871","museum":"Государственная Третьяковская галерея, Москва","image":"originals/058.jpg","description":"Царевич Алексей стоит перед сидящим Петром I в комнате, где всё кажется тяжёлым и неподвижным. Между ними остаётся свободное пространство, которое только усиливает отчуждение. Ге передаёт драму через взгляды и позы, соединяя в одной тихой сцене семейный разрыв и государственный конфликт. Николай Ге написал картину в 1871 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Петр I допрашивает царевича Алексея Петровича в Пет…","url":"https://my.tretyakov.ru/app/masterpiece/8455"},{"label":"Peter the Great Interrogating the Tsarevich Alexei…","url":"https://en.wikipedia.org/wiki/Peter_the_Great_Interrogating_the_Tsarevich_Alexei_Petrovich_at_Peterhof"}],"tags":["Русская классика"],"position":"center center","originalImage":"originals/058.jpg","displayFragment":"fragments/058.jpg"},{"author":"Иван Крамской","title":"Христос в пустыне","year":"1872","museum":"Государственная Третьяковская галерея, Москва","image":"originals/059.jpg","description":"Христос сидит среди холодных камней, низко опустив голову и крепко сцепив руки. Пустынный пейзаж не отвлекает от лица и напряжённой позы. Крамской передаёт внутреннюю борьбу почти без внешнего действия, а холодный свет на горизонте делает эту долгую минуту раздумья особенно одинокой. Иван Крамской написал картину в 1872 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Иван Крамской. Христос в пустыне - Третьяковская га…","url":"https://www.tretyakovgallery.ru/otvergnutye-shedevry/kramskoy-christos-pustyne/"},{"label":"Christ in the Desert — Wikipedia","url":"https://en.wikipedia.org/wiki/Christ_in_the_Desert"}],"tags":["Русская классика"],"position":"center center","originalImage":"originals/059.jpg","displayFragment":"fragments/059.jpg"},{"author":"Клод Моне","title":"Впечатление. Восход солнца","year":"1872","museum":"Музей Мармоттан-Моне, Париж","image":"originals/060.jpg","description":"Над гаванью поднимается оранжевое солнце, и его отражение дрожит на холодной воде. Лодки, мачты и дальние сооружения едва проступают сквозь утреннюю дымку. Моне оставляет мазки быстрыми и открытыми, передавая ощущение света, который меняется раньше, чем взгляд успевает различить все подробности. Клод Моне написал картину в 1872 году. Место хранения: Музей Мармоттан-Моне, Париж.","sources":[{"label":"notice — Musée Marmottan Monet","url":"https://www.marmottan.fr/en/notice/4014/"},{"label":"Impression, Sunrise — Wikipedia","url":"https://en.wikipedia.org/wiki/Impression,_Sunrise"}],"tags":["Импрессионизм и постимпрессионизм","Мировые шедевры"],"position":"center center","originalImage":"originals/060.jpg","displayFragment":"fragments/060.jpg"},{"author":"Джеймс Уистлер","title":"Ноктюрн в чёрном и золотом. Падающая ракета","year":"около 1875","museum":"Детройтский институт искусств, Детройт","image":"originals/061.jpg","description":"Золотистые искры фейерверка рассыпаются в тёмном ночном воздухе и отражаются в воде. Очертания сада и людей почти исчезают, уступая место редким вспышкам света. Уистлер связывает эти едва различимые формы мягкими переходами цвета, и картина воспринимается как короткое, ускользающее впечатление от ночного праздника. Джеймс Уистлер написал картину около 1875 года. Место хранения: Детройтский институт искусств, Детройт.","sources":[{"label":"Nocturne in Black and Gold, the Falling Rocket | De…","url":"https://dia.org/collection/falling-rocket/64931"},{"label":"Whistler Paintings :: Management Pages - People Search","url":"https://whistlerpaintings.gla.ac.uk/catalogue/names/display/?mid=y170&nid=RossWM&xml=his"}],"tags":["Импрессионизм и постимпрессионизм"],"position":"center 28%","originalImage":"originals/061.jpg","displayFragment":"fragments/061.jpg"},{"author":"Клод Моне","title":"Женщина с зонтиком","year":"1875","museum":"Национальная галерея искусства, Вашингтон","image":"originals/062.jpg","description":"Камилла Моне стоит на холме с раскрытым зонтиком, пока ветер шевелит её платье и вуаль. Позади появляется маленькая фигура сына, а над ними широко раскрывается облачное небо. Низкая точка зрения и быстрые светлые мазки позволяют почувствовать свежесть воздуха и случайность мгновения, будто прогулка прервалась лишь на секунду. Клод Моне написал картину в 1875 году. Место хранения: Национальная галерея искусства, Вашингтон.","sources":[{"label":"Женщина с зонтиком — Google Arts & Culture","url":"https://artsandculture.google.com/asset/woman-with-a-parasol-madame-monet-and-her-son/EwHxeymQQnprMg"},{"label":"National Gallery of Art","url":"https://www.nga.gov/artworks/61379-woman-parasol-madame-monet-and-her-son"}],"tags":["Импрессионизм и постимпрессионизм"],"position":"center 28%","originalImage":"originals/062.jpg","displayFragment":"fragments/062.jpg"},{"author":"Гюстав Кайботт","title":"Парижская улица в дождливую погоду","year":"1877","museum":"Чикагский институт искусств, Чикаго","image":"originals/063.jpg","description":"Парижане проходят под зонтами по просторной улице, залитой ровным дождливым светом. Мокрая мостовая отражает небо, а строгие линии новых домов уводят взгляд вдаль. Кайботт соединяет точность городской перспективы с обыденностью встречных шагов, передавая одновременно многолюдность и отчуждённость большого города. Гюстав Кайботт написал картину в 1877 году. Место хранения: Чикагский институт искусств, Чикаго.","sources":[{"label":"Paris Street; Rainy Day | The Art Institute of Chicago","url":"https://archive.artic.edu/500ways/artwork/20684?from=14591"},{"label":"Paris Street; Rainy Day - Gustave Caillebotte (Fren…","url":"https://artsandculture.google.com/asset/5wEUCOlEf-EaVQ?hl=fr"}],"tags":["Импрессионизм и постимпрессионизм"],"position":"center center","originalImage":"originals/063.jpg","displayFragment":"fragments/063.jpg"},{"author":"Клод Моне","title":"Вокзал Сен-Лазар","year":"1877","museum":"Национальная галерея, Лондон","image":"originals/064.jpg","description":"Под стеклянной крышей вокзала сгущается пар, сквозь который проступают локомотивы и металлические перекрытия. Тяжёлые машины теряют чёткие очертания в голубоватой дымке. Моне показывает современный вокзал через изменчивый свет и воздух, превращая шумное техническое пространство в мерцающую живописную среду. Клод Моне написал картину в 1877 году. Место хранения: Национальная галерея, Лондон.","sources":[{"label":"Моне и вокзал Сен-Лазар — Национальная галерея","url":"https://www.nationalgallery.org.uk/stories/how-did-new-pigment-technologies-drive-the-impressionist-movement"},{"label":"The Gare St-Lazare — The National Gallery","url":"https://www.nationalgallery.org.uk/paintings/claude-monet-the-gare-st-lazare"}],"tags":["Импрессионизм и постимпрессионизм"],"position":"center center","originalImage":"originals/064.jpg","displayFragment":"fragments/064.jpg"},{"author":"Иван Шишкин","title":"Рожь","year":"1878","museum":"Государственная Третьяковская галерея, Москва","image":"originals/065.jpg","description":"Дорога проходит через золотую рожь к высоким соснам, стоящим посреди поля. Тяжёлые колосья и широкое летнее небо наполняют пейзаж ощущением тепла и зрелости. Шишкин соединяет подробность близких трав с большим открытым пространством, благодаря чему взгляд легко движется от края дороги к далёкому горизонту. Иван Шишкин написал картину в 1878 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Рожь","url":"https://my.tretyakov.ru/app/masterpiece/8401"},{"label":"Рожь — Wikipedia","url":"https://ru.wikipedia.org/wiki/%D0%A0%D0%BE%D0%B6%D1%8C_%28%D0%BA%D0%B0%D1%80%D1%82%D0%B8%D0%BD%D0%B0%29"}],"tags":["Русская классика"],"position":"center center","originalImage":"originals/065.jpg","displayFragment":"fragments/065.jpg"},{"author":"Архип Куинджи","title":"Берёзовая роща","year":"1879","museum":"Государственная Третьяковская галерея, Москва","image":"originals/066.jpg","description":"Куинджи показывает солнечную поляну, окружённую тёмной берёзовой рощей. Белые стволы ярко выделяются на фоне густой зелени, а небольшой ручей уводит взгляд в глубину. Главную роль здесь играет контраст света и тени, благодаря которому пейзаж кажется почти светящимся. Художник написал картину в 1879 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Берёзовая роща — Третьяковская галерея","url":"https://my.tretyakov.ru/app/masterpiece/8418"},{"label":"Культура.РФ","url":"https://www.culture.ru/materials/167232/arkhip-kuindzhi-istoriya-zhizni-v-pyati-kartinakh"}],"tags":["Русская классика","Пейзаж"],"position":"center center","originalImage":"originals/066.jpg","displayFragment":"fragments/066.jpg"},{"author":"Константин Маковский","title":"Русалки","year":"1879","museum":"Государственный Русский музей, Санкт-Петербург","image":"originals/067.jpg","description":"Из сумеречной воды появляются русалки, и их светлые фигуры едва отделяются от ночного пейзажа. Движение тел, блики и тёмная зелень берега соединяются в тревожное мерцание. Маковский придаёт сказочному видению чувственную убедительность, сохраняя ощущение, что с наступлением дня оно исчезнет. Константин Маковский написал картину в 1879 году. Место хранения: Государственный Русский музей, Санкт-Петербург.","sources":[{"label":"Художники Маковские - Русский музей","url":"https://rusmuseum.ru/exhibitions/archive/artists-makowski/"},{"label":"Русалки « Маковский Константин Егорович « Русская ж…","url":"https://vsdn.ru/museum/catalogue/exhibit720.htm"}],"tags":["Фольклор"],"position":"center 28%","originalImage":"originals/067.jpg","displayFragment":"fragments/067.jpg"},{"author":"Архип Куинджи","title":"Лунная ночь на Днепре","year":"1880","museum":"Государственный Русский музей, Санкт-Петербург","image":"originals/068.jpg","description":"Широкий Днепр светится под луной, тогда как берега и небо почти растворяются в тем
