ноте. Немногочисленные светлые участки притягивают взгляд сильнее любых подробностей. Куинджи строит пейзаж на резком различии тёмных и сияющих красок, заставляя неподвижную ночную воду казаться источником света. Архип Куинджи написал картину в 1880 году. Место хранения: Государственный Русский музей, Санкт-Петербург.","sources":[{"label":"Куинджи А. И. Лунная ночь на Днепре - Виртуальный Р…","url":"https://rusmuseumvrm.ru/data/collections/painting/19_20/zh_4191/index.php"},{"label":"Куинджи А.И. Лунная ночь на Днепре. 1880","url":"https://www.rmgallery.rusmuseumvrm.ru/ru/626"}],"tags":["Русская классика"],"position":"center center","originalImage":"originals/068.jpg","displayFragment":"fragments/068.jpg"},{"author":"Илья Репин","title":"Запорожцы пишут письмо турецкому султану","year":"1880–1891","museum":"Государственный Русский музей, Санкт-Петербург","image":"originals/069.jpg","description":"Казаки тесно собрались вокруг писаря, сочиняя ответ турецкому султану. Смех будто переходит от одного лица к другому, меняясь от хитрой усмешки до открытого хохота. Репин связывает множество разных характеров общим движением, и зритель ощущает себя рядом с шумной, увлечённой компанией. Илья Репин написал картину в 1880–1891 годах. Место хранения: Государственный Русский музей, Санкт-Петербург.","sources":[{"label":"Репин И. Е. Запорожцы - Виртуальный Русский музей","url":"https://rusmuseumvrm.ru/data/collections/painting/19_20/zh_4005/"},{"label":"Репин И.Е. Запорожцы. 1880–1891","url":"https://www.rmgallery.rusmuseumvrm.ru/ru/652"}],"tags":["Русская классика"],"position":"center center","originalImage":"originals/069.jpg","displayFragment":"fragments/069.jpg"},{"author":"Пьер-Огюст Ренуар","title":"Завтрак гребцов","year":"1880–1881","museum":"Музей Филлипса, Вашингтон","image":"originals/070.jpg","description":"Друзья Ренуара задержались за обедом на террасе у Сены. Разговоры пересекаются, взгляды встречаются, а солнечный свет проходит сквозь навес и ложится на лица, стекло и белую скатерть. Художник соединяет эти отдельные мгновения свободными мазками, сохраняя ощущение тёплого дня, который никому не хочется заканчивать. Пьер-Огюст Ренуар написал картину в 1880–1881 годах. Место хранения: Музей Филлипса, Вашингтон.","sources":[{"label":"Luncheon of the Boating Party | The Phillips Collec…","url":"https://www.phillipscollection.org/collection/luncheon-boating-party"},{"label":"Renoir and Friends: Luncheon of the Boating Party |…","url":"https://www.phillipscollection.org/event/2017-10-06-renoir-and-friends-luncheon-boating-party"}],"tags":["Импрессионизм и постимпрессионизм"],"position":"center center","originalImage":"originals/070.jpg","displayFragment":"fragments/070.jpg"},{"author":"Василий Суриков","title":"Утро стрелецкой казни","year":"1881","museum":"Государственная Третьяковская галерея, Москва","image":"originals/071.jpg","description":"На Красной площади стрельцы и их близкие ждут начала казни. Свечи в руках, прощальные жесты и обращённые в разные стороны лица делают толпу множеством личных историй. Суриков выбирает минуту перед страшным событием, когда напряжение взглядов и сдерживаемое горе говорят больше, чем само действие. Василий Суриков написал картину в 1881 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Утро стрелецкой казни","url":"https://ru.wikipedia.org/wiki/%D0%A3%D1%82%D1%80%D0%BE_%D1%81%D1%82%D1%80%D0%B5%D0%BB%D0%B5%D1%86%D0%BA%D0%BE%D0%B9_%D0%BA%D0%B0%D0%B7%D0%BD%D0%B8"},{"label":"Василий Суриков: «Всюду красоту любил...» | Журнал…","url":"https://tretyakovgallerymagazine.ru/articles/1-2006-10/vasilii-surikov-vsyudu-krasotu-lyubil"}],"tags":["Русская классика"],"position":"center center","originalImage":"originals/071.jpg","displayFragment":"fragments/071.jpg"},{"author":"Виктор Васнецов","title":"Алёнушка","year":"1881","museum":"Государственная Третьяковская галерея, Москва","image":"originals/072.jpg","description":"Алёнушка сидит у тёмного пруда, обхватив колени и опустив голову. Вода неподвижна, а тесно окружающие её деревья словно удерживают тишину. Васнецов сближает настроение девушки с состоянием природы, и её печаль чувствуется в приглушённых красках, сухих листьях и замкнутом пространстве берега. Виктор Васнецов написал картину в 1881 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Алёнушка","url":"https://my.tretyakov.ru/app/masterpiece/8402?lang=en"},{"label":"Алёнушка","url":"https://my.tretyakov.ru/app/masterpiece/51917"}],"tags":["Русская классика","Фольклор"],"position":"center 28%","originalImage":"originals/072.jpg","displayFragment":"fragments/072.jpg"},{"author":"Виктор Васнецов","title":"Витязь на распутье","year":"1882","museum":"Государственный Русский музей, Санкт-Петербург","image":"originals/073.jpg","description":"Витязь остановился перед камнем с надписью и замер, словно вслушиваясь в открывшийся перед ним выбор. Пустынный пейзаж, разбросанные кости и тяжёлое небо усиливают тревогу. Васнецов задерживает движение всадника, превращая обычную остановку в долгую минуту решения, от которого зависит дальнейший путь. Виктор Васнецов написал картину в 1882 году. Место хранения: Государственный Русский музей, Санкт-Петербург.","sources":[{"label":"Васнецов В. М. Витязь на распутье - Виртуальный Рус…","url":"https://rusmuseumvrm.ru/data/collections/painting/19_20/zh_4214/index.php"},{"label":"Васнецов В.М. Витязь на распутье. 1882. ГРМ | Проек…","url":"https://virtualrm.spb.ru/ru/node/4923"}],"tags":["Русская классика","Фольклор"],"position":"center center","originalImage":"originals/073.jpg","displayFragment":"fragments/073.jpg"},{"author":"Эдуард Мане","title":"Бар в «Фоли-Бержер»","year":"1882","museum":"Галерея Курто, Лондон","image":"originals/074.jpg","description":"Барменша стоит перед шумным, ярко освещённым залом, но её лицо кажется отстранённым от окружающего веселья. В зеркале за спиной множатся огни, гости и предметы на стойке. Мане нарушает привычное совпадение фигуры и отражения, благодаря чему праздничное пространство становится неустойчивым, а одиночество героини ощущается острее. Эдуард Мане написал картину в 1882 году. Место хранения: Галерея Курто, Лондон.","sources":[{"label":"A Bar at the Folies-Bergère - Courtauld","url":"https://courtauld.ac.uk/highlights/a-bar-at-the-folies-bergere/?itid=lk_inline_enhanced-template"},{"label":"A Bar at the Folies-Bergère | Courtauld Gallery Col…","url":"https://gallerycollections.courtauld.ac.uk/object-p-1934-sc-234"}],"tags":["Импрессионизм и постимпрессионизм"],"position":"center center","originalImage":"originals/074.jpg","displayFragment":"fragments/074.jpg"},{"author":"Иван Крамской","title":"Неизвестная","year":"1883","museum":"Государственная Третьяковская галерея, Москва","image":"originals/075.jpg","description":"Женщина в открытой коляске смотрит на зрителя уверенно и немного свысока. Тёмный бархат, мех и перья резко выделяются на холодном фоне зимнего города. Крамской подчёркивает самостоятельность её взгляда, но оставляет личность героини неизвестной, сохраняя за внешней роскошью ощущение недосказанности. Иван Крамской написал картину в 1883 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Лаврус - 10 картин передвижников, которые нужно зна…","url":"https://museum.tretyakov.ru/publications/10-kartin-peredvizhnikov-kotorye-nuzhno-znat/"},{"label":"Неизвестная (картина)","url":"https://ru.wikipedia.org/wiki/%D0%9D%D0%B5%D0%B8%D0%B7%D0%B2%D0%B5%D1%81%D1%82%D0%BD%D0%B0%D1%8F_%28%D0%BA%D0%B0%D1%80%D1%82%D0%B8%D0%BD%D0%B0%29"}],"tags":["Русская классика"],"position":"center center","originalImage":"originals/075.jpg","displayFragment":"fragments/075.jpg"},{"author":"Жорж Сёра","title":"Воскресный день на острове Гранд-Жатт","year":"1884–1886","museum":"Чикагский институт искусств, Чикаго","image":"originals/076.jpg","description":"На берегу Сены отдыхают люди, чьи неподвижные фигуры напоминают участников неторопливого представления. Между ними остаются большие участки травы, света и тени. Сёра собирает изображение из мелких раздельных мазков, и строгая композиция начинает мягко мерцать, стоит немного отойти от картины. Жорж Сёра написал картину в 1884–1886 годах. Место хранения: Чикагский институт искусств, Чикаго.","sources":[{"label":"Seurat and the Making of La Grande Jatte","url":"https://archive.artic.edu/seurat/seurat_themes.html"},{"label":"Smarthistory – Georges Seurat, A Sunday on La Grand…","url":"https://smarthistory.org/georges-seurat-a-sunday-on-la-grande-jatte-1884/?sidebar=europe-1800-1900"}],"tags":["Импрессионизм и постимпрессионизм"],"position":"center center","originalImage":"originals/076.jpg","displayFragment":"fragments/076.jpg"},{"author":"Илья Репин","title":"Не ждали","year":"1884–1888","museum":"Государственная Третьяковская галерея, Москва","image":"originals/077.jpg","description":"Мужчина останавливается на пороге, и привычная жизнь комнаты внезапно меняется. Один узнаёт его сразу, другой ещё всматривается, третьему нужно время, чтобы поверить в возвращение. Репин распределяет драму между лицами и жестами, позволяя увидеть, как одно появление по-разному отзывается в каждом человеке. Илья Репин написал картину в 1884–1888 годах. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Не ждали","url":"https://my.tretyakov.ru/app/masterpiece/8415?lang=en"},{"label":"They Did Not Expect Him — Wikipedia","url":"https://en.wikipedia.org/wiki/They_Did_Not_Expect_Him"}],"tags":["Русская классика"],"position":"center center","originalImage":"originals/077.jpg","displayFragment":"fragments/077.jpg"},{"author":"Валентин Серов","title":"Девочка с персиками","year":"1887","museum":"Государственная Третьяковская галерея, Москва","image":"originals/078.jpg","description":"Вера Мамонтова сидит за столом, словно ненадолго отвлеклась от своих дел. Свет скользит по её лицу, персикам и белой скатерти, наполняя комнату свежестью. Серов соединяет внимательный портрет с ощущением мимолётного движения, поэтому кажется, что девочка вот-вот встанет и выбежит из комнаты. Валентин Серов написал картину в 1887 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Девочка с персиками — Третьяковская галерея","url":"https://my.tretyakov.ru/app/masterpiece/8394"},{"label":"Культура.РФ","url":"https://www.culture.ru/s/tretyakovgallery/"}],"tags":["Русская классика","Портрет"],"position":"center 26%","originalImage":"originals/078.jpg","displayFragment":"fragments/078.jpg"},{"author":"Винсент ван Гог","title":"Спальня в Арле","year":"1888","museum":"Музей Ван Гога, Амстердам","image":"originals/079.jpg","description":"Простая комната в Арле встречает зрителя яркими стенами, деревянной кроватью и несколькими стульями. Предметы немного наклоняются, а линии перспективы не дают пространству окончательно успокоиться. Ван Гог соединяет намеренную простоту обстановки с выразительным цветом, создавая очень личный образ домашнего покоя. Винсент ван Гог написал эту версию картины в 1888 году. Место хранения: Музей Ван Гога, Амстердам.","sources":[{"label":"Collection - Van Gogh Museum","url":"https://www.vangoghmuseum.nl/en/collection?Type=painting"},{"label":"Bedroom in Arles","url":"https://en.wikipedia.org/wiki/Bedroom_in_Arles"}],"tags":["Импрессионизм и постимпрессионизм"],"position":"center center","originalImage":"originals/079.jpg","displayFragment":"fragments/079.jpg"},{"author":"Анри де Тулуз-Лотрек","title":"Туалет","year":"1889","museum":"Музей Орсе, Париж","image":"originals/080.jpg","description":"Женщина сидит спиной к зрителю, занятая собой в короткую минуту утреннего туалета. Свет выделяет плечи и волосы, а вокруг остаются свободные, почти набросочные мазки. Тулуз-Лотрек сохраняет неловкость и естественность позы, позволяя увидеть частное мгновение без парадности и постановки. Анри де Тулуз-Лотрек написал картину в 1889 году. Место хранения: Музей Орсе, Париж.","sources":[{"label":"Rousse (La toilette) - Henri de Toulouse-Lautrec |…","url":"https://www.musee-orsay.fr/fr/oeuvres/rousse-la-toilette-726"},{"label":"La Toilette (Toulouse-Lautrec) — Wikipedia","url":"https://en.wikipedia.org/wiki/La_Toilette_(Toulouse-Lautrec)"}],"tags":["Импрессионизм и постимпрессионизм"],"position":"center 28%","originalImage":"originals/080.jpg","displayFragment":"fragments/080.jpg"},{"author":"Виктор Васнецов","title":"Иван-царевич на Сером волке","year":"1889","museum":"Государственная Третьяковская галерея, Москва","image":"originals/081.jpg","description":"Иван-царевич прижимает к себе Елену Прекрасную, пока Серый волк несёт их через тёмный лес. Тяжёлые стволы будто смыкаются вокруг беглецов, усиливая стремительность движения. Среди мрачной зелени светлая фигура девушки и цветущая ветка становятся особенно заметными, придавая тревожной сцене ощущение надежды. Виктор Васнецов написал картину в 1889 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Иван-царевич на Сером Волке","url":"https://my.tretyakov.ru/app/masterpiece/8404"},{"label":"Иван-царевич на Сером волке — Wikipedia","url":"https://ru.wikipedia.org/wiki/%D0%98%D0%B2%D0%B0%D0%BD-%D1%86%D0%B0%D1%80%D0%B5%D0%B2%D0%B8%D1%87_%D0%BD%D0%B0_%D0%A1%D0%B5%D1%80%D0%BE%D0%BC_%D0%92%D0%BE%D0%BB%D0%BA%D0%B5"}],"tags":["Русская классика","Фольклор"],"position":"center 28%","originalImage":"originals/081.jpg","displayFragment":"fragments/081.jpg"},{"author":"Винсент ван Гог","title":"Автопортрет","year":"1889","museum":"Музей Орсе, Париж","image":"originals/082.jpg","description":"Ван Гог смотрит на зрителя внимательно и настороженно, почти не меняя строгой позы. Короткие извилистые мазки проходят по одежде и голубоватому фону, создавая вокруг лица непрерывное движение. Из-за этого внешняя неподвижность портрета кажется напряжённой, а взгляд художника удерживает внимание дольше любых деталей. Винсент ван Гог написал картину в 1889 году. Место хранения: Музей Орсе, Париж.","sources":[{"label":"Portrait de l'artiste - Vincent van Gogh | Musée d'…","url":"https://www.musee-orsay.fr/fr/oeuvres/portrait-de-lartiste-747"},{"label":"805 (806, 607): To Theo van Gogh. Saint-Rémy-de-Pro…","url":"https://vangoghletters.org/vg/letters/let805/letter.html"}],"tags":["Импрессионизм и постимпрессионизм"],"position":"center 28%","originalImage":"originals/082.jpg","displayFragment":"fragments/082.jpg"},{"author":"Винсент ван Гог","title":"Звёздная ночь","year":"1889","museum":"Музей современного искусства (MoMA), Нью-Йорк","image":"originals/083.jpg","description":"Над тихой деревней разворачивается огромное звёздное небо, наполненное вихрями и сияющими кругами. Тёмный кипарис поднимается к нему, связывая землю с движением воздуха. Ван Гог усиливает цвет и ритм мазков, благодаря чему ночной пейзаж воспринимается как сильное внутреннее переживание. Винсент ван Гог написал картину в 1889 году. Место хранения: Музей современного искусства (MoMA), Нью-Йорк.","sources":[{"label":"Vincent van Gogh. The Starry Night. Saint Rémy, Jun…","url":"https://www.moma.org/frog/collection/works/79802"},{"label":"The Starry Night — Wikipedia","url":"https://en.wikipedia.org/wiki/The_Starry_Night"}],"tags":["Импрессионизм и постимпрессионизм","Мировые шедевры"],"position":"center center","originalImage":"originals/083.jpg","displayFragment":"fragments/083.jpg"},{"author":"Винсент ван Гог","title":"Подсолнухи","year":"январь 1889","museum":"Музей Ван Гога, Амстердам","image":"originals/084.jpg","description":"Подсолнухи стоят в простой вазе, сохраняя разные стадии цветения — от раскрытых лепестков до тяжёлых увядающих головок. Почти всё изображение построено на жёлтых и охристых оттенках, но каждый цветок обладает собственной фактурой. Густые мазки Ван Гога придают букету ощутимую материальность, соединяя солнечную яркость с течением времени. Винсент ван Гог написал эту версию картины в январе 1889 года. Место хранения: Музей Ван Гога, Амстердам.","sources":[{"label":"Conservation Treatment of Van Gogh's Sunflowers - V…","url":"https://www.vangoghmuseum.nl/en/about/knowledge-and-research/restorations/conservation-treatment-sunflowers"},{"label":"File:Zonnebloemen - s0031V1962 - Van Gogh Museum.jp…","url":"https://commons.wikimedia.org/wiki/File%3AZonnebloemen_-_s0031V1962_-_Van_Gogh_Museum.jpg"}],"tags":["Импрессионизм и постимпрессионизм","Мировые шедевры"],"position":"center 28%","originalImage":"originals/084.jpg","displayFragment":"fragments/084.jpg"},{"author":"Иван Шишкин","title":"Утро в сосновом лесу","year":"1889","museum":"Государственная Третьяковская галерея, Москва","image":"originals/085.jpg","description":"В глубине соснового леса медвежата играют на поваленном дереве, пока утренний свет пробивается сквозь стволы. Туман смягчает дальний план, а мох, кора и сломанные ветви делают передний особенно осязаемым. Шишкин написал лесной пейзаж, а Константин Савицкий — медведей, чьё оживлённое движение наполняет лес ощущением пробуждения. Художники создали картину в 1889 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Лаврус - История одной картины «Утро в сосновом лес…","url":"https://museum.tretyakov.ru/publications/istoriya-odnoy-kartiny-utro-v-sosnovom-lesu-/"},{"label":"Утро в сосновом лесу","url":"https://my.tretyakov.ru/app/masterpiece/8390?lang=en"}],"tags":["Русская классика"],"position":"center center","originalImage":"originals/085.jpg","displayFragment":"fragments/085.jpg"},{"author":"Михаил Врубель","title":"Демон сидящий","year":"1890","museum":"Государственная Третьяковская галерея, Москва","image":"originals/086.jpg","description":"Демон сидит среди гор, сжав руки и повернув лицо к далёкому свету заката. Его мощной фигуре словно тесно в границах полотна. Врубель разбивает цвет на крупные мерцающие грани, и эта хрупкая, почти кристаллическая поверхность усиливает противоречие между внешней силой героя и его внутренним одиночеством. Михаил Врубель написал картину в 1890 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Демон (сидящий). Эскиз одноименной картины (1890, ГТГ)","url":"https://my.tretyakov.ru/app/masterpiece/20281"},{"label":"Layout 1","url":"https://www.tretyakovgallerymagazine.com/img/mag/2013/2/01.pdf"}],"tags":["Русская классика","Фольклор"],"position":"center center","originalImage":"originals/086.jpg","displayFragment":"fragments/086.jpg"},{"author":"Иван Шишкин","title":"На севере диком…","year":"1891","museum":"Национальный музей «Киевская картинная галерея», Киев","image":"originals/087.jpg","description":"На высокой скале стоит одинокая сосна, укрытая тяжёлым снегом. Холодный свет выделяет её среди тёмной безлюдной дали. Шишкин превращает мотив стихотворения Лермонтова в сдержанный ночной пейзаж, где расстояние, тишина и неподвижность дерева передают чувство недостижимой близости. Иван Шишкин написал картину в 1891 году. Место хранения: Национальный музей «Киевская картинная галерея», Киев.","sources":[{"label":"На севере диком (картина) — Иван Иванович Шишкин","url":"https://gallerix.ru/album/Shishkin/pic/glrx-499023437"},{"label":"«На севере диком...»","url":"https://my.tretyakov.ru/app/masterpiece/11378"}],"tags":["Русская классика"],"position":"center 28%","originalImage":"originals/087.jpg","displayFragment":"fragments/087.jpg"},{"author":"Клод Моне","title":"Руанский собор вечером","year":"1892–1894","museum":"Государственный музей изобразительных искусств имени А. С. Пушкина (ГМИИ), Москва","image":"originals/088.jpg","description":"Фасад Руанского собора проступает из красноватого вечернего света, теряя привычную тяжесть камня. Ниши, арки и выступы распадаются на мерцающие цветовые пятна. Моне показывает, как освещение меняет знакомое здание, и архитектура становится почти воздушной, будто её можно увидеть только в это короткое время суток. Клод Моне написал картину в 1892–1894 годах. Место хранения: Государственный музей изобразительных искусств имени А. С. Пушкина (ГМИИ), Москва.","sources":[{"label":"Руанский собор вечером — электронный каталог ГМИИ","url":"https://collection.pushkinmuseum.art/entity/OBJECT/78227"},{"label":"Клод Моне — ГМИИ имени А. С. Пушкина","url":"https://gallery.pushkinmuseum.art/artists/m/monet_claude/index.php"}],"tags":["Импрессионизм и постимпрессионизм"],"position":"center 28%","originalImage":"originals/088.jpg","displayFragment":"fragments/088.jpg"},{"author":"Эдвард Мунк","title":"Крик","year":"1893","museum":"Национальный музей, Осло","image":"originals/089.jpg","description":"Фигура на мосту прижимает руки к лицу, пока линии неба, воды и берега изгибаются вокруг неё. Пространство словно подхватывает её тревогу и делает её видимой повсюду. Мунк использует резкие цвета и волнообразные очертания, превращая обычный пейзаж в образ чувства, от которого невозможно отстраниться. Эдвард Мунк создал эту версию картины в 1893 году. Место хранения: Национальный музей, Осло.","sources":[{"label":"The Scream (1893) by Edvard Munch — Nasjonalmuseet,…","url":"https://parisatlas.com/works/the-scream"},{"label":"The Scream - Munchmuseet","url":"https://www.munch.no/en/The-Scream/"}],"tags":["Импрессионизм и постимпрессионизм","Мировые шедевры"],"position":"center 28%","originalImage":"originals/089.jpg","displayFragment":"fragments/089.jpg"},{"author":"Исаак Левитан","title":"Над вечным покоем","year":"1894","museum":"Государственная Третьяковская галерея, Москва","image":"originals/090.jpg","description":"Маленькая церковь и кладбище стоят на высоком берегу перед огромной водой. Над ними тяжело движутся облака, оставляя человеческим постройкам совсем немного места. Левитан сопоставляет хрупкость земной жизни с широким, почти безграничным пространством, и пейзаж наполняется сосредоточенной, глубокой тишиной. Исаак Левитан написал картину в 1894 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Над вечным покоем","url":"https://my.tretyakov.ru/app/masterpiece/9903"},{"label":"Исаак Левитан картины, Левитан Март - О левитановск…","url":"https://www.tretyakovgallerymagazine.ru/articles/isaak-levitan/o-levitanovskom-peizazhe"}],"tags":["Русская классика"],"position":"center center","originalImage":"originals/090.jpg","displayFragment":"fragments/090.jpg"},{"author":"Исаак Левитан","title":"Золотая осень","year":"1895","museum":"Государственная Третьяковская галерея, Москва","image":"originals/091.jpg","description":"Небольшая река поворачивает среди золотых берёз и открытых полей. Листва уже сияет осенним цветом, но в ясном воздухе ещё чувствуется тепло. Левитан соединяет яркие краски с плавным движением берегов, удерживая короткий момент, когда осень выглядит особенно светлой и щедрой. Исаак Левитан написал картину в 1895 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Золотая осень","url":"https://my.tretyakov.ru/app/masterpiece/8416"},{"label":"Исаак Левитан картины, Левитан Март - О левитановск…","url":"https://www.tretyakovgallerymagazine.ru/articles/isaak-levitan/o-levitanovskom-peizazhe"}],"tags":["Русская классика"],"position":"center center","originalImage":"originals/091.jpg","displayFragment":"fragments/091.jpg"},{"author":"Камиль Писсарро","title":"Бульвар Монмартр ночью","year":"1897","museum":"Национальная галерея, Лондон","image":"originals/092.jpg","description":"Ночной бульвар Монмартр мерцает огнями витрин, фонарей и экипажей. При взгляде сверху отдельные прохожие и повозки сливаются в подвижную городскую ткань. Писсарро передаёт этот поток дробными мазками, позволяя почувствовать ритм улицы, которая продолжает жить после наступления темноты. Камиль Писсарро написал картину в 1897 году. Место хранения: Национальная галерея, Лондон.","sources":[{"label":"Camille Pissarro | The Boulevard Montmartre at Nigh…","url":"https://www.nationalgallery.org.uk/paintings/camille-pissarro-the-boulevard-montmartre-at-night/"},{"label":"Boulevard Montmartre, morning, cloudy weather, Cami…","url":"https://www.ngv.vic.gov.au/explore/collection/work/4259/"}],"tags":["Импрессионизм и постимпрессионизм"],"position":"center center","originalImage":"originals/092.jpg","displayFragment":"fragments/092.jpg"},{"author":"Поль Гоген","title":"Откуда мы пришли? Кто мы? Куда мы идём?","year":"1897–1898","museum":"Музей изящных искусств, Бостон","image":"originals/093.jpg","description":"Среди таитянской природы люди разного возраста заняты собственными мыслями и делами. Их фигуры складываются в длинную последовательность, в которой можно увидеть течение человеческой жизни. Гоген связывает их насыщенным цветом и медленным ритмом, превращая пейзаж в пространство вопросов о начале, настоящем и конце существования. Поль Гоген написал картину в 1897–1898 годах. Место хранения: Музей изящных искусств, Бостон.","sources":[{"label":"Where Do We Come From? What Are We? Where Are We Go…","url":"https://collections.mfa.org/objects/32558/where-do-we-come-from-what-are-we-where-are-we-going"},{"label":"Gauguin Tahiti | Museum of Fine Arts Boston","url":"https://www.mfa.org/collections/publications/gauguin-tahiti"}],"tags":["Импрессионизм и постимпрессионизм"],"position":"center center","originalImage":"originals/093.jpg","displayFragment":"fragments/093.jpg"},{"author":"Иван Шишкин","title":"Корабельная роща","year":"1898","museum":"Государственный Русский музей, Санкт-Петербург","image":"originals/094.jpg","description":"Высокие сосны поднимаются над неглубокой лесной речкой, пропуская солнечный свет к воде и корням. За близкими стволами открываются всё новые деревья и светлые просветы. Шишкин тщательно передаёт каждую подробность, но сохраняет ощущение большого лесного пространства, в котором хочется задержаться и всмотреться. Иван Шишкин написал картину в 1898 году. Место хранения: Государственный Русский музей, Санкт-Петербург.","sources":[{"label":"Шишкин И. И. Корабельная роща - Виртуальный Русский…","url":"https://rusmuseumvrm.ru/data/collections/painting/19_20/zh-4125/index.php"},{"label":"Иван Шишкин. Из собраний Русского музея и Третьяков…","url":"https://rusmuseum.ru/exhibitions/archive/ivan-shishkin-from-the-collections-of-the-russian-museum-and-the-tretyakov-gallery/"}],"tags":["Русская классика"],"position":"center 28%","originalImage":"originals/094.jpg","displayFragment":"fragments/094.jpg"},{"author":"Эдгар Дега","title":"Голубые танцовщицы","year":"около 1898","museum":"Государственный музей изобразительных искусств имени А. С. Пушкина (ГМИИ), Москва","image":"originals/095.jpg","description":"Балерины в голубых костюмах собрались в тесный круг, поправляя платья и готовясь к движению. Дега смотрит сверху и смело обрезает фигуры краями изображения. Повороты рук и плеч соединяются с мерцанием пастели, превращая рабочий момент в сложный, почти цветочный узор. Эдгар Дега создал эту пастель около 1898 года. Место хранения: Государственный музей изобразительных искусств имени А. С. Пушкина (ГМИИ), Москва.","sources":[{"label":"Дега Э. Картина. Голубые танцовщицы. Около 1898","url":"https://collection.pushkinmuseum.art/entity/OBJECT/78123?attribute=objects&entityId=473&entityType=PERSON&index=0&paginator=entity-set"},{"label":"Галерея искусcтва стран Европы и Америки XIX-XX век…","url":"https://gallery.pushkinmuseum.art/artists/d/degas_e/index.php?lang=en"}],"tags":["Импрессионизм и постимпрессионизм"],"position":"center center","originalImage":"originals/095.jpg","displayFragment":"fragments/095.jpg"},{"author":"Михаил Врубель","title":"Царевна-Лебедь","year":"1900","museum":"Государственная Третьяковская галерея, Москва","image":"originals/096.jpg","description":"Царевна-Лебедь оборачивается на фоне сумеречного моря, словно задержавшись между человеческим обликом и сказочным превращением. Белое оперение мерцает холодными оттенками, а большие глаза смотрят настороженно. Врубель соединяет тонкость лица с дробной, сияющей живописью перьев, сохраняя ощущение видения, которое может исчезнуть. Михаил Врубель написал картину в 1900 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Царевна-Лебедь","url":"https://my.tretyakov.ru/app/masterpiece/8395"},{"label":"«ЦАРЕВНА-ЛЕБЕДЬ» МИХАИЛА ВРУБЕЛЯ: «Разгадай загадку…","url":"https://www.tretyakovgallerymagazine.ru/articles/3-2021-72/tsarevna-lebed-mikhaila-vrubelya-razgadai-zagadku-tsar?ysclid=ld4pshp0l436052608"}],"tags":["Россия XX века","Русская классика"],"position":"center 28%","originalImage":"originals/096.jpg","displayFragment":"fragments/096.jpg"},{"author":"Пьер-Огюст Ренуар","title":"Мадонна с младенцем (по фаянсу)","year":"около 1902","museum":"Частное собрание","image":"originals/097.jpg","description":"Небольшая фаянсовая фигура Мадонны с младенцем выступает из тёмного фона. Мягкий свет скользит по поверхности, выделяя округлые формы и лёгкий блеск глазури. Ренуар сосредоточивается на красоте самой вещи, и религиозный образ получает камерное, почти домашнее звучание. Пьер-Огюст Ренуар написал картину около 1902 года. Место хранения: Частное собрание.","sources":[{"label":"PIERRE-AUGUSTE RENOIR (1841-1919), Vierge et enfant…","url":"https://www.christies.com.cn/en/lot/lot-6481494"},{"label":"Pierre-Auguste Renoir | Vierge à l'enfant d'après u…","url":"https://www.sothebys.com/buy/f4616495-7a5d-479c-b6ed-44e12dc49742/lots/d1269022-de29-4647-a983-3da452079e3f"}],"tags":["Импрессионизм и постимпрессионизм"],"position":"center 28%","originalImage":"originals/097.jpg","displayFragment":"fragments/097.jpg"},{"author":"Клод Моне","title":"Здание парламента (эффект тумана)","year":"1903–1904","museum":"Метрополитен-музей, Нью-Йорк","image":"originals/098.jpg","description":"Здание парламента возникает над Темзой как тяжёлый силуэт, окружённый туманом. Небо и вода сближаются по цвету, поэтому архитектура словно лишается прочной опоры. Моне собирает впечатление из множества близких оттенков, делая изменчивый лондонский воздух главным содержанием пейзажа. Клод Моне написал картину в 1903–1904 годах. Место хранения: Метрополитен-музей, Нью-Йорк.","sources":[{"label":"Моне и лондонские серии — Музей Оранжери","url":"https://www.musee-orangerie.fr/en/whats-on/exhibitions/presentation/monet-painting-time"},{"label":"The Houses of Parliament (Effect of Fog) — The Met","url":"https://www.metmuseum.org/art/collection/search/437128"}],"tags":["Импрессионизм и постимпрессионизм"],"position":"center center","originalImage":"originals/098.jpg","displayFragment":"fragments/098.jpg"},{"author":"Клод Моне","title":"Мост Ватерлоо. Эффект солнечного света","year":"1903","museum":"Денверский художественный музей, Денвер","image":"originals/099.jpg","description":"Мост Ватерлоо проступает сквозь солнечную дымку, а лодки едва различимы на мерцающей Темзе. Туман смягчает контуры и связывает воду, небо и мост одной цветовой средой. Моне передаёт неустойчивость света, из-за которой знакомая городская постройка кажется на мгновение почти невесомой. Клод Моне написал картину в 1903 году. Место хранения: Денверский художественный музей, Денвер.","sources":[{"label":"Waterloo Bridge, Sunlight Effect — The Courtauld","url":"https://virtualtour.courtauld.ac.uk/gal-hotspot/waterloo-bridge-sunlight-effect-2/"},{"label":"Denver Art Museum exhibition schedule","url":"https://d26jxt5097u8sr.cloudfront.net/2024-03/DAM%20Exhibition%20Schedule_March%2027%202024_updated.pdf"}],"tags":["Импрессионизм и постимпрессионизм"],"position":"center center","originalImage":"originals/099.jpg","displayFragment":"fragments/099.jpg"},{"author":"Пабло Пикассо","title":"Старый гитарист","year":"1903–1904","museum":"Чикагский институт искусств, Чикаго","image":"originals/100.jpg","description":"Старый слепой музыкант склонился над гитарой, замыкаясь в тесном пространстве собственной позы. Холодные синие оттенки подчёркивают худобу тела и сдержанность движения. Тёплый коричневый цвет инструмента выделяется особенно сильно, связывая образ одиночества с тем, что ещё удерживает человека в мире звука. Пабло Пикассо написал картину в 1903–1904 годах. Место хранения: Чикагский институт искусств, Чикаго.","sources":[{"label":"The Old Guitarist — The Art Institute of Chicago","url":"https://www.artic.edu/artworks/28067/the-old-guitarist"},{"label":"The Old Guitarist","url":"https://en.wikipedia.org/wiki/The_Old_Guitarist"}],"tags":["Европейский модернизм XX века"],"position":"center 28%","originalImage":"originals/100.jpg","displayFragment":"fragments/100.jpg"},{"author":"Анри Матисс","title":"Женщина в шляпе","year":"1905","museum":"Музей современного искусства Сан-Франциско (SFMOMA), Сан-Франциско","image":"originals/101.jpg","description":"Женщина в большой шляпе поворачивается к зрителю, окружённая смелыми зелёными, розовыми и синими пятнами. Неожиданные краски появляются даже на лице, не мешая узнать его выражение. Матисс освобождает цвет от буквального сходства с натурой и с его помощью придаёт сдержанному портрету яркую, самостоятельную жизнь. Анри Матисс написал картину в 1905 году. Место хранения: Музей современного искусства Сан-Франциско (SFMOMA), Сан-Франциско.","sources":[{"label":"Henri Matisse, Femme au chapeau (Woman with a Hat),…","url":"https://www.sfmoma.org/artwork/91.161/"},{"label":"Matisse's Femme au chapeau: From Scandal to Icon ·…","url":"https://www.sfmoma.org/read/matisses-femme-au-chapeau-from-scandal-to-icon/"}],"tags":["Европейский модернизм XX века"],"position":"center 28%","originalImage":"originals/101.jpg","displayFragment":"fragments/101.jpg"},{"author":"Пабло Пикассо","title":"Девочка на шаре","year":"1905","museum":"Государственный музей изобразительных искусств имени А. С. Пушкина (ГМИИ), Москва","image":"originals/102.jpg","description":"Девочка-акробатка удерживает равновесие на шаре рядом с тяжёлой фигурой сидящего силача. Её тонкий силуэт и лёгкий изгиб рук особенно заметны на фоне его устойчивой позы. Пикассо связывает хрупкость и силу мягкими розовыми и голубыми оттенками, создавая тихую сцену взаимного равновесия. Пабло Пикассо написал картину в 1905 году. Место хранения: Государственный музей изобразительных искусств имени А. С. Пушкина (ГМИИ), Москва.","sources":[{"label":"Girl on a ball. Picasso Pablo","url":"https://collection.pushkinmuseum.art/en/entity/OBJECT/77609"},{"label":"Journey of Girl on the Ball","url":"https://www.conservation.pushkinmuseum.art/news/archive/2018/devochka_na_share/index.php?lang=en"}],"tags":["Европейский модернизм XX века","Мировые шедевры"],"position":"center 28%","originalImage":"originals/102.jpg","displayFragment":"fragments/102.jpg"},{"author":"Клод Моне","title":"Кувшинки","year":"1906","museum":"Чикагский институт искусств, Чикаго","image":"originals/103.jpg","description":"Кувшинки раскрываются на поверхности пруда среди отражений деревьев и неба. Горизонт исчезает, и взгляд свободно движется по воде, то замечая глубину, то возвращаясь к плоским листьям. Моне соединяет цветы и отражения мягкими мазками, превращая небольшой участок сада в пространство спокойного, непрерывного созерцания. Клод Моне написал картину в 1906 году. Место хранения: Чикагский институт искусств, Чикаго.","sources":[{"label":"Cat. 44. Water Lilies, 1906 | Monet | Online Schola…","url":"https://publications.artic.edu/node/135621"},{"label":"Cat. 43. Water Lilies, 1906 | Monet | Online Schola…","url":"https://publications.artic.edu/node/134363"}],"tags":["Импрессионизм и постимпрессионизм","Мировые шедевры"],"position":"center center","originalImage":"originals/103.jpg","displayFragment":"fragments/103.jpg"},{"author":"Анри Руссо","title":"Заклинательница змей","year":"1907","museum":"Музей Орсе, Париж","image":"originals/104.jpg","description":"Тёмная фигура заклинательницы играет на флейте среди густых растений и неподвижных животных. Лунный свет выделяет листья, но не рассеивает ощущение тайны. Руссо выстраивает джунгли из чётких силуэтов и повторяющихся форм, словно перед зрителем медленно раскрывается необычный сон. Анри Руссо написал картину в 1907 году. Место хранения: Музей Орсе, Париж.","sources":[{"label":"La Charmeuse de serpents - Henri Rousseau | Musée d…","url":"https://www.musee-orsay.fr/en/artworks/la-charmeuse-de-serpents-9090"},{"label":"The Douanier Rousseau. Archaic Candour. | Musée d'O…","url":"https://www.musee-orsay.fr/en/program/whats-on/exhibitions/presentation/douanier-rousseau-archaic-candour"}],"tags":["Европейский модернизм XX века"],"position":"center center","originalImage":"originals/104.jpg","displayFragment":"fragments/104.jpg"},{"author":"Густав Климт","title":"Портрет Адели Блох-Бауэр I","year":"1907","museum":"Новая галерея, Нью-Йорк","image":"originals/105.jpg","description":"Адель Блох-Бауэр появляется из золотого узора, в котором почти исчезают платье, кресло и пространство комнаты. Только лицо и сложенные руки сохраняют мягкую телесность. Климт окружает их мерцанием декоративных знаков, придавая светскому портрету торжественность драгоценного, неподвижного образа. Густав Климт написал картину в 1907 году. Место хранения: Новая галерея, Нью-Йорк.","sources":[{"label":"Portrait of Adele Bloch Bauer I (1907)","url":"https://www.neuegalerie.org/womaningold"},{"label":"Gustav Klimt and Adele Bloch-Bauer: The Woman in Gold","url":"https://www.neuegalerie.org/exhibitions/klimt-and-adele-bloch-bauer"}],"tags":["Европейский модернизм XX века"],"position":"center center","originalImage":"originals/105.jpg","displayFragment":"fragments/105.jpg"},{"author":"Густав Климт","title":"Поцелуй","year":"1908–1909","museum":"Бельведер, Вена","image":"originals/106.jpg","description":"Мужчина склоняется к женщине, и их фигуры соединяются в общий золотой силуэт. Лица и руки остаются открытыми среди плотного орнамента, делая прикосновение особенно заметным. Климт противопоставляет угловатые и округлые узоры, а цветущий луг у ног придаёт этой неподвижной близости ощущение хрупкого равновесия. Густав Климт написал картину в 1908–1909 годах. Место хранения: Бельведер, Вена.","sources":[{"label":"«Поцелуй» в собрании Бельведера","url":"https://www.belvedere.at/en/institution"},{"label":"Бельведер","url":"https://sammlung.belvedere.at/objects/6678/der-kuss-liebespaar"}],"tags":["Мировые шедевры","Венский модерн"],"position":"center 32%","originalImage":"originals/106.jpg","displayFragment":"fragments/106.jpg"},{"author":"Пабло Пикассо","title":"Авиньонские девицы","year":"1907","museum":"Музей современного искусства (MoMA), Нью-Йорк","image":"originals/107.jpg","description":"Пять женщин обращены к зрителю из тесного пространства, словно собранного из острых осколков. Их лица и тела показаны с разных сторон, а занавеси почти не отделяются от фигур. Пикассо делает сам способ изображения напряжённым и непривычным, заставляя взгляд заново искать знакомые очертания. Пабло Пикассо написал картину в 1907 году. Место хранения: Музей современного искусства (MoMA), Нью-Йорк.","sources":[{"label":"Pablo Picasso. Les Demoiselles d'Avignon. Paris, Ju…","url":"https://www.moma.org/collection/works/79766"},{"label":"Les Demoiselles d'Avignon — Wikipedia","url":"https://en.wikipedia.org/wiki/Les_Demoiselles_d%27Avignon"}],"tags":["Европейский модернизм XX века","Мировые шедевры"],"position":"center center","originalImage":"originals/107.jpg","displayFragment":"fragments/107.jpg"},{"author":"Анри Матисс","title":"Красная комната (Гармония в красном)","year":"1908","museum":"Государственный Эрмитаж, Санкт-Петербург","image":"originals/108.jpg","description":"Красный цвет заполняет комнату, связывая стену и скатерть в одну широкую поверхность. Синий растительный узор проходит по ним почти непрерывно, а окно открывает светлый сад. Матисс ослабляет привычную глубину интерьера, благодаря чему предметы, женщина и деревья складываются в ясный, насыщенный цветом ритм. Анри Матисс написал картину в 1908 году. Место хранения: Государственный Эрмитаж, Санкт-Петербург.","sources":[{"label":"Красная комната","url":"https://www.hermitagemuseum.org/digital-collection/28389"},{"label":"The Dessert: Harmony in Red (The Red Room) — Wikipedia","url":"https://en.wikipedia.org/wiki/The_Dessert:_Harmony_in_Red_(The_Red_Room)"}],"tags":["Европейский модернизм XX века"],"position":"center center","originalImage":"originals/108.jpg","displayFragment":"fragments/108.jpg"},{"author":"Василий Кандинский","title":"Осень в Мурнау","year":"1908","museum":"Фонд Франческо Федерико Черрути, Риволи","image":"originals/109.jpg","description":"Осенняя дорога в Мурнау проходит между деревьями, написанными крупными яркими пятнами. Цвет кажется сильнее привычных очертаний, и пейзаж словно движется навстречу зрителю. Кандинский упрощает формы и сближает контрастные краски, передавая живость впечатления от улицы и осеннего света. Василий Кандинский написал картину в 1908 году. Место хранения: Фонд Франческо Федерико Черрути, Риволи.","sources":[{"label":"Fondazione Cerruti | Autumn near Murnau","url":"https://fondazionecerruti.org/en/artworks/autunno-vicino-murnau"},{"label":"Autumn in Murnau, 1908 - Wassily Kandinsky - WikiAr…","url":"https://www.wikiart.org/en/wassily-kandinsky/autumn-in-murnau-1908"}],"tags":["Европейский модернизм XX века","Россия XX века"],"position":"center center","originalImage":"originals/109.jpg","displayFragment":"fragments/109.jpg"},{"author":"Клод Моне","title":"Церковь Сан-Джорджо-Маджоре в Венеции","year":"1908","museum":"Художественный музей Индианаполиса, Индианаполис","image":"originals/110.jpg","description":"Церковь Сан-Джорджо-Маджоре возникает за водой в мягком, рассеянном свете. Её силуэт повторяется в отражениях, где каменная архитектура становится ещё более зыбкой. Моне сближает цвета здания, неба и лагуны, передавая особенную венецианскую атмосферу, в которой воздух кажется наполненным влагой и сиянием. Клод Моне написал картину в 1908 году. Место хранения: Художественный музей Индианаполиса, Индианаполис.","sources":[{"label":"The Church of San Giorgio Maggiore, Venice","url":"https://collections.discovernewfields.org/art/artwork/56280"},{"label":"The Church of San Giorgio Maggiore, Venice - Monet,…","url":"https://artsandculture.google.com/asset/the-church-of-san-giorgio-maggiore-venice/QgHQ8UuEvA4xxQ?hl=en"}],"tags":["Импрессионизм и постимпрессионизм"],"position":"center center","originalImage":"originals/110.jpg","displayFragment":"fragments/110.jpg"},{"author":"Александра Экстер","title":"Три женские фигуры","year":"1909–1910","museum":"Национальный художественный музей Украины, Киев","image":"originals/111.jpg","description":"Три женские фигуры сближаются в тесной композиции, где лица и одежда разделены резкими цветными плоскостями. Пространство вокруг них почти теряет глубину. Экстер сохраняет узнаваемость человеческих поз, но связывает их прежде всего ритмом линий и красок, придавая неподвижной группе внутреннюю энергию. Александра Экстер написала картину в 1909–1910 годах. Место хранения: Национальный художественный музей Украины, Киев.","sources":[{"label":"Three female figures - Aleksandra Ekster — Google A…","url":"https://artsandculture.google.com/asset/three-female-figures-aleksandra-ekster/gQH6fpELey_K4A"},{"label":"Three Women Figures - Oleksandra Ekster — Google Ar…","url":"https://artsandculture.google.com/asset/three-women-figures-oleksandra-ekster/gQGIJmvxCE9Rgg?hl=en"}],"tags":["Россия XX века"],"position":"center 28%","originalImage":"originals/111.jpg","displayFragment":"fragments/111.jpg"},{"author":"Зинаида Серебрякова","title":"За туалетом. Автопортрет","year":"1909","museum":"Государственная Третьяковская галерея, Москва","image":"originals/112.jpg","description":"Серебрякова смотрит в зеркало и поднимает руки к волосам, встречая собственное отражение лёгкой улыбкой. Свет ложится на лицо, плечи и маленькие предметы туалетного столика. Непринуждённый жест делает автопортрет похожим на счастливое утреннее мгновение, в котором художница одновременно наблюдает за собой и радуется увиденному. Зинаида Серебрякова написала картину в 1909 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Павел Сергеевич Павлинов: «Зинаида Серебрякова. Мир…","url":"https://rusmuseum.ru/upload/medialibrary/a35/zinaida-serebryakova-mir-ee-iskusstva_compressed.pdf"},{"label":"З.Е. Серебрякова. «Прекрасная ясность» в живописи -…","url":"https://www.tretyakovgallery.ru/events/o/z-e-serebryakova-prekrasnaya-yasnost-v-zhivopisi/"}],"tags":["Россия XX века"],"position":"center 28%","originalImage":"originals/112.jpg","displayFragment":"fragments/112.jpg"},{"author":"Анри Матисс","title":"Танец","year":"1910","museum":"Государственный Эрмитаж, Санкт-Петербург","image":"originals/113.jpg","description":"Пять фигур держатся за руки и движутся по кругу между зелёной землёй и синим небом. Наклоны тел и вытянутые руки передают ритм, который словно продолжается за пределами отдельного жеста. Матисс оставляет лишь несколько насыщенных цветов и самые необходимые очертания, добиваясь почти физического ощущения танца. Анри Матисс завершил это панно в 1910 году. Место хранения: Государственный Эрмитаж, Санкт-Петербург.","sources":[{"label":"Henri Matisse — Dance, 1910 · Shchukin Collection A…","url":"https://shchukin.org/collection/henri-matisse-dance-1910/"},{"label":"Dance (Matisse)","url":"https://en.wikipedia.org/wiki/Dance_%28Matisse%29"}],"tags":["Европейский модернизм XX века","Мировые шедевры"],"position":"center center","originalImage":"originals/113.jpg","displayFragment":"fragments/113.jpg"},{"author":"Анри Руссо","title":"Сон","year":"1910","museum":"Музей современного искусства (MoMA), Нью-Йорк","image":"originals/114.jpg","description":"Обнажённая женщина лежит на диване среди огромных листьев, цветов и настороженных животных. Домашняя мебель оказывается в джунглях так естественно, как это бывает только во сне. Руссо соединяет чётко выписанные растения с неподвижными фигурами, создавая мир, в котором всё узнаваемо и одновременно невозможно. Анри Руссо написал картину в 1910 году. Место хранения: Музей современного искусства (MoMA), Нью-Йорк.","sources":[{"label":"Henri Rousseau. The Dream. 1910 | MoMA","url":"https://www.moma.org/collection/works/79277"},{"label":"The Dream (Rousseau) — Wikipedia","url":"https://en.wikipedia.org/wiki/The_Dream_(Rousseau)"}],"tags":["Европейский модернизм XX века"],"position":"center center","originalImage":"originals/114.jpg","displayFragment":"fragments/114.jpg"},{"author":"Валентин Серов","title":"Портрет Иды Рубинштейн","year":"1910","museum":"Государственный Русский музей, Санкт-Петербург","image":"originals/115.jpg","description":"Ида Рубинштейн сидит в вытянутой, почти сценической позе на светлом пустом фоне. Тонкая линия соединяет плечи, руки и ноги, подчёркивая необычность её силуэта. Серов делает выразительность тела главным содержанием портрета, позволяя почувствовать пластическую силу модели без изображения самого танца. Валентин Серов написал картину в 1910 году. Место хранения: Государственный Русский музей, Санкт-Петербург.","sources":[{"label":"Серов В. А. Портрет Иды Рубинштейн - Виртуальный Ру…","url":"https://rusmuseumvrm.ru/data/collections/painting/19_20/zh_1915/index.php?lang=ru"},{"label":"Творчество Серова в зеркале коллекции Государственн…","url":"https://virtualrm.spb.ru/ru/resources/galleries/serov_grm"}],"tags":["Россия XX века"],"position":"center center","originalImage":"originals/115.jpg","displayFragment":"fragments/115.jpg"},{"author":"Василий Кандинский","title":"Без названия (первая абстрактная акварель)","year":"1913","museum":"Центр Помпиду, Париж","image":"originals/116.jpg","description":"Цветные пятна, лёгкие линии и свободные мазки рассеяны по бумаге, словно ещё ищут связь друг с другом. Взгляд то объединяет их в группы, то снова отпускает в свободное движение. Кандинский строит изображение на взаимодействии цвета и линии, позволяя воспринимать их ритм без опоры на узнаваемый сюжет. Музей датирует акварель 1913 годом, хотя на самом листе стоит дата 1910. Место хранения: Центр Помпиду, Париж.","sources":[{"label":"Кандинский и датировка акварели — Центр Помпиду","url":"https://www.centrepompidou.fr/fr/offre-aux-professionnels/enseignants/dossiers-ressources-sur-lart/naissance-de-lart-abstrait/vassily-kandinsky"},{"label":"Sans titre (Première abstraction, aquarelle) — Centre Pompidou","url":"https://www.centrepompidou.fr/fr/ressources/oeuvre/cMejBMj"}],"tags":["Абстракция","Европейский модернизм XX века"],"position":"center center","originalImage":"originals/116.jpg","displayFragment":"fragments/116.jpg"},{"author":"Илья Машков","title":"Фрукты на блюде","year":"1910","museum":"Государственная Третьяковская галерея, Москва","image":"originals/117.jpg","description":"Крупные плоды тесно лежат на блюде, почти заполняя всё пространство картины. Тяжёлые контуры и насыщенные краски подчёркивают их округлость и плотность. Машков усиливает привычные свойства фруктов так, что простой натюрморт начинает восприниматься как щедрый, ощутимый праздник цвета и формы. Илья Машков написал картину в 1910 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Натюрморт. Фрукты на блюде | Каталог иллюстраций жу…","url":"https://tg-m.ru/catalog/picture/8090"},{"label":"File:Машков И. И., Фрукты на блюде (синие сливы). 1…","url":"https://commons.wikimedia.org/wiki/File%3A%D0%9C%D0%B0%D1%88%D0%BA%D0%BE%D0%B2_%D0%98._%D0%98.%2C_%D0%A4%D1%80%D1%83%D0%BA%D1%82%D1%8B_%D0%BD%D0%B0_%D0%B1%D0%BB%D1%8E%D0%B4%D0%B5_%28%D1%81%D0%B8%D0%BD%D0%B8%D0%B5_%D1%81%D0%BB%D0%B8%D0%B2%D1%8B%29._1910%D0%B3.jpg"}],"tags":["Россия XX века"],"position":"center center","originalImage":"originals/117.jpg","displayFragment":"fragments/117.jpg"},{"author":"Хисида Сюнсо","title":"Чёрный кот","year":"1910","museum":"Музей Эйсэй-Бунко, Токио","image":"originals/118.jpg","description":"Чёрный кот неподвижно сидит под ветвью с осенними листьями. Его плотный тёмный силуэт резко выделяется среди тонких линий и большого свободного поля бумаги. Хисида Сюнсо оставляет вокруг животного достаточно тишины и воздуха, чтобы даже небольшой поворот головы стал выразительным событием. Хисида Сюнсо написал картину в 1910 году. Место хранения: Музей Эйсэй-Бунко, Токио.","sources":[{"label":"EISEI BUNKO MUSEUM","url":"https://eiseibunko.com/english/past_exhibitions2025.html"},{"label":"Black Cat by Hishida Shunso (Kokka No. 1558 <Specia…","url":"https://note.com/kokkasha/n/n69e810dd5287?hl=en"}],"tags":["Япония"],"position":"center 28%","originalImage":"originals/118.jpg","displayFragment":"fragments/118.jpg"},{"author":"Владимир Татлин","title":"Матрос (Автопортрет)","year":"1911","museum":"Государственный Русский музей, Санкт-Петербург","image":"originals/119.jpg","description":"Татлин изображает себя в матросской форме, придавая лицу строгую, почти угловатую ясность. Тёмные и светлые плоскости заменяют мягкую лепку объёма. Сдержанная поза и резкий рисунок делают портрет собранным и уверенным, а морская одежда помогает увидеть художника через выбранный им образ. Владимир Татлин написал картину в 1911 году. Место хранения: Государственный Русский музей, Санкт-Петербург.","sources":[{"label":"Татлин В. Е. Матрос - Виртуальный Русский музей","url":"https://rusmuseumvrm.ru/data/collections/painting/19_20/zhb-1514/index.php"},{"label":"Матрос (автопортрет Татлина)","url":"https://ru.wikipedia.org/wiki/%D0%9C%D0%B0%D1%82%D1%80%D0%BE%D1%81_%28%D0%B0%D0%B2%D1%82%D0%BE%D0%BF%D0%BE%D1%80%D1%82%D1%80%D0%B5%D1%82_%D0%A2%D0%B0%D1%82%D0%BB%D0%B8%D0%BD%D0%B0%29"}],"tags":["Россия XX века"],"position":"center center","originalImage":"originals/119.jpg","displayFragment":"fragments/119.jpg"},{"author":"Марк Шагал","title":"Я и деревня","year":"1911","museum":"Музей современного искусства (MoMA), Нью-Йорк","image":"originals/120.jpg","description":"Большие лица человека и животного обращены друг к другу, а между ними возникают дома, деревья и маленькие жители деревни. Масштаб и направление фигур меняются так свободно, словно это воспоминания, возникающие одновременно. Шагал связывает их цветом и пересекающимися линиями, превращая знакомый мир в личную, сновидческую картину. Марк Шагал написал картину в 1911 году. Место хранения: Музей современного искусства (MoMA), Нью-Йорк.","sources":[{"label":"Marc Chagall. I and the Village. 1911 | MoMA","url":"https://www.moma.org/collection/works/78984?package_id=PS&page=1&sov_referrer=package"},{"label":"I and the Village — Wikipedia","url":"https://en.wikipedia.org/wiki/I_and_the_Village"}],"tags":["Россия XX века"],"position":"center 28%","originalImage":"originals/120.jpg","displayFragment":"fragments/120.jpg"},{"author":"Наталия Гончарова","title":"Павлин под ярким солнцем","year":"1911","museum":"Государственная Третьяковская галерея, Москва","image":"originals/121.jpg","description":"Павлин раскрывает хвост, и его оперение превращается в сияющий веер цветных глазков. Тело птицы почти теряется среди расходящихся линий и пятен. Гончарова усиливает декоративный ритм природной формы, благодаря чему яркое солнце ощущается во всём изображении, даже без подробного пейзажа. Наталия Гончарова написала картину в 1911 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Павлин под ярким солнцем (стиль египетский)","url":"https://my.tretyakov.ru/app/masterpiece/8474"},{"label":"Лаврус - Музейный маршрут 7&nbsp;шедевров авангарда…","url":"https://lavrus.tretyakov.ru/publications/muzeynyy-marshrut/"}],"tags":["Россия XX века"],"position":"center center","originalImage":"originals/121.jpg","displayFragment":"fragments/121.jpg"},{"author":"Робер Делоне","title":"Красная Эйфелева башня","year":"1911–1912","museum":"Музей Соломона Гуггенхайма, Нью-Йорк","image":"originals/122.jpg","description":"Красная Эйфелева башня поднимается среди ломаных домов и пересекающихся городских плоскостей. Кажется, что взгляд охватывает её сразу с нескольких точек и не может остановиться. Делоне передаёт энергию большого города через наклонные линии и резкие цветовые столкновения, заставляя знакомую конструкцию почти двигаться. Робер Делоне написал картину в 1911–1912 годах. Место хранения: Музей Соломона Гуггенхайма, Нью-Йорк.","sources":[{"label":"Robert Delaunay | Red Eiffel Tower | The Guggenheim…","url":"https://www.guggenheim.org/artwork/1020"},{"label":"Description of Red Eiffel Tower (La Tour rouge), 19…","url":"https://www.guggenheim.org/audio/track/description-of-red-eiffel-tower-la-tour-rouge-1911-12"}],"tags":["Абстракция","Европейский модернизм XX века"],"position":"center 28%","originalImage":"originals/122.jpg","displayFragment":"fragments/122.jpg"},{"author":"Франц Марк","title":"Синий конь I","year":"1911","museum":"Ленбаххаус, Мюнхен","image":"originals/123.jpg","description":"Синий конь склоняет голову на фоне округлых холмов и яркой зелени. Его необычный цвет делает фигуру спокойной и немного отрешённой от привычного мира. Франц Марк связывает изгибы тела с ритмом пейзажа, создавая ощущение мягкого согласия между животным и окружающей природой. Франц Марк написал картину в 1911 году. Место хранения: Ленбаххаус, Мюнхен.","sources":[{"label":"Lenbachhaus - Sammlung Online - Franz Marc, Blaues…","url":"https://www.lenbachhaus.de/digital/sammlung-online/detail/blaues-pferd-i-30019621"},{"label":"Blue Horse I — Wikipedia","url":"https://en.wikipedia.org/wiki/Blue_Horse_I"}],"tags":["Европейский модернизм XX века"],"position":"center 28%","originalImage":"originals/123.jpg","displayFragment":"fragments/123.jpg"},{"author":"Александра Экстер","title":"Вид Парижа","year":"1912","museum":"Местонахождение не установлено","image":"originals/124.jpg","description":"Париж складывается из домов, мостов и улиц, которые пересекаются под разными углами. Вместо одного устойчивого вида возникает впечатление прогулки, во время которой взгляд постоянно меняет направление. Экстер собирает эти наблюдения в плотную цветовую композицию, передавая живой ритм большого города. Александра Экстер написала картину в 1912 году. Место хранения: Местонахождение не установлено.","sources":[{"label":"Вид Парижа, 1912 - Александра Экстер - WikiArt.org","url":"https://www.wikiart.org/ru/aleksandra-ekster/vid-parizha-1912"},{"label":"UA View","url":"https://uaview.ui.org.ua/artist/exter-oleksandra"}],"tags":["Россия XX века"],"position":"center center","originalImage":"originals/124.jpg","displayFragment":"fragments/124.jpg"},{"author":"Анри Матисс","title":"Красные рыбки","year":"1912","museum":"Государственный музей изобразительных искусств имени А. С. Пушкина (ГМИИ), Москва","image":"originals/125.jpg","description":"Красные рыбки медленно движутся в стеклянном сосуде среди зелёных листьев и ярких предметов комнаты. Круглая поверхность воды становится спокойным центром насыщенной композиции. Матисс соединяет разные точки зрения и смелые цветовые сочетания, позволяя простому домашнему уголку наполниться ощущением света и неспешной жизни. Анри Матисс написал картину в 1912 году. Место хранения: Государственный музей изобразительных искусств имени А. С. Пушкина (ГМИИ), Москва.","sources":[{"label":"Матисс А. Картина. Красные рыбы (Золотые рыбки). 1912","url":"https://collection.pushkinmuseum.art/entity/OBJECT/78209"},{"label":"Красные рыбы (Золотые рыбки)","url":"https://ar.culture.ru/mdf/subject/krasnye-ryby-zolotye-rybki"}],"tags":["Европейский модернизм XX века"],"position":"center 28%","originalImage":"originals/125.jpg","displayFragment":"fragments/125.jpg"},{"author":"Кузьма Петров-Водкин","title":"Купание красного коня","year":"1912","museum":"Государственная Третьяковская галерея, Москва","image":"originals/126.jpg","description":"Огромный красный конь входит в воду, неся на спине тонкую фигуру юноши. Его цвет резко выделяется на холодном фоне и подчиняет себе всё пространство. Петров-Водкин соединяет плавные очертания и напряжённый масштаб, благодаря чему сцена купания приобретает торжественную, почти символическую силу. Кузьма Петров-Водкин написал картину в 1912 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Купание красного коня","url":"https://my.tretyakov.ru/app/masterpiece/8399?lang=en"},{"label":"Лаврус - История одной картины. «Купание красного к…","url":"https://lavrus.tretyakov.ru/publications/istoriya-odnoy-kartiny-kupanie-krasnogo-konya-kuzmy-petrova-vodkina-/"}],"tags":["Россия XX века","Русская классика"],"position":"center center","originalImage":"originals/126.jpg","displayFragment":"fragments/126.jpg"},{"author":"Михаил Ларионов","title":"Петух. Лучистый этюд","year":"1912","museum":"Государственная Третьяковская галерея, Москва","image":"originals/127.jpg","description":"Среди пересекающихся цветных лучей угадывается петух, но его фигура словно растворяется в окружающем движении. Линии расходятся в разные стороны, заставляя взгляд непрерывно менять направление. Ларионов переводит впечатление от птицы в игру света и энергии, сохраняя лишь намёк на исходный образ. Михаил Ларионов написал картину в 1912 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Лекция «Михаил Ларионов» - Третьяковская галерея","url":"https://www.tretyakovgallery.ru/events/o/lektsiya-mikhail-larionov-10-2026/"},{"label":"Художественные объединения и группировки 1910-1920-…","url":"https://www.tretyakovgallery.ru/edu/o/khudozhestvennye-obedineniya-i-gruppirovki-1910-kh-1920-kh-godov_2023/"}],"tags":["Абстракция","Россия XX века"],"position":"center 28%","originalImage":"originals/127.jpg","displayFragment":"fragments/127.jpg"},{"author":"Хуан Грис","title":"Портрет Пабло Пикассо","year":"1912","museum":"Чикагский институт искусств, Чикаго","image":"originals/128.jpg","description":"Лицо и фигура Пикассо собраны из угловатых плоскостей, которые то выступают вперёд, то уходят в глубину. Несмотря на это дробление, взгляд и посадка головы остаются узнаваемыми. Хуан Грис соединяет разные ракурсы в одном портрете, предлагая рассматривать человека постепенно, как сложную пространственную форму. Хуан Грис написал картину в 1912 году. Место хранения: Чикагский институт искусств, Чикаго.","sources":[{"label":"Portrait of Pablo Picasso — The Art Institute of Ch…","url":"https://www.artic.edu/artworks/8624/portrait-of-pablo-picasso"},{"label":"Portrait of Pablo Picasso - Juan Gris (Spanish, 188…","url":"https://artsandculture.google.com/asset/portrait-of-pablo-picasso-juan-gris-spanish-1887%E2%80%931927/RgGPipJ4FxSBiw?hl=en"}],"tags":["Европейский модернизм XX века"],"position":"center 28%","originalImage":"originals/128.jpg","displayFragment":"fragments/128.jpg"},{"author":"Александра Экстер","title":"Натюрморт","year":"1913","museum":"Национальный музей Тиссена-Борнемисы, Мадрид","image":"originals/129.jpg","description":"Посуда, фрукты и фрагменты надписей тесно собраны на поверхности стола. Одни формы кажутся объёмными, другие словно приклеены к плоскости картины. Экстер сталкивает эти разные способы видеть предметы, создавая натюрморт, где привычная домашняя обстановка превращается в подвижное сочетание цвета и геометрии. Александра Экстер написала картину в 1913 году. Место хранения: Национальный музей Тиссена-Борнемисы, Мадрид.","sources":[{"label":"Still Life - Exter, Alexandra. Museo Nacional Thyss…","url":"https://www.museothyssen.org/en/collection/artists/exter-alexandra/still-life"},{"label":"In the Eye of the Storm: Modernism in Ukraine, 1900…","url":"https://www.museothyssen.org/en/eye-storm-modernism-ukraine-1900-1930s"}],"tags":["Россия XX века"],"position":"center 28%","originalImage":"originals/129.jpg","displayFragment":"fragments/129.jpg"},{"author":"Аристарх Лентулов","title":"Москва","year":"1913","museum":"Государственная Третьяковская галерея, Москва","image":"originals/130.jpg","description":"Московские купола, крыши и улицы теснятся на полотне, складываясь в яркую панораму. Здания дробятся на фрагменты, но сохраняют узнаваемые силуэты. Лентулов собирает город из множества пересекающихся впечатлений, и его архитектура кажется наполненной движением, светом и праздничным шумом. Аристарх Лентулов написал картину в 1913 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Москва","url":"https://my.tretyakov.ru/app/masterpiece/8425"},{"label":"Открытие выставки «Аристарх Лентулов. Плоть вещей»…","url":"https://www.tretyakovgallerymagazine.ru/news/otkrytie-vystavki-aristarkh-lentulov-plot-veshchei-v-galeree-nashi-khudozhniki"}],"tags":["Россия XX века"],"position":"center center","originalImage":"originals/130.jpg","displayFragment":"fragments/130.jpg"},{"author":"Аристарх Лентулов","title":"Собор Василия Блаженного","year":"1913","museum":"Государственная Третьяковская галерея, Москва","image":"originals/131.jpg","description":"Купола и башни собора Василия Блаженного поднимаются среди ярких, пересекающихся плоскостей. Здание словно раскрывается сразу с нескольких сторон, сохраняя свой узнаваемый силуэт. Лентулов усиливает цвет и ритм архитектуры, придавая неподвижному собору ощущение звучащего, праздничного движения. Аристарх Лентулов написал картину в 1913 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Василий Блаженный — Третьяковская галерея","url":"https://my.tretyakov.ru/app/masterpiece/11078"},{"label":"File:Lentulov. Saint Basil's Cathedral.jpg - Wikime…","url":"https://commons.wikimedia.org/wiki/File%3ALentulov._Saint_Basil%27s_Cathedral.jpg"},{"label":"Собор Василия Блаженного, 1913 - Аристарх Лентулов…","url":"https://www.wikiart.org/ru/aristarkh-lentulov/sobor-vasiliya-blazhennogo-1913"}],"tags":["Россия XX века"],"position":"center 28%","originalImage":"originals/131.jpg","displayFragment":"fragments/131.jpg"},{"author":"Василий Кандинский","title":"Композиция VII","year":"1913","museum":"Государственная Третьяковская галерея, Москва","image":"originals/132.jpg","description":"Цветные дуги, пятна и линии образуют плотное движение, в котором трудно найти единственный центр. Одни участки вспыхивают ярче, другие словно уходят в глубину и возвращают взгляд обратно. Кандинский соединяет эти столкновения в сложный ритм, позволяя воспринимать картину как последовательность напряжений и пауз. Василий Кандинский написал картину в 1913 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Композиция VII","url":"https://my.tretyakov.ru/app/masterpiece/10873?lang=en"},{"label":"Композиция VII | Каталог иллюстраций журнала \"ТРЕТЬ…","url":"https://www.tg-m.ru/catalog/picture/15264"}],"tags":["Абстракция","Европейский модернизм XX века"],"position":"center center","originalImage":"originals/132.jpg","displayFragment":"fragments/132.jpg"},{"author":"Василий Кандинский","title":"Цветовой этюд. Квадраты с концентрическими кругами","year":"1913","museum":"Ленбаххаус, Мюнхен","image":"originals/133.jpg","description":"В каждом квадрате расположены цветные круги, похожие по устройству, но разные по впечатлению. Одни сочетания кажутся тёплыми и спокойными, другие — резкими и подвижными. Кандинский повторяет простую форму, чтобы внимание сосредоточилось на том, как соседние краски усиливают или изменяют друг друга. Василий Кандинский создал этот цветовой этюд в 1913 году. Место хранения: Ленбаххаус, Мюнхен.","sources":[{"label":"Lenbachhaus - Sammlung Online - Wassily Kandinsky,…","url":"https://www.lenbachhaus.de/digital/sammlung-online/detail/farbstudie-quadrate-mit-konzentrischen-ringen-30017624"},{"label":"Lenbachhaus - Wassily Kandinsky (1866–1944)","url":"https://www.lenbachhaus.de/digital/sammlung-online/person/kandinsky-wassily-7430?cHash=b3fd878b5babc4c8ab977ab314c4bd65&tx_so_displaypersonen%5Bobjekt%5D=5161"}],"tags":["Абстракция","Европейский модернизм XX века"],"position":"center center","originalImage":"originals/133.jpg","displayFragment":"fragments/133.jpg"},{"author":"Эрнст Людвиг Кирхнер","title":"Берлинская улица","year":"1913","museum":"Музей современного искусства (MoMA), Нью-Йорк","image":"originals/134.jpg","description":"Нарядные женщины и прохожие движутся по тесной берлинской улице, почти не встречаясь взглядами. Вытянутые фигуры и острые углы придают пространству беспокойный ритм. Кирхнер использует напряжённые цветовые сочетания, позволяя почувствовать притягательность большого города вместе с его отчуждённостью. Эрнст Людвиг Кирхнер написал картину в 1913 году. Место хранения: Музей современного искусства (MoMA), Нью-Йорк.","sources":[{"label":"Ernst Ludwig Kirchner. Street, Berlin. 1913 | MoMA","url":"https://www.moma.org/collection/works/79354?sov_referrer=theme"},{"label":"Kirchner and the Berlin Street | MoMA","url":"https://www.moma.org/calendar/exhibitions/32"}],"tags":["Европейский модернизм XX века"],"position":"center 28%","originalImage":"originals/134.jpg","displayFragment":"fragments/134.jpg"},{"author":"Джорджо де Кирико","title":"Меланхолия и тайна улицы","year":"1914","museum":"Частное собрание","image":"originals/135.jpg","description":"Девочка катит обруч по пустой улице, уходящей между длинными аркадами. Впереди появляется тень, источник которой скрыт от зрителя. Де Кирико соединяет ясное освещение с непривычной пустотой и резкой перспективой, превращая простой городской вид в ожидание неизвестного события. Джорджо де Кирико написал картину в 1914 году. Место хранения: Частное собрание.","sources":[{"label":"Mystery and Melancholy of a Street","url":"https://en.wikipedia.org/wiki/Mystery_and_Melancholy_of_a_Street"},{"label":"Twentieth-century Italian art","url":"https://assets.moma.org/documents/moma_catalogue_2819_300086898.pdf"}],"tags":["Европейский модернизм XX века","Сюрреализм"],"position":"center 28%","originalImage":"originals/135.jpg","displayFragment":"fragments/135.jpg"},{"author":"Натан Альтман","title":"Анна Ахматова","year":"1914","museum":"Государственный Русский музей, Санкт-Петербург","image":"originals/136.jpg","description":"Анна Ахматова сидит в синем платье на фоне угловатых цветовых форм. Её спокойное лицо сохраняет портретную точность, тогда как одежда и пространство словно собраны из граней. Альтман соединяет сдержанность позы с энергией геометрического рисунка, подчёркивая собранность и внутреннюю независимость героини. Натан Альтман написал картину в 1914 году. Место хранения: Государственный Русский музей, Санкт-Петербург.","sources":[{"label":"Альтман Н. И. Портрет А. А. Ахматовой - Виртуальный…","url":"https://rusmuseumvrm.ru/data/collections/painting/19_20/zhb-1311/index.php"},{"label":"Altman Nathan. Portrait of Anna Akhmatova. 1914","url":"https://www.rmgallery.rusmuseumvrm.ru/en/754"}],"tags":["Россия XX века"],"position":"center 28%","originalImage":"originals/136.jpg","displayFragment":"fragments/136.jpg"},{"author":"Соня Делоне","title":"Электрические призмы","year":"1914","museum":"Центр Помпиду, Париж","image":"originals/137.jpg","description":"Цветные круги и дуги перекрывают друг друга, напоминая свет, разбитый на множество оттенков. Рядом оказываются прозрачные и плотные участки, отчего поверхность кажется мерцающей. Соня Делоне передаёт ощущение электрического освещения через ритм цвета, позволяя увидеть движение без изображения конкретного предмета. Соня Делоне написала картину в 1914 году. Место хранения: Центр Помпиду, Париж.","sources":[{"label":"Prismes électriques (couleurs simultanées) - Centre…","url":"https://www.centrepompidou.fr/fr/ressources/oeuvre/zS28bfR"},{"label":"Sonia DELAUNAY (Sarah Sophie STERN TERK, dite) - Pr…","url":"https://collection.centrepompidou.fr/artwork/sonia-delaunay-sarah-sophie-stern-terk-dite-prismes-electriques-150000000029902"}],"tags":["Абстракция","Европейский модернизм XX века"],"position":"center center","originalImage":"originals/137.jpg","displayFragment":"fragments/137.jpg"},{"author":"Александра Экстер","title":"Венеция","year":"1915","museum":"Местонахождение не установлено","image":"originals/138.jpg","description":"Венецианские здания и вода распадаются на яркие угловатые фрагменты. Разные направления линий заставляют взгляд постоянно переходить от одной части города к другой. Экстер сохраняет узнаваемые архитектурные мотивы, но связывает их прежде всего движением красок, словно передаёт несколько впечатлений от Венеции одновременно. Александра Экстер написала картину в 1915 году. Место хранения: Местонахождение не установлено.","sources":[{"label":"Alexandra Exter (1882-1949) - Association Alexandra…","url":"https://alexandra-exter.net/biographie/"},{"label":"Amazons of the avant-garde : Alexandra Exter ... [e…","url":"https://www.iljine.net/wp-content/uploads/PDFs/Amazons_of_the_Avant-Garde.pdf"}],"tags":["Россия XX века"],"position":"center 28%","originalImage":"originals/138.jpg","displayFragment":"fragments/138.jpg"},{"author":"Борис Кустодиев","title":"Масленица","year":"1916","museum":"Государственный Русский музей, Санкт-Петербург","image":"originals/139.jpg","description":"По заснеженному городу едут сани, а вокруг домов и церквей собираются праздничные толпы. Холодный снег оживляют яркие одежды, вывески и тёплые цветовые пятна. Кустодиев поднимает точку зрения, позволяя охватить множество маленьких событий и почувствовать размах зимнего гулянья. Борис Кустодиев написал картину в 1916 году. Место хранения: Государственный Русский музей, Санкт-Петербург.","sources":[{"label":"Кустодиев Б. М. Масленица - Виртуальный Русский музей","url":"https://rusmuseumvrm.ru/data/collections/painting/19_20/zh_4358/index.php"},{"label":"Виртуальный тур по Русскому музею","url":"https://www.virtual.rusmuseumvrm.ru/benois_wing/collection/russkoe_iskusstvo_hh__nachala_xxi_veka/maslenica/index.php?lang=ru"}],"tags":["Россия XX века","Русская классика"],"position":"center center","originalImage":"originals/139.jpg","displayFragment":"fragments/139.jpg"},{"author":"Василий Кандинский","title":"Москва. Красная площадь («Москва I»)","year":"1916","museum":"Государственная Третьяковская галерея, Москва","image":"originals/140.jpg","description":"Купола, здания и огни Москвы складываются в пёстрый вихрь вокруг площади. Знакомые приметы города появляются и исчезают среди свободных цветовых пятен. Кандинский передаёт город как сильное, многослойное впечатление, в котором архитектура ещё узнаваема, но уже подчиняется собственному ритму красок. Василий Кандинский написал картину в 1916 году. Место хранения: Государственная Третьяковская галерея, Москва.","sources":[{"label":"Василий Кандинский — \"Москва. Красная площадь\", 191…","url":"https://www.wassilykandinsky.ru/work-38.php"},{"label":"Москва. Красная площадь","url":"https://ru.wikipedia.org/wiki/%D0%9C%D0%BE%D1%81%D0%BA%D0%B2%D0%B0._%D0%9A%D1%80%D0%B0%D1%81%D0%BD%D0%B0%D1%8F_%D0%BF%D0%BB%D0%BE%D1%89%D0%B0%D0%B4%D1%8C"}],"tags":["Абстракция","Европейский модернизм XX века"],"position":"center center","originalImage":"originals/140.jpg","displayFragment":"fragments/140.jpg"},{"author":"Казимир Малевич","title":"Супрематическая композиция","year":"1916","museum":"Частное собрание","image":"originals/141.jpg","description":"Наклонённые прямоугольники и небольшие цветные фигуры словно зависают в свободном белом пространстве. Их размеры и направления создают напряжение без привычного сюжета. Малевич заставляет взгляд чувствовать вес, расстояние и движение простых форм, превращая пустой фон в активную часть композиции. Казимир Малевич написал картину в 1916 году. Место хранения: Частное собрание.","sources":[{"label":"RELEASE: Kazimir Malevich’s Revolutionary Supremati…","url":"https://press.christies.com/releasenbspkazimir-malevichs-revolutionary-suprematist-composition-1916-to-lead-christies-evening-sale-of-impressionist-and-modern-art/?lang=eng"},{"label":"‘My highlight of 2018’ — Suprematist Composition by…","url":"https://www.christies.com/en/stories/my-highlight-of-2018-suprematist-composition-by-kazimir-malevich-dc89890de0824d38bd0cf2d7faba61f2"}],"tags":["Абстракция","Европейский модернизм XX века"],"position":"center 28%","originalImage":"originals/141.jpg","displayFragment":"fragments/141.jpg"},{"author":"Клод Моне","title":"Кувшинки","year":"1916–1919","museum":"Музей Мармоттан-Моне, Париж","image":"originals/142.jpg","description":"На поверхности пруда кувшинки соседствуют с отражениями неба и свисающих ветвей. Мягкие цветовые переходы стирают границу между водой и тем, что в ней отражается. Моне погружает взгляд в тесное переплетение зелени и света, создавая пейзаж, у которого почти невозможно найти начало или край. Клод Моне написал картину в 1916–1919 годах. Место хранения: Музей Мармоттан-Моне, Париж.","sources":[{"label":"Кувшинки Моне — музей Мармоттан-Моне","url":"https://www.marmottan.fr/wp-content/uploads/2023/07/DPinstit-BD_230621.pdf"},{"label":"Nymphéas — Musée Marmottan Monet","url":"https://www.marmottan.fr/notice/5164/"}],"tags":["Импрессионизм и постимпрессионизм"],"position":"center center","originalImage":"originals/142.jpg","displayFragment":"fragments/142.jpg"},{"author":"Ольга Розанова","title":"Беспредметная композиция","year":"около 1916","museum":"Государственный Русский музей, Санкт-Петербург","image":"originals/143.jpg","description":"Большое красное поле пересечено узкой тёмной полосой, под которой виден ещё один красный участок. Минимальное число форм делает особенно заметными различия оттенков и границ. Розанова сосредоточивает всё внимание на самом цвете, позволяя почувствовать его плотность и силу без узнаваемого предметного образа. Ольга Розанова написала картину около 1916 года. Место хранения: Государственный Русский музей, Санкт-Петербург.","sources":[{"label":"Ольга Розанова — Центр Помпиду","url":"https://www.centrepompidou.fr/en/offre-aux-professionnels/enseignants/dossiers-ressources-sur-lart/naissance-de-lart-abstrait/olga-rozanova"},{"label":"Беспредметная композиция — Виртуальный Русский музей","url":"https://rusmuseumvrm.ru/data/collections/painting/19_20/zhb-1382/index.php"}],"tags":["Абстракция","Россия XX века"],"position":"center 28%","originalImage":"originals/143.jpg","displayFragment":"fragments/143.jpg"},{"author":"Александра Экстер","title":"Эскиз костюма Саломеи","year":"1917","museum":"Театральный музей имени А. А. Бахрушина, Москва","image":"originals/144.jpg","description":"Фигура Саломеи показана в резком повороте, который продолжается в длинных изгибах костюма. Цветные плоскости и острые линии словно заранее задают движение тела на сцене. Экстер делает одежду частью танца, соединяя силуэт актрисы с пространством, которое она сможет занять жестом. Александра Экстер создала эскиз в 1917 году. Место хранения: Театральный музей имени А. А. Бахрушина, Москва.","sources":[{"label":"Costume design for Salomé’s dance of the seven veils","url":"https://www.fulcrum.org/concern/file_sets/8p58pc930"},{"label":"Экстер А.А. Эскиз костюма. Саломея. Танец семи покр…","url":"https://collectiononline.gctm.ru/entity/OBJECT/63073"}],"tags":["Россия XX века"],"position":"center 28%","originalImage":"originals/144.jpg","displayFragment":"fragments/144.jpg"},{"author":"Александра Экстер","title":"Эскиз костюма к «Танцу семи покрывал»","year":"1917","museum":"Местонахождение не установлено","image":"originals/145.jpg","description":"Женские фигуры представлены в угловатых платьях и высоких головных уборах. Контрастные цвета и крупные формы делают каждый силуэт отчётливым даже без подробной прорисовки лица. Экстер строит костюм как продолжение сценического движения, в котором поворот тела должен менять весь рисунок образа. Александра Экстер создала эскиз в 1917 году. Место хранения: Местонахождение не установлено.","sources":[{"label":"salome, costumes for dance of seven veils 1917 — Exter","url":"https://gallerix.org/storeroom/230942505/N/891951745/"},{"label":"Costume design for Salomé’s dance of the seven veils","url":"https://www.fulcrum.org/concern/file_sets/8p58pc930"}],"tags":["Россия XX века"],"position":"center 28%","originalImage":"originals/145.jpg","displayFragment":"fragments/145.jpg"},{"author":"Любовь Попова","title":"Композиция с чёрным, золотым и коричневым","year":"1917","museum":"Музей современного искусства (MAC/CCB), Лиссабон","image":"originals/146.jpg","description":"Чёрные, золотистые и коричневые плоскости перекрывают друг друга на светлом фоне. Их края задают разные направления, заставляя одни части выступать вперёд, а другие отступать. Попова создаёт глубину из простого наложения форм, и неподвижная композиция начинает напоминать напряжённое взаимодействие сил. Любовь Попова написала картину в 1917 году. Место хранения: Музей современного искусства (MAC/CCB), Лиссабон.","sources":[{"label":"Composition in Black Gold and Brown by Liubov Popova","url":"https://www.arthistoryproject.com/artists/liubov-popova/composition/"},{"label":"Pioneers. Women Artists of the Russian Avant-Garde…","url":"https://www.museothyssen.org/en/visit/thematic-tours/pioneers-women-artists-russian-avant-garde"}],"tags":["Абстракция","Россия XX века"],"position":"center 28%","originalImage":"originals/146.jpg","displayFragment":"fragments/146.jpg"},{"author":"Марк Шагал","title":"Прогулка","year":"1917","museum":"Государственный Русский музей, Санкт-Петербург","image":"originals/147.jpg","description":"Шагал стоит на земле и держит за руку Беллу, которая свободно парит над городом. Их соединённые руки делают невозможный полёт удивительно естественным. Знакомый пейзаж становится частью личной сказки, где радость близости оказывается сильнее привычной тяжести тела. Марк Шагал написал картину в 1917 году. Место хранения: Государственный Русский музей, Санкт-Петербург.","sources":[{"label":"Шагал М.З. Прогулка - Виртуальный Русский музей","url":"https://rusmuseumvrm.ru/data/collections/painting/19_20/zhb_1726/index.php"},{"label":"Шагал М.З. Прогулка. 1917 | Проект \"Русский музей:…","url":"https://virtualrm.spb.ru/fi/node/12174"}],"tags":["Европейский модернизм XX века","Россия XX века"],"position":"center 28%","originalImage":"originals/147.jpg","displayFragment":"fragments/147.jpg"},{"author":"Борис Кустодиев","title":"Купчиха за чаем","year":"1918","museum":"Государственный Русский музей, Санкт-Петербург","image":"originals/148.jpg","d
